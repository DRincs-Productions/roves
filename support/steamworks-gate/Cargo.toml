# Standalone Steamworks feasibility gate: steamworks-rs initialization, callback dispatch and
# shutdown on Windows, macOS and Linux. Separate Cargo workspace: not part of the Windows
# player (support/cef-netrender-probe), of the CEF macOS/Linux gates, of their CI, or of any
# shipped target. See README.md.
#
# steamworks =0.13.1 / steamworks-sys 0.13.0 are the versions the legacy Servo shell's
# `steam` feature resolved (git 27ca0811d6d Cargo.lock, same checksums), so a pass here speaks
# about the same bindings and the same bundled Steamworks SDK redistributables.
[package]
name = "roves_steamworks_gate"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"

[workspace]

[[bin]]
name = "roves-steamworks-gate"
path = "src/main.rs"

[dependencies]
steamworks = "=0.13.1"
