<!doctype html>
<meta charset="utf-8"><title>Worker fixed-work compute probe</title>
<link rel="icon" href="data:,"><pre>Fixed-work worker compute diagnostic</pre>
<script>
const params = new URLSearchParams(location.search);
window.runCompute = async function(count) {
 const jobs = Number(params.get('jobs') ?? 64), iterations = Number(params.get('iterations') ?? 1024 * 1024);
 if(!Number.isSafeInteger(jobs)||jobs<1||jobs>4096||!Number.isSafeInteger(iterations)||iterations<1||iterations>16*1024*1024)throw Error('invalid work size');
 const cached = params.get('cached') === '1';
 const expected = (seed, n) => {
  let m = 1664525, a = 1013904223, x = seed | 0;
  while (n) {
   if (n & 1) x = (Math.imul(m, x) + a) | 0;
   a = Math.imul(a, (m + 1) | 0) | 0; m = Math.imul(m, m); n = Math.floor(n / 2);
  }
  return x;
 };
 const code = `${cached ? 'const imul=Math.imul;' : ''}onmessage=({data:{id,seed,iterations}})=>{let x=seed|0;for(let i=0;i<iterations;i++)x=(${cached ? 'imul' : 'Math.imul'}(x,1664525)+1013904223)|0;postMessage({id,value:x})};postMessage('ready');`;
 const url = URL.createObjectURL(new Blob([code], {type:'text/javascript'}));
 const workers = [], start = performance.now();
 let lastFrame, maxFrame = 0, frames = 0, sampling = false, timer;
 const frame = now => { if (!sampling) return; if(lastFrame!==undefined) maxFrame=Math.max(maxFrame,now-lastFrame); lastFrame=now;frames++;requestAnimationFrame(frame); };
 const phase = value => console.log('WORKERCOMPUTE '+JSON.stringify(value));
 try {
  for(let i=0;i<count;i++) {
   const worker = new Worker(url); workers.push(worker);
  }
  await Promise.all(workers.map(worker => new Promise((resolve,reject)=>{
   worker.onerror=e=>reject(Error(e.message));worker.onmessage=({data})=>{if(data==='ready')resolve()};
  })));
  const startup = performance.now()-start;
  await Promise.all(workers.map(worker=>new Promise((resolve,reject)=>{
   worker.onerror=e=>reject(Error(e.message));worker.onmessage=({data})=>data.value===expected(1,iterations)?resolve():reject(Error('warmup mismatch'));
   worker.postMessage({id:-1,seed:1,iterations});
  })));
  let next=0,completed=0;
  sampling=true;requestAnimationFrame(frame);
  phase({phase:'running',workers:count,cached,jobs,iterations,startup_ms:startup});
  const begin=performance.now();
  await new Promise((resolve,reject)=>{
   timer=setTimeout(()=>reject(Error('compute timeout')),60000);
   const send = worker => {if(next<jobs){const id=next++;worker.postMessage({id,seed:id+1,iterations})}};
   for(const worker of workers){
    worker.onerror=e=>reject(Error(e.message));
    worker.onmessage=({data})=>{
     if(data.value!==expected(data.id+1,iterations)){reject(Error('result mismatch'));return;}
     completed++;if(completed===jobs)resolve();else send(worker);
    };send(worker);
   }
  });
  const result={phase:'PASS',workers:count,cached,jobs,iterations,elapsed_ms:performance.now()-begin,startup_ms:startup,frames,max_frame_ms:maxFrame,hardwareConcurrency:navigator.hardwareConcurrency};
  phase(result);return result;
 } finally {clearTimeout(timer);sampling=false;for(const worker of workers)worker.terminate();URL.revokeObjectURL(url);}
};
const count=Number(params.get('workers'));
// Fixed total work; increasing concurrency does not reduce the required computation.
// Compare global intrinsic lookup with the cached-function control. Check every result.
// Short fast runs provide too few rAF samples for a meaningful frame percentile.
if([1,2,4,8].includes(count)){
 window.computeRun=window.runCompute(count);
 window.computeRun.then(()=>{if(params.get('auto')==='1')window.close()},e=>{console.log('WORKERCOMPUTE '+JSON.stringify({phase:'FAIL',error:String(e)}));if(params.get('auto')==='1')window.close()});
}
</script>
