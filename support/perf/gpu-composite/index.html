<!doctype html>
<!--
  Roves vs Chrome GPU canvas compositing fixture (see README.md next to this file).
  One self-contained file, the same bytes in both engines: the Roves Blitz probe
  `--game <this dir> --window` (GPU window presentation, captured natively from
  the screen) and Chrome DevTools on file:///.../index.html at 640x360 DPR 1.
  Inline classic script only (the probe skips external classic scripts, Chrome
  refuses module scripts on file://). Two opaque WebGPU canvases are drawn every
  rAF frame through the same getContext("webgpu") / getCurrentTexture / submit
  path PixiJS uses; DOM boxes are painted under, over and around them, one with
  backdrop-filter: blur(). The #gc-cases JSON is the single source of geometry
  and expectations for the page and check.py.
-->
<html>
<head>
<meta charset="utf-8">
<title>Roves GPU composite</title>
<style>
  html, body { margin: 0; padding: 0; background: rgb(255, 255, 255); overflow: hidden; }
  canvas, .abs { position: absolute; margin: 0; display: block; }
  #under { left: 0px; top: 230px; width: 60px; height: 60px; background: rgb(255, 0, 255); }
  #gpu-a { left: 20px; top: 20px; width: 400px; height: 240px; }
  #fg { left: 40px; top: 40px; width: 60px; height: 40px; background: rgb(255, 255, 0); }
  #fg-alpha { left: 340px; top: 40px; width: 60px; height: 40px; background: rgba(255, 255, 255, 0.5); }
  #glass { left: 140px; top: 80px; width: 160px; height: 100px;
           background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(8px); }
  #clipbox { left: 460px; top: 20px; width: 120px; height: 80px; overflow: hidden; }
  #gpu-b { left: -40px; top: -40px; width: 200px; height: 160px; }
  #fg-clip { left: 40px; top: 20px; width: 40px; height: 40px; background: rgb(0, 0, 0); }
  #gc-report { display: none; }
</style>
<script type="application/json" id="gc-cases">
{
  "fixture_version": "2026-11-21.1",
  "viewport": [640, 360],
  "background": [255, 255, 255],
  "report_frame": 30,
  "canvases": {
    "gpu-a": { "size": [400, 240], "draw": "pattern", "split_x": 200, "band_y": 180,
               "left": [1, 0, 0], "right": [0, 0, 1], "band": [0, 1, 0] },
    "gpu-b": { "size": [200, 160], "draw": "clear", "color": [0, 1, 1] }
  },
  "tolerance": { "color": 6, "px": 0.5, "inset": 3, "ring_inner": 2, "ring_outer": 6 },
  "state": {
    "gpu-a": [20, 20, 400, 240], "gpu-b": [420, -20, 200, 160], "clipbox": [460, 20, 120, 80],
    "fg": [40, 40, 60, 40], "fg-alpha": [340, 40, 60, 40], "glass": [140, 80, 160, 100],
    "under": [0, 230, 60, 60], "fg-clip": [500, 40, 40, 40]
  },
  "cases": [
    { "id": "canvas-pixels", "gate": true,
      "note": "canvas content, orientation (green band at the bottom, red left) and white page outside",
      "paint": [{ "rect": [30, 100, 100, 90], "color": [255, 0, 0] },
                { "rect": [310, 100, 100, 90], "color": [0, 0, 255] },
                { "rect": [70, 205, 340, 50], "color": [0, 255, 0] },
                { "rect": [425, 150, 30, 100], "color": [255, 255, 255] },
                { "rect": [20, 300, 400, 50], "color": [255, 255, 255] }] },
    { "id": "dom-under-canvas", "gate": true,
      "note": "DOM painted before the opaque canvas: hidden where they overlap",
      "paint": [{ "rect": [20, 230, 40, 30], "color": [0, 255, 0] },
                { "rect": [0, 230, 20, 30], "color": [255, 0, 255] },
                { "rect": [0, 260, 60, 30], "color": [255, 0, 255] }] },
    { "id": "dom-foreground", "gate": true,
      "note": "opaque DOM after the canvas stays above it; canvas visible right around it",
      "paint": [{ "rect": [40, 40, 60, 40], "color": [255, 255, 0] }],
      "ring": { "bounds": [40, 40, 60, 40], "color": [255, 0, 0] } },
    { "id": "dom-foreground-alpha", "gate": true,
      "note": "50% white DOM over the blue canvas: one source-over blend",
      "paint": [{ "rect": [340, 40, 60, 40], "color": [128, 128, 255], "tolerance": 10 }],
      "ring": { "bounds": [340, 40, 60, 40], "color": [0, 0, 255] } },
    { "id": "backdrop-tint", "gate": true,
      "note": "backdrop-filter element: its 25% white background over the canvas, far (>= 26 px, > 3 sigma) from the red/blue edge and from its own edges; canvas unchanged just outside",
      "paint": [{ "rect": [166, 106, 28, 48], "color": [255, 64, 64], "inset": 0 },
                { "rect": [246, 106, 28, 48], "color": [64, 64, 255], "inset": 0 },
                { "rect": [128, 90, 8, 80], "color": [255, 0, 0], "inset": 0 },
                { "rect": [304, 90, 8, 80], "color": [0, 0, 255], "inset": 0 }] },
    { "id": "backdrop-blur-edge", "gate": false, "known": "known_no_blur",
      "note": "blur(8px) of the canvas edge at x 220 under #glass: pixels 1.5 px from the edge are a red/blue mix in Chrome (~174/145), sharp tints without blur",
      "paint": [],
      "expect": [{ "rect": [218, 106, 1, 48], "range": [[96, 224], [48, 80], [96, 224]], "inset": 0 },
                 { "rect": [221, 106, 1, 48], "range": [[96, 224], [48, 80], [96, 224]], "inset": 0 }],
      "alternative": [{ "rect": [218, 106, 2, 48], "color": [255, 64, 64], "tolerance": 8, "inset": 0 },
                      { "rect": [220, 106, 2, 48], "color": [64, 64, 255], "tolerance": 8, "inset": 0 }] },
    { "id": "canvas-clip", "gate": true,
      "note": "200x160 canvas inside a 120x80 overflow:hidden box with a DOM child over it: clipped to the box, black box above the canvas",
      "paint": [{ "rect": [460, 20, 40, 80], "color": [0, 255, 255] },
                { "rect": [540, 20, 40, 80], "color": [0, 255, 255] },
                { "rect": [500, 40, 40, 40], "color": [0, 0, 0] },
                { "rect": [424, 24, 32, 72], "color": [255, 255, 255], "inset": 0 },
                 { "rect": [584, 24, 32, 72], "color": [255, 255, 255], "inset": 0 },
                 { "rect": [424, 104, 192, 30], "color": [255, 255, 255], "inset": 0 }] }
  ]
}
</script>
</head>
<body><div id="gc-report"></div><div id="under" class="abs"></div><canvas id="gpu-a" width="400" height="240"></canvas><div id="fg" class="abs"></div><div id="fg-alpha" class="abs"></div><div id="glass" class="abs"></div><div id="clipbox" class="abs"><canvas id="gpu-b" width="200" height="160"></canvas><div id="fg-clip" class="abs"></div></div>
<script>
  (() => {
    "use strict";
    const out = {
      schema: "roves-gpu-composite", version: 1, fixture_version: null, status: "running",
      frames: 0, viewport: null, user_agent: String(globalThis.navigator?.userAgent ?? ""),
      webgpu: { format: null, gpu_errors: [] }, state: {}, info: {}, errors: [],
    };
    globalThis.__rovesGpuComposite = out;
    const message = (error) => String((error && (error.stack || error.message)) || error).slice(0, 400);
    const finish = (status) => {
      out.status = status;
      try {
        out.viewport = { inner_width: innerWidth, inner_height: innerHeight, device_pixel_ratio: devicePixelRatio };
      } catch (error) {
        out.errors.push("viewport: " + message(error));
      }
      console.log("ROVES_GPU_COMPOSITE_RESULT " + JSON.stringify(out));
      document.getElementById("gc-report").textContent = "GPU_COMPOSITE_DONE " + status;
    };
    const wgsl = (c) => {
      const v = (rgb) => "vec4f(" + rgb.map((x) => x.toFixed(1)).join(", ") + ", 1.0)";
      return [
        "@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {",
        "  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));",
        "  return vec4f(p[i], 0.0, 1.0);",
        "}",
        "@fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f {",
        "  if (p.y >= " + c.band_y.toFixed(1) + ") { return " + v(c.band) + "; }",
        "  if (p.x < " + c.split_x.toFixed(1) + ") { return " + v(c.left) + "; }",
        "  return " + v(c.right) + ";",
        "}",
      ].join("\n");
    };
    async function start() {
      const spec = JSON.parse(document.getElementById("gc-cases").textContent);
      out.fixture_version = spec.fixture_version;
      if (!globalThis.navigator?.gpu) { finish("no_webgpu"); return; }
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) { finish("no_adapter"); return; }
      const device = await adapter.requestDevice();
      try {
        device.addEventListener("uncapturederror", (event) => {
          if (out.webgpu.gpu_errors.length < 5) out.webgpu.gpu_errors.push(message(event.error?.message ?? event.error));
        });
      } catch (error) {
        out.errors.push("uncapturederror listener: " + message(error));
      }
      const format = typeof navigator.gpu.getPreferredCanvasFormat === "function"
        ? navigator.gpu.getPreferredCanvasFormat() : "bgra8unorm";
      out.webgpu.format = format;
      const targets = Object.entries(spec.canvases).map(([id, c]) => {
        const context = document.getElementById(id).getContext("webgpu");
        if (!context) throw new Error("getContext(webgpu) returned null for #" + id);
        context.configure({ device, format, alphaMode: "opaque" });
        let pipeline = null;
        if (c.draw === "pattern") {
          const module = device.createShaderModule({ code: wgsl(c) });
          pipeline = device.createRenderPipeline({
            layout: "auto",
            vertex: { module, entryPoint: "vs" },
            fragment: { module, entryPoint: "fs", targets: [{ format }] },
            primitive: { topology: "triangle-list" },
          });
        }
        return { c, context, pipeline };
      });
      // Every frame redraws the same content: deterministic, and the probe's
      // compositor presents the canvas texture of the latest submit.
      const draw = () => {
        const encoder = device.createCommandEncoder();
        for (const t of targets) {
          const color = t.c.draw === "clear" ? t.c.color : [0, 0, 0];
          const pass = encoder.beginRenderPass({
            colorAttachments: [{
              view: t.context.getCurrentTexture().createView(),
              clearValue: { r: color[0], g: color[1], b: color[2], a: 1 },
              loadOp: "clear", storeOp: "store",
            }],
          });
          if (t.pipeline) {
            pass.setPipeline(t.pipeline);
            pass.draw(3);
          }
          pass.end();
        }
        device.queue.submit([encoder.finish()]);
      };
      const read = () => {
        for (const id of Object.keys(spec.state)) {
          try {
            const r = document.getElementById(id).getBoundingClientRect();
            out.state[id] = [r.left, r.top, r.width, r.height];
          } catch (error) {
            out.state[id] = null;
            out.errors.push("rect " + id + ": " + message(error));
          }
        }
        try {
          out.info.backdrop_filter = String(getComputedStyle(document.getElementById("glass")).backdropFilter ?? "");
        } catch (error) {
          out.info.backdrop_filter = null;
        }
      };
      let frame = 0;
      let reported = false;
      const tick = () => {
        frame += 1;
        try {
          draw();
        } catch (error) {
          if (out.errors.length < 5) out.errors.push("frame " + frame + ": " + message(error));
        }
        if (!reported && frame >= spec.report_frame) {
          reported = true;
          out.frames = frame;
          read();
          finish(out.errors.length || out.webgpu.gpu_errors.length ? "errors" : "ok");
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
    start().catch((error) => {
      out.errors.push("setup: " + message(error));
      finish("failed");
    });
  })();
</script>
</body>
</html>
