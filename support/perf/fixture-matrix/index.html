<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Roves perf fixture matrix</title>
<style>
  html, body { margin: 0; padding: 0; background: #101418; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 640px; height: 360px; overflow: hidden;
           background: #1d2a3a; font-family: sans-serif; }
  #pixi { position: absolute; left: 0; top: 0; width: 640px; height: 360px; }
  .card { position: absolute; width: 69px; height: 62px; border-radius: 8px; color: #fff;
          font-size: 12px; line-height: 62px; text-align: center; }
  #mover { position: absolute; left: 40px; top: 262px; width: 80px; height: 80px;
           border-radius: 12px; background: #f4a261; }
  #glass { position: absolute; left: 40px; top: 236px; width: 560px; height: 108px;
           border-radius: 12px; background: rgba(255, 255, 255, 0.18); }
  #glass.blur { backdrop-filter: blur(8px); }
  #line { margin: 12px 16px; color: #fff; font-size: 15px; line-height: 20px; }
</style>
<script type="module" src="./case.js"></script>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./bench.js"></script>
</body>
</html>
