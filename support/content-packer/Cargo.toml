[package]
name = "roves-content-packer"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Packs a built game dist/ into a handful of tar+zstd archives (instead of shipping it as loose files), and extracts them back at launch time. See ../../CUSTOMIZATIONS.md."

[[bin]]
name = "roves-content-packer"
path = "src/main.rs"

[dependencies]
bpaf = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
glob = "0.3.3"
tar = "0.4.46"
walkdir = "2.5.0"
zstd = "0.13.3"
