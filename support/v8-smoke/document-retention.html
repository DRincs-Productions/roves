<!doctype html>
<meta charset="utf-8"><title>Single-document native heap snapshot scene</title>
<body><main id="kept"></main>
<script>
"use strict";
// A bounded duration scene for one long-lived document: 16 rounds, each of 8 create/remove
// cycles followed by 2 explicit collections (128 cycles, 32 collections); a debug build may write
// native snapshots at chosen ones (run.sh: 2, 16, 32 and post-settled 34). Every cycle also adds
// a self-capturing listener removed
// through AbortController and a self-capturing timer cancelled before it can run. A control DOM
// wrapper with a searchable tag and an active listener must stay reachable and dispatchable after
// every round (required). Released wrapper/closure cycles are checked through WeakRef only after
// all rounds and a final collection; dereferencing during the workload would keep targets alive
// under WeakRef's kept-during-job semantics. This scoped assertion does not establish overall
// retention or the absence of leaks.
const ROUNDS = 16;
const CYCLES_PER_ROUND = 8;
const COLLECTIONS_PER_ROUND = 2;
const COLLECTIONS = ROUNDS * COLLECTIONS_PER_ROUND;
const CYCLES = ROUNDS * CYCLES_PER_ROUND;
const PROBE_TAG = "roves-document-retention-probe";
const failures = [];
const report = (...parts) => console.log("ROVES-V8 document-retention " + parts.join(" "));
const fail = reason => { failures.push(reason); report("failure", reason); };
addEventListener("error", event => fail("error " + event.message));
addEventListener("unhandledrejection", event => fail("unhandledrejection " + String(event.reason)));
const nextTask = () => new Promise(resolve => setTimeout(resolve, 0));
// Runs of cancelled timer callbacks (must stay 0) and dispatches seen by the control listener.
let cancelledTimerRuns = 0;
let controlHits = 0;
function createAndRemoveNode() {
  const node = document.createElement("div");
  const probe = { rovesProbeTag: PROBE_TAG, node };
  node.rovesDocumentRetentionProbe = probe;
  node.rovesHits = 0;
  const controller = new AbortController();
  node.addEventListener("probe", () => { node.rovesHits++; }, { signal: controller.signal });
  // Cancelled at once: a run would show up after the round's next task.
  const timer = setTimeout(() => { cancelledTimerRuns++; node.rovesHits = -1; }, 0);
  clearTimeout(timer);
  document.body.append(node);
  node.dispatchEvent(new Event("probe"));
  const listened = node.rovesHits === 1;
  controller.abort();
  node.dispatchEvent(new Event("probe"));
  const aborted = listened && controller.signal.aborted && node.rovesHits === 1;
  const refs = { element: new WeakRef(node), probe: new WeakRef(probe) };
  node.remove();
  return { refs, removed: !node.isConnected, aborted };
}
function checkControl(control, round) {
  const before = controlHits;
  control.dispatchEvent(new Event("roves-control"));
  if (document.getElementById("kept") !== control || !control.rovesDocumentRetentionProbe ||
      control.rovesDocumentRetentionProbe.retained !== true || controlHits !== before + 1) {
    throw new Error("retained control lost after round " + round);
  }
}
async function main() {
  const api = typeof TestUtils === "object" && typeof TestUtils.gc === "function";
  report("api", String(api));
  if (!api) throw new Error("TestUtils.gc unavailable");
  const control = document.getElementById("kept");
  // Never aborted: the control listener must keep running after every round.
  const controlListener = new AbortController();
  control.rovesDocumentRetentionProbe = { rovesProbeTag: PROBE_TAG, retained: true, controlListener };
  control.addEventListener("roves-control", () => { controlHits++; }, { signal: controlListener.signal });
  // Keep only WeakRefs across rounds. Do not dereference them during the workload: WeakRef targets
  // are kept alive through the current job and can therefore contaminate later round collections.
  const rounds = [];
  let collections = 0;
  for (let round = 1; round <= ROUNDS; round++) {
    const cycles = Array.from({ length: CYCLES_PER_ROUND }, createAndRemoveNode);
    rounds.push(cycles.map(cycle => cycle.refs));
    const removed = cycles.every(cycle => cycle.removed);
    const aborted = cycles.every(cycle => cycle.aborted);
    report("round", round, "created", cycles.length, "removed", String(removed), "listeners aborted", String(aborted));
    if (!removed) throw new Error("node still connected in round " + round);
    if (!aborted) throw new Error("listener not aborted in round " + round);
    // Leave the creating task so WeakRef targets are no longer kept for the current job.
    await nextTask();
    if (cancelledTimerRuns !== 0) throw new Error("cancelled timer ran in round " + round);
    for (let i = 0; i < COLLECTIONS_PER_ROUND; i++) { await TestUtils.gc(); collections++; }
    await nextTask();
    checkControl(control, round);
    report("round", round, "cycles", CYCLES_PER_ROUND, "collections", collections, "retained control true");
  }
  report("node created true removed true");
  report("rounds complete", ROUNDS, "cycles", CYCLES);
  if (cancelledTimerRuns !== 0) throw new Error("cancelled timer ran after the last round");
  report("cleanup complete listeners aborted", CYCLES, "timers cancelled", CYCLES);
  report("collections complete", String(collections));
  if (collections !== COLLECTIONS) throw new Error("expected " + COLLECTIONS + " collections, ran " + collections);
  checkControl(control, ROUNDS);
  report("retained control", "true");
  // Yield after the final workload task so its WeakRef targets are no longer kept alive.
  await nextTask();
  // Collect after that boundary so the final assertion doesn't confuse kept-alive targets with retainers.
  await TestUtils.gc();
  await nextTask();
  report("final release verification collection", "complete");
  const finalRelease = rounds.map(refs => ({
    elements: refs.filter(ref => ref.element.deref() === undefined).length,
    probes: refs.filter(ref => ref.probe.deref() === undefined).length,
    total: refs.length,
  }));
  const sum = key => finalRelease.reduce((total, round) => total + round[key], 0);
  const elementsReleased = sum("elements"), probesReleased = sum("probes"), total = sum("total");
  report("diagnostic released element", String(elementsReleased === total), "probe", String(probesReleased === total));
  report("diagnostic released counts", "elements", elementsReleased, "probes", probesReleased, "total", total);
  if (elementsReleased !== total || probesReleased !== total) {
    throw new Error("temporary wrapper/probe WeakRefs remain after all rounds");
  }
}
let resultReported = false;
function reportResult() {
  if (resultReported) return;
  resultReported = true;
  report("result", failures.length ? "fail " + failures.join("; ") : "pass");
}
function collectAfterSceneSettled() {
  if (typeof TestUtils === "undefined" || typeof TestUtils.gc !== "function") return reportResult();
  // Do not retain main()'s async frame while taking the final diagnostic snapshot. The timer
  // runs after its promise and local `rounds` array have settled and left the active task.
  setTimeout(() => {
    Promise.resolve().then(() => TestUtils.gc()).then(() => {
      report("post-settled collection", "complete");
      reportResult();
    }, error => {
      fail("post-settled collection " + error.name + " " + error.message);
      reportResult();
    });
  }, 0);
}
main().catch(error => fail("exception " + error.name + " " + error.message))
  .finally(collectAfterSceneSettled);
</script>
