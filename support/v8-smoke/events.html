<!doctype html>
<html><head><meta charset="utf-8"><title>roves-js events and scheduling</title>
<script src="harness.js"></script>
<style>#target { width: 100px; height: 40px; }</style>
</head>
<body>
<button id="target">target</button><input id="field">
<script>
// Event dispatch and task scheduling on V8: the order of microtasks, timers and animation
// frames, synthetic input events, focus, listener options and custom events.
check("microtasks run before timers, timers before the next frame callback", () => new Promise(resolve => {
  const order = [];
  setTimeout(() => order.push("timeout"), 0);
  requestAnimationFrame(() => { order.push("frame"); resolve(order.join() === "sync,microtask,queueMicrotask,timeout,frame" || order.join()); });
  Promise.resolve().then(() => order.push("microtask"));
  queueMicrotask(() => order.push("queueMicrotask"));
  order.push("sync");
}));
check("nested timers keep their order", () => new Promise(resolve => {
  const order = [];
  setTimeout(() => { order.push(1); setTimeout(() => { order.push(3); resolve(order.join() === "1,2,3" || order.join()); }, 0); }, 0);
  setTimeout(() => order.push(2), 0);
}));
check("clearTimeout and clearInterval cancel callbacks", () => new Promise(resolve => {
  let fired = false, ticks = 0;
  const id = setTimeout(() => fired = true, 0);
  clearTimeout(id);
  const interval = setInterval(() => { if (++ticks === 3) clearInterval(interval); }, 5);
  setTimeout(() => resolve((!fired && ticks === 3) || `fired ${fired} ticks ${ticks}`), 200);
}));
check("click dispatch with bubbling, capture and stopPropagation", () => {
  const target = document.getElementById("target");
  const order = [];
  const capture = () => order.push("capture");
  const bubble = () => order.push("bubble");
  document.body.addEventListener("click", capture, true);
  document.body.addEventListener("click", bubble);
  target.addEventListener("click", event => { order.push("target"); event.stopPropagation(); }, { once: true });
  target.click();
  target.click();
  document.body.removeEventListener("click", capture, true);
  document.body.removeEventListener("click", bubble);
  return order.join() === "capture,target,capture,bubble" || order.join();
});
check("synthetic keyboard and pointer events carry their data", () => {
  const field = document.getElementById("field");
  let key = null, pointer = null;
  field.addEventListener("keydown", event => key = `${event.key}:${event.code}:${event.shiftKey}`, { once: true });
  field.addEventListener("pointerdown", event => pointer = `${event.pointerType}:${event.clientX}:${event.button}`, { once: true });
  field.dispatchEvent(new KeyboardEvent("keydown", { key: "A", code: "KeyA", shiftKey: true, bubbles: true }));
  field.dispatchEvent(new PointerEvent("pointerdown", { pointerType: "mouse", clientX: 12, button: 0, bubbles: true }));
  return (key === "A:KeyA:true" && pointer === "mouse:12:0") || `${key} ${pointer}`;
});
check("preventDefault and passive listeners", () => {
  const target = new EventTarget();
  target.addEventListener("go", event => event.preventDefault(), { passive: true });
  const passiveResult = target.dispatchEvent(new Event("go", { cancelable: true }));
  const other = new EventTarget();
  other.addEventListener("go", event => event.preventDefault());
  const activeResult = other.dispatchEvent(new Event("go", { cancelable: true }));
  return passiveResult === true && activeResult === false;
});
check("AbortSignal removes listeners", () => {
  const target = new EventTarget();
  const controller = new AbortController();
  let calls = 0;
  target.addEventListener("tick", () => calls++, { signal: controller.signal });
  target.dispatchEvent(new Event("tick"));
  controller.abort();
  target.dispatchEvent(new Event("tick"));
  return calls === 1;
});
check("CustomEvent detail and EventTarget subclasses", () => {
  class Bus extends EventTarget {}
  const bus = new Bus();
  let detail = null;
  bus.addEventListener("score", event => detail = event.detail);
  bus.dispatchEvent(new CustomEvent("score", { detail: { points: 7 } }));
  return detail && detail.points === 7 && bus instanceof EventTarget;
});
check("handleEvent objects as listeners", () => {
  const target = new EventTarget();
  const listener = { count: 0, handleEvent(event) { this.count += event.type === "x" ? 1 : 0; } };
  target.addEventListener("x", listener);
  target.dispatchEvent(new Event("x"));
  return listener.count === 1;
});
check("focus and blur events with relatedTarget", () => {
  const button = document.getElementById("target"), field = document.getElementById("field");
  let related = null;
  field.addEventListener("focus", event => related = event.relatedTarget, { once: true });
  button.focus();
  field.focus();
  return (document.activeElement === field && related === button) || `${document.activeElement && document.activeElement.id} ${related && related.id}`;
});
check("input events update the value", () => {
  const field = document.getElementById("field");
  let seen = null;
  field.addEventListener("input", () => seen = field.value, { once: true });
  field.value = "typed";
  field.dispatchEvent(new Event("input", { bubbles: true }));
  return seen === "typed";
});
check("visibilitychange and document.visibilityState", () => ["visible", "hidden"].includes(document.visibilityState) && typeof document.hidden === "boolean");
check("MessageChannel delivers as a task, in order", () => new Promise(resolve => {
  const channel = new MessageChannel();
  const received = [];
  channel.port1.onmessage = event => { received.push(event.data); if (received.length === 3) resolve(received.join() === "1,2,3" || received.join()); };
  [1, 2, 3].forEach(n => channel.port2.postMessage(n));
}));
check("requestAnimationFrame timestamps increase", () => new Promise(resolve => {
  requestAnimationFrame(first => requestAnimationFrame(second => resolve((second >= first && first > 0) || `${first} ${second}`)));
}));
check("postMessage source is the incumbent: the innermost frame's window", () => new Promise(resolve => {
  // The iframe's own script enters its realm, then calls a function of this window: the
  // incumbent is this window (the innermost frame), not the entered iframe.
  const frame = document.createElement("iframe");
  window.sendIncumbentProbe = () => window.postMessage("incumbent-probe", "*");
  addEventListener("message", function listener(event) {
    if (event.data !== "incumbent-probe") return;
    removeEventListener("message", listener);
    resolve(event.source === window || (event.source === frame.contentWindow ? "source is the iframe" : String(event.source)));
  });
  frame.srcdoc = "<script>parent.sendIncumbentProbe()<\/script>";
  document.body.append(frame);
}));
check("an iframe keeps its WindowProxy across a navigation", () => new Promise(resolve => {
  // As in browsers, a reference to a browsing context's window outlives its document: after
  // the iframe navigates, the same object reaches the new document.
  const frame = document.createElement("iframe");
  frame.onload = () => {
    const held = frame.contentWindow;
    frame.onload = () => {
      const text = held.document && held.document.body ? held.document.body.textContent : "none";
      const ok = frame.contentWindow === held && text === "second" && window.unloadSawItsOwnWindow === true;
      resolve(ok || `same=${frame.contentWindow === held} text=${text} unload=${window.unloadSawItsOwnWindow}`);
    };
    frame.srcdoc = "<p>second</p>";
  };
  // The old page's unload handlers still see their own window (HTML switches the WindowProxy
  // when the new document becomes active).
  frame.srcdoc = "<p>first</p><script>addEventListener('unload', () => { parent.unloadSawItsOwnWindow = window.document === document; });<\/script>";
  document.body.append(frame);
}));
// Required by check_results.py (REQUIRED_CHECKS): keep the name in sync.
check("an iframe keeps its WindowProxy across origin changes and back", () => new Promise(resolve => {
  // A same-origin srcdoc document, then an opaque-origin one (sandbox="allow-scripts", no
  // allow-same-origin), then a same-origin one again: the held WindowProxy must stay the
  // frame's window, cross-origin access must throw a SecurityError DOMException while the
  // cross-origin allowlist keeps working, and access must come back with the last document.
  // Under file:// both origins serialize as "null": the access checks tell them apart.
  const token = `origin-change-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const parentOrigin = self.origin;
  const frame = document.createElement("iframe");
  const waiting = new Map();
  let phase = "same", done = false, held = null;
  const end = outcome => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    removeEventListener("message", onMessage);
    frame.remove();
    resolve(outcome);
  };
  const timer = setTimeout(() => end(`timeout waiting for phase ${phase}`), 8000);
  function onMessage(event) {
    const data = event.data;
    if (!data || data.token !== token) return;
    const deliver = waiting.get(data.phase);
    if (!deliver) return end(`unexpected message for phase ${data.phase} while waiting for ${phase}`);
    waiting.delete(data.phase);
    deliver(event);
  }
  addEventListener("message", onMessage);
  const message = name => new Promise(deliver => { phase = name; waiting.set(name, deliver); });
  const child = (name, body) => `<p id="marker">${name}</p><script>window.rovesOriginPhase = "${name}";${body}<\/script>`;
  const post = name => `parent.postMessage({ token: "${token}", phase: "${name}", origin: self.origin, parentDocument: (() => { try { return parent.document ? "accessible" : "none"; } catch (error) { return error.name; } })() }, "*");`;
  const securityError = (problems, label, get) => {
    try { get(); problems.push(`${label} did not throw`); }
    catch (error) { if (!(error instanceof DOMException && error.name === "SecurityError")) problems.push(`${label} threw ${error && error.name}`); }
  };
  const common = (problems, event, origin) => {
    if (frame.contentWindow !== held) problems.push("contentWindow changed");
    if (event.source !== held) problems.push("source is not the held window");
    if (event.origin !== origin) problems.push(`origin ${event.origin}`);
    if (event.data.origin !== origin) problems.push(`child origin ${event.data.origin}`);
  };
  const sameOrigin = (problems, event, name) => {
    common(problems, event, parentOrigin);
    if (event.data.parentDocument !== "accessible") problems.push(`child parent.document ${event.data.parentDocument}`);
    const marker = held.document.getElementById("marker");
    if (held.document !== frame.contentDocument) problems.push("document differs from contentDocument");
    if (!marker || marker.textContent !== name) problems.push(`document shows ${marker && marker.textContent}`);
    if (held.rovesOriginPhase !== name) problems.push(`global phase ${held.rovesOriginPhase}`);
  };
  const report = (name, problems) => { if (problems.length) throw new Error(`${name}: ${problems.join(", ")}`); };
  (async () => {
    let event, problems;
    const first = message("same");
    frame.srcdoc = child("same", post("same"));
    document.body.append(frame);
    event = await first;
    held = frame.contentWindow;
    sameOrigin(problems = [], event, "same");
    report("same", problems);

    const opaque = message("opaque");
    frame.setAttribute("sandbox", "allow-scripts");
    frame.srcdoc = child("opaque", `addEventListener("message", event => { if (!event.data || event.data.token !== "${token}" || event.data.phase !== "ping") return; event.source.postMessage({ token: "${token}", phase: "echo", origin: self.origin, from: event.origin, fromParent: event.source === parent }, "*"); });` + post("opaque"));
    event = await opaque;
    common(problems = [], event, "null");
    if (event.data.parentDocument !== "SecurityError") problems.push(`child parent.document ${event.data.parentDocument}`);
    if (frame.contentDocument !== null) problems.push("contentDocument is not null");
    securityError(problems, "document", () => held.document);
    securityError(problems, "global", () => held.rovesOriginPhase);
    if (held.closed !== false || held.window !== held || held.self !== held || held.frames !== held || held.length !== 0 || held.parent !== window || typeof held.postMessage !== "function")
      problems.push("cross-origin allowlist unusable");
    report("opaque", problems);
    const echo = message("echo");
    held.postMessage({ token, phase: "ping" }, "*");
    event = await echo;
    common(problems = [], event, "null");
    if (event.data.from !== parentOrigin || event.data.fromParent !== true) problems.push(`ping seen from ${event.data.from} parent ${event.data.fromParent}`);
    report("echo", problems);

    const last = message("final");
    frame.removeAttribute("sandbox");
    frame.srcdoc = child("final", post("final"));
    event = await last;
    sameOrigin(problems = [], event, "final");
    report("final", problems);
    end(true);
  })().catch(error => end(String((error && error.message) || error)));
}));
finish();
</script>
</body></html>
