<!doctype html>
<meta charset="utf-8"><title>Single-document HTML module scheduling</title>
<script src="harness.js"></script>
<script>
globalThis.order = [];
globalThis.inlineModuleURLs = [];
globalThis.staticOnErrors = 0;
globalThis.domReady = new Promise(resolve => document.addEventListener("DOMContentLoaded", () => {
  order.push("domcontentloaded"); resolve();
}, { once: true }));
globalThis.staticRejection = new Promise(resolve => addEventListener("unhandledrejection", event => {
  if (event.reason?.message === "roves-static-evaluation-failure") {
    event.preventDefault(); resolve(true);
  }
}));
addEventListener("error", event => {
  if (String(event.message).includes("roves-static-evaluation-failure")) staticOnErrors++;
});
</script>
<script type="module" src="single-document-fixtures/order-a.mjs"></script>
<script type="module" src="single-document-fixtures/order-b.mjs"></script>
<script type="module" src="single-document-fixtures/evaluation-error.mjs"></script>
<script type="module">inlineModuleURLs.push(import.meta.url);</script>
<script type="module">inlineModuleURLs.push(import.meta.url);</script>
<body><main id="game-root">ready after parsing</main>
<script>
const tick = () => new Promise(resolve => setTimeout(resolve, 0));
check("deferred modules see the parsed body and TLA does not block DOMContentLoaded", async () => {
  await domReady; await tick();
  return order.join() === "a:42,b:42,domcontentloaded,a:after-domcontentloaded" || order.join();
});
check("static evaluation errors are rejection events and the game continues", async () => {
  await staticRejection;
  return staticOnErrors === 0 && document.getElementById("game-root").textContent === "ready after parsing";
});
check("inline module URLs are distinct and preserve the relative asset base", async () => {
  await domReady;
  if (inlineModuleURLs.length !== 2 || inlineModuleURLs[0] === inlineModuleURLs[1]) return String(inlineModuleURLs);
  for (const raw of inlineModuleURLs) {
    const url = new URL(raw);
    if (!/^#roves-inline-module-[0-9]+$/.test(url.hash)) return raw;
    if (new URL("single-document-fixtures/value.mjs", url).href !== new URL("single-document-fixtures/value.mjs", document.baseURI).href) return "asset base changed";
  }
  return externalModuleURL === new URL("single-document-fixtures/order-b.mjs", document.baseURI).href;
});
check("classic errors still use error events", () => new Promise(resolve => {
  function listener(event) {
    if (!String(event.message).includes("roves-classic-error")) return;
    event.preventDefault(); removeEventListener("error", listener);
    resolve(event.error instanceof Error);
  }
  addEventListener("error", listener);
  setTimeout(() => { throw new Error("roves-classic-error"); }, 0);
}));
async function failingStatic(path, expectsFetchError, expectedError = SyntaxError, verifyLocation = null) {
  const script = document.createElement("script"); script.type = "module";
  const observed = new Promise(resolve => {
    let timer;
    function error(event) {
      if (expectsFetchError || !(event.error instanceof expectedError)) return;
      event.preventDefault(); cleanup(); resolve(verifyLocation ? verifyLocation(event) : true);
    }
    function cleanup() { clearTimeout(timer); removeEventListener("error", error); script.remove(); }
    script.onerror = () => { cleanup(); resolve(expectsFetchError); };
    addEventListener("error", error);
    timer = setTimeout(() => { cleanup(); resolve(false); }, 3000);
  });
  script.src = path; document.head.append(script);
  return observed;
}
check("static parse failure preserves its syntax error contract", () => failingStatic("single-document-fixtures/parse-error.mjs", false));
check("static link failure preserves its syntax error contract", () => failingStatic("single-document-fixtures/link-error.mjs", false));
check("static parse reports identify the external module source", () => {
  const path = "single-document-fixtures/located-parse-error.mjs";
  const url = new URL(path, document.baseURI).href;
  return failingStatic(path, false, SyntaxError, event =>
    (event.filename === url && event.lineno === 3 && event.colno === 14 &&
     String(event.error.stack).includes(url + ":3:14")) ||
    JSON.stringify({ filename: event.filename, line: event.lineno, column: event.colno, stack: String(event.error.stack) }));
});
check("static fetch failure remains a script loading failure", () => failingStatic("single-document-fixtures/absent-static.mjs", true));
check("static import attribute failures retain TypeError", () =>
  failingStatic("single-document-fixtures/invalid-attributes.mjs", false, TypeError));
check("dynamic fetch failure rejects the importing promise", async () => {
  try { await import("./single-document-fixtures/absent-dynamic.mjs"); return false; }
  catch (error) { return error instanceof TypeError || String(error); }
});
check("classic eval and Function imports preserve each source directory", async () => {
  globalThis.referrerImporters = [];
  try {
    for (const side of ["left", "right"]) {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "single-document-fixtures/" + side + "/classic.js";
        script.onload = () => { script.remove(); resolve(); };
        script.onerror = () => { script.remove(); reject(new Error("classic fixture failed")); };
        document.head.append(script);
      });
    }
    const values = await Promise.all(referrerImporters.map(importer => importer()));
    return values.map(value => value.owner).join() === "left,left,left,right,right,right" || values.map(value => value.owner).join();
  } finally { delete globalThis.referrerImporters; }
});
check("descendant module fetch uses its importing module referrer", async () => {
  const value = await import("./single-document-fixtures/referrer-parent.mjs");
  const expected = new URL("single-document-fixtures/referrer-parent.mjs", document.baseURI).href;
  return value.default === expected || "Referer=" + value.default + " expected=" + expected;
});
check("runtime static module loading resumes timers and frames", async () => {
  for (const [scene, path] of [
    ["cold", "single-document-fixtures/value.mjs?pause-probe"],
    ["warm", "single-document-fixtures/value.mjs?pause-probe"],
    ["slow", "slow-module.mjs"]
  ]) {
    let ticks = 0, largestGap = 0, previous = performance.now(), waitForTick = null;
    let frames = 0, largestFrameGap = 0, previousFrame = null, frameRequest = null;
    function observeFrame(timestamp) {
      if (previousFrame !== null) largestFrameGap = Math.max(largestFrameGap, timestamp - previousFrame);
      previousFrame = timestamp; frames++;
      frameRequest = requestAnimationFrame(observeFrame);
    }
    const timer = setInterval(() => {
      const now = performance.now(); largestGap = Math.max(largestGap, now - previous);
      previous = now; ticks++;
      if (waitForTick) { const resolve = waitForTick; waitForTick = null; resolve(); }
    }, 5);
    const script = document.createElement("script"); script.type = "module";
    try {
      // Establish a frame before fetching, so the next sample spans the static-load pause.
      await new Promise(resolve => requestAnimationFrame(timestamp => {
        previousFrame = timestamp; frameRequest = requestAnimationFrame(observeFrame); resolve();
      }));
      const started = performance.now();
      await new Promise((resolve, reject) => {
        script.onload = resolve;
        script.onerror = () => reject(new Error("pause fixture loading failed: " + scene));
        script.src = path; document.head.append(script);
      });
      const elapsed = performance.now() - started;
      await new Promise(resolve => { waitForTick = resolve; });
      await new Promise(resolve => requestAnimationFrame(() => resolve()));
      console.log("ROVES-V8 module-pause diagnostic " + JSON.stringify({
        scene, elapsed_ms: elapsed, max_timer_gap_ms: largestGap, timer_ticks: ticks,
        max_frame_gap_ms: largestFrameGap, frame_samples: frames, visibility: document.visibilityState
      }));
      if (ticks === 0 || frames === 0) return "timer/frame did not resume: " + scene;
    } finally {
      clearInterval(timer); if (frameRequest !== null) cancelAnimationFrame(frameRequest); script.remove();
    }
  }
  return true;
});
check("cross-origin modules require a matching CORS response", async () => {
  const allowed = new URL("/cors-module.mjs", location.href); allowed.port = "18766";
  const denied = new URL("/no-cors-module.mjs", allowed);
  const namespace = await import(allowed.href);
  if (namespace.ready !== true) return "allowed module failed";
  try { await import(denied.href); return "module without CORS was accepted"; }
  catch (error) { return error instanceof TypeError || String(error); }
});
check("JSON preload reports unavailable while typed imports still work", async () => {
  const link = document.createElement("link");
  link.rel = "modulepreload"; link.as = "json"; link.href = "modules/data.json";
  try {
    let appended = false;
    const unavailable = await new Promise(resolve => {
      link.onload = () => resolve(false);
      link.onerror = () => resolve(appended);
      document.head.append(link);
      appended = true;
    });
    if (!unavailable) return "JSON preload incorrectly reported success";
    const data = await import("./modules/data.json", { with: { type: "json" } });
    if (data.default.level !== 4) return "typed JSON import failed";
    try { await import("./modules/data.json"); return "untyped JSON import accepted"; }
    catch (error) { return error instanceof TypeError || String(error); }
  } finally { link.remove(); }
});
check("module redirects preserve final URL and relative imports", async () => {
  const namespace = await import("./redirect-module.mjs");
  return namespace.value === 42 && namespace.actualURL === new URL("single-document-fixtures/redirect/entry.mjs", document.baseURI).href;
});
check("module fetch rejects a non-JavaScript MIME type", async () => {
  try { await import("./wrong-mime-module.mjs"); return "text/plain module accepted"; }
  catch (error) { return error instanceof TypeError || String(error); }
});
check("module response referrer policy controls descendant requests", async () => {
  const namespace = await import("./no-referrer-parent.mjs");
  return namespace.default === null || "Referer leaked: " + namespace.default;
});
check("static module integrity permits matching bytes and denies mismatches", async () => {
  globalThis.rovesSriExecuted = 0;
  async function load(label, integrity) {
    const script = document.createElement("script"); script.type = "module";
    script.integrity = integrity; script.src = "sri-module.mjs?" + label;
    try {
      return await new Promise(resolve => {
        script.onload = () => resolve(true);
        script.onerror = () => resolve(false);
        document.head.append(script);
      });
    } finally { script.remove(); }
  }
  try {
    const matching = await load("matching", "sha256-nLqEm71HDrWcfC/jNcKr9EqBibmBe5+qTPmlSjhrBXE=");
    const mismatching = await load("mismatching", "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=");
    return matching && !mismatching && rovesSriExecuted === 1;
  } finally { delete globalThis.rovesSriExecuted; }
});
finish();
</script>
