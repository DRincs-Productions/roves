# Roves CEF player for Windows: CEF accelerated off-screen rendering -> wgpu-weld -> wgpu.
# Separate Cargo workspace; release.yml publishes it. See README.md.
#
# Pins (rationale and evidence in README.md):
# - welding: merely-made/wgpu-weld main at e991684 (2026-11-20), `wgpu-29` row plus
#   `cef-runtime`. Welding owns the CEF OSR callback lifetime, the D3D11 copy and the
#   Windows sandbox bootstrap entry; its `grafting` dependency (merely-made/wgpu-graft, git
#   branch main) owns the D3D12 shared-handle -> wgpu import. The lock pins grafting to
#   d903cfa, the revision wgpu-weld's own Cargo.lock reviewed at e991684.
# - cef =154.5.0 (CEF 154.0.34, Chromium 154.0.8037.98): the release welding requires.
# - wgpu =29.0.4: welding's `wgpu-29` row. One wgpu 29 device is shared by the player and
#   welding.
#   Known graph cost: welding enables cef's `accelerated_osr` feature, which pulls wgpu 30
#   for cef's own importer (`cef::osr_texture_import`); welding and the player never call it.
[package]
name = "roves_cef_windows_player"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MPL-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "bundle"
path = "src/bin/bundle.rs"

[features]
# Local type-check only (`cargo check --features dox --all-targets`): cef-dll-sys skips the
# CEF download and the libcef_dll_wrapper build. Never used for a runnable bundle.
dox = ["cef/dox"]
# Steamworks in the player (README "Steam"), off by default: one steamworks::Client behind the
# host API's `steam` module; the package then needs steam_api64.dll next to play.exe (the
# bundle binary copies steamworks-sys's redistributable with `--features steam`).
steam = ["dep:steamworks"]

[dependencies]
welding = { path = "../vendor/wgpu-weld/welding", default-features = false, features = ["wgpu-29", "cef-runtime", "cpu-paint-fallback"] }
cef = { version = "=154.5.0", default-features = false, features = ["build-util", "sandbox"] }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "dx12", "wgsl"] }
pollster = "0.4"
dpi = "0.1"
sdl3 = { version = "0.20", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
base64 = "0.22.1"
# Already in the graph through welding (0.4.35 in Cargo.lock): forwards welding/grafting
# warn/error records to the probe log in `--roves-sustained` runs.
log = "0.4"
# `--roves-game-dir` only: the stage-1 window probe's loopback server
# (support/cef-windows-player/src/server.rs, compiled here through `#[path]`) with the same
# requirements as there: axum + tower-http ServeDir (MIT) own path normalisation, MIME types
# and Range requests on 127.0.0.1; tokio was already in the graph.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "sync", "io-util", "time"] }
# Optional local MCP bridge (src/mcp.rs, off by default, shared with the macOS/Linux players):
# request/CDP JSON. Already in the graph through cef and welding (1.0.154); tokio's
# `io-util`/`time` were already enabled there too (named pipe, line reads, timeouts).
serde_json = "1"
# MCP session token and pipe-name nonce from the OS RNG on every platform (getrandom 0.2.17,
# MIT/Apache-2.0, already in the graph; Windows: ProcessPrng).
getrandom = "0.2"
# `ServiceExt::oneshot` lets the cache-policy wrapper call ServeDir (twice for a failed
# If-Range); already in the graph through axum.
tower = { version = "0.5", default-features = false, features = ["util"] }
# Host API query strings (support/cef-windows-player/src/host_api.rs); already in the graph
# (1.2.3, through url).
form_urlencoded = "1.2"
# Atomic host API save writes (NamedTempFile + persist). New in the graph: tempfile 3.27 and
# fastrand; its other dependencies were already locked.
tempfile = { version = "3", default-features = false }
# External links (src/external_link.rs, shared with the macOS/Linux players): URL parsing of the
# link rule (url 2.5.9, MIT/Apache-2.0, already in the graph through welding/CEF crates) and
# the system-browser launch (open 5.4.5, MIT; Windows: PowerShell Start-Process with the URL
# in an environment variable, macOS: /usr/bin/open, Linux: xdg-open and fallbacks).
url = "2.5.9"
open = "5.4.5"
# `steam` feature only: steamworks-rs (MIT/Apache-2.0), the version the legacy Servo `steam`
# feature resolved (steamworks-sys 0.13.0 bundles the Steamworks
# SDK redistributables, Valve's SDK terms).
steamworks = { version = "=0.13.1", optional = true }

[build-dependencies]
# build.rs only: rasterizes the startup wordmark with the official MetalMania font
# (resources/fonts, SIL OFL 1.1) into an embedded alpha bitmap. Pure Rust (ttf-parser +
# ab_glyph_rasterizer), Apache-2.0; nothing of it is linked into the player.
ab_glyph = "0.2.32"

[target.'cfg(windows)'.dependencies]
# Already in the graph (0.61.2): `MapVirtualKeyW` gives the layout-aware virtual key of a
# winit scancode for CEF's `windows_key_code` (game-mode keyboard input).
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
