# Unit tests of the CEF players' shared loopback server and host API
# (support/cef-windows-player/src/{server,host_api}.rs), the Windows player's pure rules
# (support/cef-windows-player/src/game_rules.rs), the macOS/Linux key-code rules
# (support/cef-macos-gate/src/key_rules.rs) and the MCP bridge's pure rules
# (support/cef-windows-player/src/mcp_rules.rs), compiled here through `#[path]` without
# CEF, so they run with a plain `cargo test` on any platform (the players themselves link
# CEF, which `--features dox` cannot). Separate Cargo workspace, never shipped. Versions are
# the players'; Cargo.lock was seeded from support/cef-windows-player/Cargo.lock.
[package]
name = "roves_cef_host_api_tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MPL-2.0"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde_json = "1"
base64 = "0.22.1"
form_urlencoded = "1.2"
tempfile = { version = "3", default-features = false }
# key_rules.rs: Chromium's key-code table (as in the macOS and Linux gates).
keycode = "1.0.0"
# external_link.rs: URL parsing of the external-link rule (as in the players).
url = "2.5.9"
zip = { version = "9.8.2", default-features = false }
memmap2 = "0.9.12"
quick_cache = { version = "0.7.0", default-features = false }
bytes = "1.12.2"
http-range-header = "0.4.2"
mime_guess = "2.0.5"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5.6"

[dev-dependencies]
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
