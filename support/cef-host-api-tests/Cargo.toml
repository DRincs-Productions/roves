# Unit tests of the CEF players' shared loopback server and host API
# (support/cef-window-probe/src/{server,host_api}.rs), the Windows player's pure rules
# (support/cef-netrender-probe/src/game_rules.rs) and the macOS/Linux key-code rules
# (support/cef-macos-gate/src/key_rules.rs), compiled here through `#[path]` without
# CEF, so they run with a plain `cargo test` on any platform (the players themselves link
# CEF, which `--features dox` cannot). Separate Cargo workspace, never shipped. Versions are
# the players'; Cargo.lock was seeded from support/cef-netrender-probe/Cargo.lock.
[package]
name = "roves_cef_host_api_tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MPL-2.0"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde_json = "1"
base64 = "0.22.1"
form_urlencoded = "1.2"
tempfile = { version = "3", default-features = false }
# key_rules.rs: Chromium's key-code table (as in the macOS and Linux gates).
keycode = "1.0.0"
