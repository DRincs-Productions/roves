# CEF accelerated off-screen rendering -> wgpu-weld -> Netrender feasibility probe (Windows).
# Separate Cargo workspace: not part of the engine, of the stage-1 CEF window probe
# (support/cef-window-probe, CEF 156) or of any shipped target. See README.md.
#
# Pins (rationale and evidence in README.md):
# - welding: merely-made/wgpu-weld main at e991684 (2026-11-20), `wgpu-29` row plus
#   `cef-runtime`. Welding owns the CEF OSR callback lifetime, the D3D11 copy and the
#   Windows sandbox bootstrap entry; its `grafting` dependency (merely-made/wgpu-graft, git
#   branch main) owns the D3D12 shared-handle -> wgpu import. The lock pins grafting to
#   d903cfa, the revision wgpu-weld's own Cargo.lock reviewed at e991684.
# - cef =154.5.0 (CEF 154.0.34, Chromium 154.0.8037.98): the release welding requires.
#   The stage-1 window probe stays on 156.7.0; both CEF distributions are independent.
# - wgpu =29.0.4 and Netrender d2f13ca5: the Netrender revision Roves already pins (last on
#   wgpu 29 / Vello 0.9). One wgpu 29 device is shared by Netrender and welding.
#   Known graph cost: welding enables cef's `accelerated_osr` feature, which pulls wgpu 30
#   for cef's own importer (`cef::osr_texture_import`); welding and this probe never call it.
[package]
name = "roves_cef_netrender_probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MPL-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "bundle"
path = "src/bin/bundle.rs"

[features]
# Local type-check only (`cargo check --features dox --all-targets`): cef-dll-sys skips the
# CEF download and the libcef_dll_wrapper build. Never used for a runnable bundle.
dox = ["cef/dox"]

[dependencies]
welding = { git = "https://github.com/merely-made/wgpu-weld", rev = "e991684bab23d0eaea42d418e216317173ace2a9", default-features = false, features = ["wgpu-29", "cef-runtime"] }
cef = { version = "=154.5.0", default-features = false, features = ["build-util", "sandbox"] }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "dx12", "wgsl"] }
pollster = "0.4"
dpi = "0.1"
sdl3 = { version = "0.20", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
base64 = "0.22.1"
# Already in the graph through welding (0.4.35 in Cargo.lock): forwards welding/grafting
# warn/error records to the probe log in `--roves-sustained` runs.
log = "0.4"
# `--roves-game-dir` only: the stage-1 window probe's loopback server
# (support/cef-window-probe/src/server.rs, compiled here through `#[path]`) with the same
# requirements as there: axum + tower-http ServeDir (MIT) own path normalisation, MIME types
# and Range requests on 127.0.0.1; tokio was already in the graph.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "sync", "io-util", "time"] }
# Optional local MCP bridge (src/mcp.rs, off by default): request/CDP JSON. Already in the
# graph through cef and welding (1.0.154); tokio's `io-util`/`time` were already enabled
# there too (named pipe, line reads, timeouts).
serde_json = "1"
# `ServiceExt::oneshot` lets the cache-policy wrapper call ServeDir (twice for a failed
# If-Range); already in the graph through axum.
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(windows)'.dependencies]
# Already in the graph (0.61.2): `MapVirtualKeyW` gives the layout-aware virtual key of a
# winit scancode for CEF's `windows_key_code` (game-mode keyboard input).
# `Win32_Security_Cryptography`: `BCryptGenRandom` for the MCP bridge's session token.
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography"] }
