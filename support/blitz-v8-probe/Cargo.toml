[package]
name = "roves-blitz-v8-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"

[workspace]

[dependencies]
deno_core = "=0.413.0"
deno_error = "=0.7.1"
blitz-dom = { version = "=0.2.1", default-features = false, features = ["system_fonts"] }
blitz-html = { version = "=0.2.0", default-features = false }
blitz-shell = { version = "=0.2.2", default-features = false }
anyrender_vello = "=0.6.0"
blitz-traits = "=0.2.0"
tokio = { version = "1.47.1", default-features = false, features = ["rt"] }
deno_web = "=0.291.0"
deno_webidl = "=0.260.0"
anyrender = "=0.6.2"
blitz-paint = { version = "=0.2.1", default-features = false }
png = "=0.17.16"
# Same Stylo as blitz-dom 0.2.1 (already in the graph): PropertyId for getComputedStyle.
style = { package = "stylo", version = "=0.8.0", default-features = false }
