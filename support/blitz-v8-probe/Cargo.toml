[package]
name = "roves-blitz-v8-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"

[workspace]
# The patched upstream crate stays outside the workspace (no fmt/clippy of vendored code).
exclude = ["vendor/blitz-dom", "vendor/blitz-paint"]

[dependencies]
deno_core = "=0.413.0"
deno_error = "=0.7.1"
# custom-widget: canvas elements paint as an in-order placeholder (src/presentation.rs).
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "custom-widget"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
anyrender_vello_cpu = { version = "=0.18.0", features = ["softbuffer_window_renderer"] }
blitz-traits = "=0.3.0-beta.4"
tokio = { version = "1.47.1", default-features = false, features = ["rt", "net"] }
deno_web = "=0.291.0"
deno_webidl = "=0.260.0"
anyrender = "=0.14.0"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"] }
# Already in the Blitz graph. Compose Blitz's cached CSS transform matrices.
kurbo = "=0.13.1"
# Already in the Blitz graph (anyrender's brush types): the canvas placeholder
# `ImageBrush<ResourceId>` of the --window GPU presentation.
peniko = "=0.6.1"
png = "=0.18.1"
# Already locked through deno_fetch: decodes data: URLs (save thumbnails) in the
# game NetProvider.
data-url = "=0.3.1"
# Same Stylo as blitz-dom 0.3.0-beta.4 (already in the graph): PropertyId for getComputedStyle.
style = { package = "stylo", version = "=0.22.0", default-features = false }
# Same versions as blitz-shell/blitz-traits 0.3.0-beta.4 (already in the graph): window
# attributes and modifier flags for the --window mode.
winit = "=0.31.0-beta.3"
keyboard-types = { version = "=0.8.3", default-features = false }
# Same version as winit/wgpu-core 29 (already in the graph): the window handles
# deno_webgpu's wgpu-core Instance needs for the --window GPU surface.
raw-window-handle = "=0.6.2"
# deno_core 0.413-paired release: localStorage (SQLite) and sessionStorage.
deno_webstorage = "=0.255.0"
# deno_core 0.413-paired release: WebGPU (navigator.gpu) on wgpu 29.
deno_webgpu = "=0.227.0"
# deno_core 0.413-paired release: createImageBitmap/ImageBitmap (PNG/JPEG decoding).
deno_image = "=0.36.0"
# deno_core 0.413-paired release: Headers/Request/Response/FormData and fetch for
# data:, blob: and safe https origins (src/fetch.js adds game://, CORS, redirects;
# src/net_policy.rs the public-address resolver, request hook and CSP).
deno_fetch = "=0.284.0"
# Same versions deno_fetch 0.284.0 uses: the PermissionsContainer op_fetch requires
# (net granted, everything else denied) and the Mozilla root store (webpki-roots).
deno_permissions = "=0.119.0"
deno_tls = "=0.247.0"
# Released with deno_fetch 0.284.0: its 22_http_client.js loads ext:deno_net/02_tls.js
# during bootstrap. Registered only for that script; `Deno` (and its net/TLS ops) is
# removed from the guest global, so no Deno.connect/listen surface reaches games.
deno_net = "=0.252.0"
# RealSys for deno_permissions' descriptor parser (version unified with deno_permissions').
sys_traits = { version = "0.1", features = ["real", "libc", "winapi"] }
# Already in the graph through deno_fetch: the request type of deno_fetch's
# request_builder_hook and the `Name` its custom DNS resolver receives.
http = "1"
hyper-util = { version = "0.1", features = ["client-legacy"] }
# The CSP implementation Roves' production engine uses (root Cargo.lock 0.8.1):
# document connect-src for remote fetch.
content-security-policy = "=0.8.1"
# Start with offline rendering; the probe does not require an audio device in CI.
web-audio-api = { version = "=1.7.0", default-features = false }

# Temporary: crates.io blitz-dom/blitz-paint 0.3.0-beta.4 with minimal Roves fixes
# (animation accessors, input type state, tree-order paint and hit testing of
# positioned z-index auto/0 boxes, Blitz #1493). Provenance, patches and removal
# criteria: vendor/*/ROVES_PATCHES.md
# and patches/blitz-{dom,paint}-0.3.0-beta.4/.
[patch.crates-io]
blitz-dom = { path = "vendor/blitz-dom" }
blitz-paint = { path = "vendor/blitz-paint" }
