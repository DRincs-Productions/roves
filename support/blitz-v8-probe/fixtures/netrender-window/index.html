<!doctype html>
<!--
  Netrender window fixture (opt-in, netrender-window/Cargo.toml):
    ROVES_PROBE_WINDOW_RENDERER=netrender ROVES_PROBE_NETRENDER_FIXTURE=1 \
      roves-blitz-v8-probe-netrender --game fixtures/netrender-window --window --window-frames 90
  Paint order: black page, opaque red #before, a WebGPU canvas cleared to 50%
  premultiplied blue, then 50% white #after over the canvas, #before and the page.
  Expected pixels: FIXTURE_CHECKS in src/netrender_window.rs.

  Lifecycle scenarios (ROVES_PROBE_NETRENDER_SCENARIO, separate runs; started by
  the renderer right after the FIXTURE_CHECKS read back):
    resize          a native window resize; once innerWidth changed the canvas
                    is cleared to 50% premultiplied green instead (RESIZE_CHECKS),
                    so a stale canvas texture is detected.
    device-destroy  the renderer calls netrenderFixtureDestroyDevice(): the page
                    itself calls device.destroy() and stops drawing; its own
                    device.lost handler reports the reason.
  Page events are printed as "NETRENDER_FIXTURE_PAGE <json>" lines.
-->
<html>
<head>
<style>
  html, body { margin: 0; background: rgb(0, 0, 0); overflow: hidden; }
  #before { position: absolute; left: 40px; top: 40px; width: 400px; height: 200px;
            background: rgb(255, 0, 0); }
  #canvas { position: absolute; left: 120px; top: 80px; width: 160px; height: 120px; }
  #after { position: absolute; left: 200px; top: 60px; width: 200px; height: 260px;
           background: rgba(255, 255, 255, 0.5); }
</style>
</head>
<body>
<div id="before"></div>
<canvas id="canvas" width="160" height="120"></canvas>
<div id="after"></div>
<script>
(async () => {
  const report = (event) => console.log("NETRENDER_FIXTURE_PAGE " + JSON.stringify(event));
  const adapter = await navigator.gpu.requestAdapter();
  if (adapter === null) throw new Error("netrender fixture: no WebGPU adapter");
  const device = await adapter.requestDevice();
  let destroyed = false;
  // The page's own handler: it must still run when the window renderer
  // observes the loss.
  device.lost.then((info) => {
    report({ event: "lost", reason: info.reason, destroyed_by_page: destroyed });
  });
  globalThis.netrenderFixtureDestroyDevice = () => {
    destroyed = true;
    report({ event: "destroy" });
    device.destroy();
  };
  const context = document.getElementById("canvas").getContext("webgpu");
  context.configure({ device, format: "rgba8unorm", alphaMode: "premultiplied" });
  const initialWidth = innerWidth;
  let resized = false;
  const draw = () => {
    if (destroyed) return;
    if (!resized && innerWidth !== initialWidth) {
      resized = true;
      report({ event: "resized", width: innerWidth, height: innerHeight });
    }
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [{
        view: context.getCurrentTexture().createView(),
        // 50% blue (50% green after a resize), premultiplied.
        clearValue: resized ? { r: 0, g: 0.5, b: 0, a: 0.5 } : { r: 0, g: 0, b: 0.5, a: 0.5 },
        loadOp: "clear",
        storeOp: "store",
      }],
    });
    pass.end();
    device.queue.submit([encoder.finish()]);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
