# Linux feasibility gate for the CEF accelerated off-screen path: CEF 154 OnAcceleratedPaint
# native pixmap (DMA-BUF planes) -> welding (Vulkan external-memory import through grafting)
# -> wgpu 29 Vulkan -> SDL3 X11 window.
# Separate Cargo workspace: not part of the Windows player (support/cef-windows-player), of
# the macOS gate (support/cef-macos-gate), of their CI, or of any shipped target. See README.md.
#
# Pins are the Windows player's and the macOS gate's, unchanged, so a pass here says something
# about the same graph: welding e991684 (`wgpu-29` + `cef-runtime`), grafting d903cfa
# (Cargo.lock), cef =154.5.0 (CEF 154.0.34, Chromium 154.0.8037.98), wgpu =29.0.4, sdl3 0.20.
# Cargo.lock was seeded from support/cef-macos-gate/Cargo.lock (itself seeded from the
# Windows player's), so every shared package resolves to the same version.
[package]
name = "roves_cef_linux_gate"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MPL-2.0"
build = "build.rs"

[workspace]

# Linux CEF re-executes this binary for every subprocess (zygote, renderer, GPU, utility),
# so there is no separate helper executable.
[[bin]]
name = "roves-cef-linux-gate"
path = "src/main.rs"

# Assembles the flat CEF directory from the already built release binary; not part of the
# gate itself.
[[bin]]
name = "bundle"
path = "src/bundle.rs"

[features]
default = ["bundled-sdl"]
# SDL3 built from source and linked statically, as in the Windows player.
bundled-sdl = ["sdl3/build-from-source-static"]
# Local type-check only, e.g. from Windows:
#   cargo check --target x86_64-unknown-linux-gnu --no-default-features --features dox --bins
# cef-dll-sys skips the CEF download and the libcef_dll_wrapper build; without
# `bundled-sdl` no C toolchain for the target is needed. Never used for a runnable build.
dox = ["cef/dox"]
# Steamworks in the player (Windows player README "Steam"), off by default: the Windows
# player's src/steam.rs (`#[path]`) behind the host API's `steam` module; the package then
# needs libsteam_api.so next to the executable (bundle.rs copies steamworks-sys's redistributable there).
steam = ["dep:steamworks"]

[dependencies]
welding = { path = "../vendor/wgpu-weld/welding", default-features = false, features = ["wgpu-29", "cef-runtime", "cpu-paint-fallback"] }
cef = { version = "=154.5.0", default-features = false, features = ["build-util", "sandbox"] }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "vulkan", "wgsl"] }
sdl3 = { version = "0.20", default-features = false, features = ["raw-window-handle"] }
pollster = "0.4"
dpi = "0.1"
log = "0.4"
# Packaged-game mode only (src/player.rs): the stage-1 window probe's loopback server
# (support/cef-windows-player/src/server.rs, compiled through `#[path]` exactly as the Windows
# player and the macOS gate do) with their versions: axum + tower-http ServeDir (MIT) own path
# normalisation, MIME types and Range requests on 127.0.0.1; tokio runs it on its own thread.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
# Packed game content (support/cef-windows-player/src/content.rs, through server.rs; README
# "Packed game content"): the ZIP central directory only (zip 9.8, MIT, no compression
# features; data is read straight from the mapping), memory-mapped archives (memmap2,
# MIT/Apache-2.0), the bounded cache of inflated assets (quick_cache, MIT, without
# parking_lot). Already in the graph: flate2 + zlib-rs (raw deflate), crc32fast, bytes,
# http-range-header and mime_guess (the same Range parser and MIME table as ServeDir).
zip = { version = "9.8.2", default-features = false }
memmap2 = "0.9.12"
quick_cache = { version = "0.7.0", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
bytes = "1.12"
http-range-header = "0.4.2"
mime_guess = "2.0.5"
tokio = { version = "1.47", default-features = false, features = ["rt", "net", "sync", "io-util", "time"] }
# Optional local MCP bridge (support/cef-windows-player/src/mcp.rs, `#[path]`, off by default):
# tokio's `io-util`/`time` (line reads, timeouts; the Windows player's features, already in
# the graph), the session token from the OS RNG (getrandom 0.2.17, MIT/Apache-2.0) and the
# effective uid for the socket peer check and the session directory owner (libc 0.2.191,
# MIT/Apache-2.0); both were already in Cargo.lock.
getrandom = "0.2"
libc = "0.2"
tower = { version = "0.5", default-features = false, features = ["util"] }
# Host API (support/cef-windows-player/src/host_api.rs, `#[path]` as in the Windows player):
# JSON replies, base64 save payloads, query strings (already in Cargo.lock) and atomic save
# writes (tempfile, as in the Windows player).
serde_json = "1"
base64 = "0.22.1"
form_urlencoded = "1.2"
tempfile = { version = "3", default-features = false }
# Page input (support/cef-macos-gate/src/key_rules.rs, `#[path]`): Chromium's own key-code
# table (dom_code_data.inc, generated into the crate) maps SDL's scancode (USB HID usage) to
# the XKB key code CEF expects in `native_key_code`. MIT; already in the engine's graph.
keycode = "1.0.0"
# External links (src/external_link.rs, shared with the macOS/Linux players): URL parsing of the
# link rule (url 2.5.9, MIT/Apache-2.0, already in the graph through welding/CEF crates) and
# the system-browser launch (open 5.4.5, MIT; Windows: PowerShell Start-Process with the URL
# in an environment variable, macOS: /usr/bin/open, Linux: xdg-open and fallbacks).
url = "2.5.9"
open = "5.4.5"
# `steam` feature only: steamworks-rs (MIT/Apache-2.0), the Windows player's pin
# (steamworks-sys 0.13.0 bundles the Steamworks SDK redistributables, Valve's SDK terms).
steamworks = { version = "=0.13.1", optional = true }
# Mods and DLC (support/cef-windows-player/src/mods.rs, through server.rs; README "Mods and
# DLC"): npm version ranges of package.json (nodejs-semver, Apache-2.0: npm's rules, which the
# `semver` crate's Cargo rules differ from), the DLC signature check (ed25519-dalek,
# BSD-3-Clause, verification only) and the SHA-256 of every signed file (sha2, MIT/Apache-2.0).
nodejs-semver = { version = "7.0.0", default-features = false }
sha2 = { version = "0.11.2", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }

[build-dependencies]
# build.rs only (support/cef-windows-player/build_wordmark.rs, `#[path]`): rasterizes the
# startup wordmark with the official MetalMania font (resources/fonts, SIL OFL 1.1) into an
# embedded alpha bitmap, as in the Windows player. Nothing of it is linked into the player.
ab_glyph = "0.2.32"
