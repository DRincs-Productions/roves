name: 'Test: SDL3 gamepad'

# Branch codex/cef-sdl3-wgpu-probe (CEF + SDL3 + wgpu candidate): the Servo + V8 engine
# sources, `mach` and every workflow that built them (the Debug package/publication jobs that
# used to live here, v8.yml, release.yml, android.yml, ios.yml, perf-ab.yml and the Blitz/Deno
# probes) were removed from this branch on 2026-11-23, together with the SDL3 windowing
# contract check that parsed ports/servoshell sources. The branch deliverable is the
# standalone CEF package built by cef-netrender-probe.yml. Other branches keep their own copy
# of these workflows unchanged.
#
# What stays: the standalone SDL3 virtual-gamepad probe (its own Cargo workspace, no engine
# build). Use workflow_dispatch to retry after a transient runner failure.
#
# Apple CI policy (2026-11-05): no macOS/iOS job runs per commit; this branch has no
# versioned-tag workflow, so the macOS leg of the probe does not run here.

on:
  # No push trigger (user 2026-11-26): this old SDL3 probe runs macOS/Linux jobs, which now
  # run only at release time; dispatch it by hand when needed.
  workflow_dispatch: {}

# A new SDL3 checkpoint supersedes the previous one, so only the latest commit's checks run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exercise SDL3's native virtual-gamepad API on Windows and Linux. This
  # tests discovery and input without a physical controller or virtual-HID driver.
  sdl3-gamepad-probe:
    name: sdl3-gamepad-probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: compile isolated SDL3 probe
        run: cargo build --release --manifest-path support/sdl3-gamepad-probe/Cargo.toml --target-dir target/sdl3-gamepad-probe
      - name: probe SDL3 virtual gamepad with a 90-second runtime limit
        run: node support/sdl3-gamepad-probe/run-with-timeout.mjs target/sdl3-gamepad-probe/release/sdl3-gamepad-probe
