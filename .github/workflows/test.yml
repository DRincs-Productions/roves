name: 'Build Servo Test Binaries (from source, with local patches)'

# Lives inside servo/ (this directory), not the parent pixi-vn-react-template repo's own
# .github/workflows/ — see ../CLAUDE.md: this vendored Servo copy is meant to be fully
# self-contained and eventually separable from the parent project, so anything Servo-
# specific (patches, this CI) lives here, not scattered in the parent repo.
#
# IMPORTANT / current status: GitHub Actions only auto-discovers workflows under
# .github/workflows/ at an actual *repository root*. Today, this `servo/` directory is
# just a subfolder of the parent repo (and is gitignored there — see ../CLAUDE.md), so
# this workflow will NOT run anywhere until `servo/` itself is pushed as its own
# top-level GitHub repository (e.g. the BlackRam-oss/servo fork created for this
# purpose). Until then, this file just sits here ready for that day.
#
# This does NOT build the real "embedded" release (see the parent project's
# .github/workflows/embedded.yml, which downloads the official prebuilt servoshell
# binary). This workflow instead builds Servo *from source* — pristine upstream tag +
# our own patches/ applied on top — purely to smoke-test local customizations (see
# ../CUSTOMIZATIONS.md) on real Windows/Linux/macOS machines, without needing to compile
# Servo (a very heavy, hours-long build) on a dev machine. Every run overwrites the same
# "test" GitHub Release — it is not versioned, not meant to be depended on.
#
# Why build from a fresh download instead of just using the working tree directly: most
# of this directory's pristine content (~1.3GB, almost entirely the WPT test suite) is
# itself gitignored (see ../.gitignore) and so isn't guaranteed to exist wherever this
# workflow runs. patches/servo-v<tag>/*.patch is the tracked source of truth for our
# customizations; this workflow downloads the pristine tag fresh on every run and
# applies them, so nothing bulky needs to be committed anywhere.

on:
  push:
    paths:
      - 'patches/**'
      - 'test-page/**'
      - '.github/workflows/test.yml'
  workflow_dispatch: {}

env:
  SERVO_TAG: '0.4.0'
  TEST_RELEASE_TAG: 'test'

jobs:
  # ── Create the rolling "test" release exactly once before the matrix starts ────
  ensure-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ensure release "test" exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TEST_RELEASE_TAG" 2>/dev/null || \
          gh release create "$TEST_RELEASE_TAG" \
            --title "Servo customization test build" \
            --notes "Rolling test build from source (Servo v${SERVO_TAG} + patches/). Overwritten on every push touching patches/. Not a real release — see embedded.yml for that. Latest build: commit ${{ github.sha }}." \
            --prerelease \
            2>/dev/null || \
          gh release view "$TEST_RELEASE_TAG" > /dev/null

  # ── Build Servo from source (pristine tag + our patches) and upload per platform ─
  build-and-publish:
    needs: ensure-test-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Every platform gets both its portable output and its installable
        # one — `mach bundle`'s own --deb/--msi/--dmg (see CUSTOMIZATIONS.md
        # and README.md's "Getting started" per-OS sections for what each
        # produces). This workflow exists to smoke-test that mach bundle
        # actually still works, so it exercises every mode mach bundle
        # supports on each OS, not just the portable default.
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
            package_mode: 'portable'
          - platform: 'windows-latest'
            os_name: 'windows'
            package_mode: 'msi'
          - platform: 'macos-latest'
            os_name: 'macos'
            package_mode: 'portable'
          - platform: 'macos-latest'
            os_name: 'macos'
            package_mode: 'dmg'
          - platform: 'ubuntu-24.04'
            os_name: 'linux'
            package_mode: 'portable'
          - platform: 'ubuntu-24.04'
            os_name: 'linux'
            package_mode: 'deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup python (gives a consistent `python3` across all 3 OSes)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: setup uv (needed by ./mach, see servo/README.md)
        uses: astral-sh/setup-uv@v5

      # test-page/ (the diagnostic page assembled below) is its own small Vite +
      # React app, unrelated to Servo's own Python/Rust toolchain.
      - name: setup node (for test-page/)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build test-page
        shell: bash
        working-directory: test-page
        run: |
          npm install
          npm run build

      # rustup ships preinstalled on all 3 GitHub-hosted runner images. We don't
      # install a toolchain explicitly: rustup auto-detects and fetches whatever
      # `rust-toolchain.toml` in the downloaded Servo source pins, the first time
      # cargo/mach runs inside that directory. This just forces that fetch early,
      # with its own clear log output, instead of burying it inside the build step.
      - name: prefetch pinned rust toolchain
        shell: bash
        run: |
          curl -fsSL -o /tmp/rust-toolchain.toml "https://raw.githubusercontent.com/servo/servo/v${SERVO_TAG}/rust-toolchain.toml"
          mkdir -p /tmp/toolchain-probe && cp /tmp/rust-toolchain.toml /tmp/toolchain-probe/
          cd /tmp/toolchain-probe && rustup show

      # ── Download pristine upstream Servo source for the pinned tag, then apply
      #    every patch under patches/servo-v${SERVO_TAG}/ on top, in order. This
      #    reconstructs this same directory's tree (minus what ../.gitignore
      #    excludes) plus our customizations — see ../CUSTOMIZATIONS.md for what
      #    each patch does and why.
      - name: download + patch Servo source
        shell: bash
        run: |
          curl -fsSL -o servo-src.zip "https://github.com/servo/servo/archive/refs/tags/v${SERVO_TAG}.zip"
          python3 -c "import zipfile; zipfile.ZipFile('servo-src.zip').extractall('servo-src-tmp')"
          mv "servo-src-tmp/servo-${SERVO_TAG}" servo-src
          rm -rf servo-src-tmp servo-src.zip

          shopt -s nullglob
          patches=(patches/servo-v${SERVO_TAG}/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::No patches found in patches/servo-v${SERVO_TAG}/ — nothing to test."
            exit 1
          fi
          cd servo-src
          chmod +x mach
          for p in "${patches[@]}"; do
            echo "Applying $(basename "$p")..."
            patch -p1 < "../$p"
          done

          # test-page/ isn't part of any patch (../CUSTOMIZATIONS.md: plain test
          # fixtures, not derived from any upstream file, same reasoning as the
          # icon.png/icon.ico entry there) — the patch-apply loop above never
          # recreates it inside servo-src. Mirror it in ourselves so this tree
          # actually matches this repo's real layout (test-page/ next to
          # ports/servoshell/), which ports/servoshell/build.rs's game-icon
          # fallback depends on: it reads test-page/public/icon.{png,ico} via a
          # path relative to its own crate dir, same as a real in-place build,
          # so that file has to genuinely be there — not just reachable one
          # directory further up, the way the bundle step below can get away
          # with. Only public/ (icons) and dist/ (built by the step above) are
          # needed; node_modules is deliberately left out.
          mkdir -p test-page
          cp -r ../test-page/public test-page/public
          cp -r ../test-page/dist test-page/dist

          # Same reasoning, for resources/fonts/ (see CUSTOMIZATIONS.md's boot-splash
          # wordmark entry): the bundled Metal Mania font is a new binary asset a text
          # patch can't carry, but unlike test-page/'s fixtures, gui.rs's
          # include_bytes!("../../../resources/fonts/MetalMania-Regular.ttf") needs it to
          # genuinely exist on disk at that path for mach build to compile at all.
          mkdir -p resources/fonts
          cp -r ../resources/fonts/. resources/fonts/

      # IMPORTANT: invoke `./mach`, never `python3 ./mach`. `mach` is a polyglot
      # shell+python script (see its own top comment): run as a shell script, it
      # re-execs itself via `uv run --frozen python ...` so the pyproject.toml/
      # uv.lock-managed venv (which has `packaging` and everything else `mach`
      # needs) is on sys.path. Feeding it to `python3` directly skips that re-exec
      # entirely — Python parses the shell wrapper as an inert string literal —
      # and runs against a bare interpreter with none of those deps installed,
      # which is exactly the `ModuleNotFoundError: No module named 'packaging'`
      # this comment is here to keep from silently regressing.
      #
      # Windows gets `--skip-platform`: servo's own Windows bootstrap
      # (python/servo/platform/windows.py) shells out to choco *and* to the
      # GStreamer MSI installer via `Start-Process -verb runAs` — a UAC
      # elevation request. There's no interactive session on a GH runner to
      # click through it, so that call just hangs for hours instead of
      # failing. This is safe to skip entirely here: `media-gstreamer` isn't
      # in servoshell's default Cargo features, so GStreamer isn't needed to
      # build at all, and windows-latest already ships CMake/LLVM/Ninja (the
      # only other things that step would have installed).
      - name: mach bootstrap (installs build dependencies)
        shell: bash
        working-directory: servo-src
        run: |
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            ./mach bootstrap --force --yes --skip-lints --skip-nextest --skip-platform
          else
            ./mach bootstrap --force --yes --skip-lints --skip-nextest
          fi
          # dpkg-dev ships preinstalled on the ubuntu-24.04 runner image, but
          # `mach bundle --deb` (see the assemble step below) hard-depends on
          # `dpkg-deb` from it, so make that explicit rather than relying on
          # what happens to already be there.
          if [ "${{ matrix.package_mode }}" = "deb" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev
          fi

      # windows-latest ships WiX Toolset v3 preinstalled (see
      # actions/runner-images), with $WIX pointing at its install root — but
      # its bin/ (candle.exe/light.exe, which `mach bundle --msi` shells out
      # to, see post_build_commands.py's _wrap_windows_msi) isn't on PATH
      # by default.
      - name: add WiX Toolset to PATH (--msi only)
        if: matrix.package_mode == 'msi'
        shell: pwsh
        run: echo "$env:WIX\bin" >> $env:GITHUB_PATH

      # Debug build, not --release: this workflow exists to smoke-test behavior
      # (e.g. "are the tabs really gone?"), not to ship an optimized binary. Debug
      # compiles noticeably faster, which matters since this runs on every push.
      #
      # --media-stack dummy: by default `./mach build` resolves to the real
      # gstreamer media stack on every non-cross build and hard-fails if
      # GStreamer isn't installed (`command_base.py`'s `is_media_enabled`/
      # `run_cargo_build_like_command`) — independently of servoshell's own
      # Cargo `media-gstreamer` feature not being in its default set. We don't
      # need real media playback to check window chrome, and `dummy` sidesteps
      # needing GStreamer installed (build- or run-time) on any platform here.
      #
      # --features steam: `steam` is opt-in (not in servoshell's default Cargo
      # features, see ports/servoshell/Cargo.toml) and, until now, had never
      # actually been compiled by CI — see CUSTOMIZATIONS.md's "steam:` protocol
      # bridge" entry, which flagged exactly this as unverified. Building it here
      # on all 3 platforms is that verification: it exercises steamworks-sys
      # actually compiling/linking and build.rs's copy_steam_lib finding and
      # copying the Steamworks redistributable (steam_api64.dll/libsteam_api.*)
      # next to the binary, which the bundle step below then picks up.
      - name: mach build (debug)
        shell: bash
        working-directory: servo-src
        run: ./mach build --media-stack dummy --features steam

      # `mach bundle` (see ../CUSTOMIZATIONS.md) is what actually builds the
      # single play.exe/Roves.app/play executable — this step's only job is
      # to hand it the diagnostic page built above (test-page/dist, copied
      # into servo-src by the "download + patch" step so this tree mirrors
      # this repo's real layout — a real run would point --content-dir at
      # the parent project's own `dist/` instead) and, for the linux-deb
      # matrix entry, ask for --deb instead of the default self-contained
      # `play` binary.
      - name: assemble test bundle
        shell: bash
        working-directory: servo-src
        run: |
          BUNDLE_ARGS=(
            --content-dir test-page/dist --output ../release
            --package-name servoshell-test --package-version "${SERVO_TAG}"
          )
          case "${{ matrix.package_mode }}" in
            deb) BUNDLE_ARGS+=(--deb) ;;
            msi) BUNDLE_ARGS+=(--msi) ;;
            dmg) BUNDLE_ARGS+=(--dmg) ;;
          esac
          ./mach bundle "${BUNDLE_ARGS[@]}"

          cat > ../release/NOTE.txt << 'EOF'
          Debug test build, media stack "dummy" (no GStreamer, no video/audio
          playback). This build only exists to check window chrome/behavior —
          see the parent project's embedded.yml for the real release build.
          EOF
          if [ "${{ matrix.os_name }}" = "macos" ] && [ "${{ matrix.package_mode }}" = "portable" ]; then
            echo "Native arch of the macos-latest runner only (no universal binary, no x86_64 cross-build)." >> ../release/NOTE.txt
          fi
          case "${{ matrix.package_mode }}" in
            deb) echo "Install with: sudo dpkg -i *.deb — then launch via your app menu, or /usr/bin/servoshell-test." >> ../release/NOTE.txt ;;
            msi) echo "Run the .msi installer, then launch from the Start Menu or Program Files\\servoshell-test\\play.exe." >> ../release/NOTE.txt ;;
            dmg) echo "Open the .dmg and drag Roves.app to Applications, as prompted." >> ../release/NOTE.txt ;;
            portable) echo "Run play.exe (Windows) / Roves.app (macOS) / play (Linux) — the only executable here; no separate engine binary or extractor tool is included." >> ../release/NOTE.txt ;;
          esac

      # Renamed to a named subfolder (after the content being bundled — "test-page"
      # here; a real bundle would use the actual game's name) before zipping, rather
      # than zipping `release/`'s contents directly at the archive root: extracting
      # otherwise dumps play.exe/play and 8+ loose DLLs/support files straight into
      # whatever folder you extract into (e.g. Downloads), instead of one folder.
      - name: zip bundle (Linux/macOS)
        if: matrix.os_name != 'windows'
        run: |
          ZIP="servoshell-test_${{ matrix.os_name }}-${{ matrix.package_mode }}.zip"
          mv release servo-test-page
          zip -r "$ZIP" servo-test-page
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: zip bundle (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $zip = "servoshell-test_windows-${{ matrix.package_mode }}.zip"
          Rename-Item -Path release -NewName servo-test-page
          Compress-Archive -Path servo-test-page -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TEST_RELEASE_TAG" "$ZIP" --clobber
