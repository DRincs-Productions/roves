name: 'Build Servo Test Binaries (from source, with local patches)'

# This workflow builds Servo *from source* — pristine upstream tag + our own patches/
# applied on top — purely to smoke-test local customizations (see ../CUSTOMIZATIONS.md) on
# real Windows/Linux/macOS machines, without needing to compile Servo (a very heavy,
# hours-long build) on a dev machine. Every run overwrites the same "test" GitHub Release —
# it is not versioned, not meant to be depended on, and is not the real distributable shell
# (see release.yml for that).
#
# Why build from a fresh download instead of just using the working tree directly: most of
# this repo's own pristine content (~1.3GB, almost entirely the WPT test suite) is itself
# gitignored (see ../.gitignore) and so isn't guaranteed to exist wherever this workflow
# runs. patches/servo-v<tag>/*.patch is the tracked source of truth for our customizations;
# this workflow downloads the pristine tag fresh on every run and applies them, so nothing
# bulky needs to be committed anywhere.

on:
  push:
    paths:
      - 'patches/**'
      - 'test-page/**'
      - '.github/workflows/test.yml'
  workflow_dispatch: {}

env:
  SERVO_TAG: '0.4.0'
  TEST_RELEASE_TAG: 'test'

jobs:
  # ── Create the rolling "test" release exactly once before the matrix starts ────
  ensure-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ensure release "test" exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TEST_RELEASE_TAG" 2>/dev/null || \
          gh release create "$TEST_RELEASE_TAG" \
            --title "Servo customization test build" \
            --notes "Rolling test build from source (Servo v${SERVO_TAG} + patches/). Overwritten on every push touching patches/. Not a real release — see embedded.yml for that. Latest build: commit ${{ github.sha }}." \
            --prerelease \
            2>/dev/null || \
          gh release view "$TEST_RELEASE_TAG" > /dev/null

  # ── Build Servo from source (pristine tag + our patches) and upload per platform ─
  build-and-publish:
    needs: ensure-test-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Every platform gets both its portable output and its installable
        # one — `mach bundle`'s own --deb/--msi/--dmg (see CUSTOMIZATIONS.md
        # and README.md's "Getting started" per-OS sections for what each
        # produces). This workflow exists to smoke-test that mach bundle
        # actually still works, so it exercises every mode mach bundle
        # supports on each OS, not just the portable default.
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
            package_mode: 'portable'
          - platform: 'windows-latest'
            os_name: 'windows'
            package_mode: 'msi'
          - platform: 'macos-latest'
            os_name: 'macos'
            package_mode: 'portable'
          - platform: 'macos-latest'
            os_name: 'macos'
            package_mode: 'dmg'
          - platform: 'ubuntu-24.04'
            os_name: 'linux'
            package_mode: 'portable'
          - platform: 'ubuntu-24.04'
            os_name: 'linux'
            package_mode: 'deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup python (gives a consistent `python3` across all 3 OSes)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: setup uv (needed by ./mach, see servo/README.md)
        uses: astral-sh/setup-uv@v5

      # test-page/ (the diagnostic page assembled below) is its own small Vite +
      # React app, unrelated to Servo's own Python/Rust toolchain.
      - name: setup node (for test-page/)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build test-page
        shell: bash
        working-directory: test-page
        run: |
          npm install
          npm run build

      # rustup ships preinstalled on all 3 GitHub-hosted runner images. We don't
      # install a toolchain explicitly: rustup auto-detects and fetches whatever
      # `rust-toolchain.toml` in the downloaded Servo source pins, the first time
      # cargo/mach runs inside that directory. This just forces that fetch early,
      # with its own clear log output, instead of burying it inside the build step.
      - name: prefetch pinned rust toolchain
        shell: bash
        run: |
          curl -fsSL -o /tmp/rust-toolchain.toml "https://raw.githubusercontent.com/servo/servo/v${SERVO_TAG}/rust-toolchain.toml"
          mkdir -p /tmp/toolchain-probe && cp /tmp/rust-toolchain.toml /tmp/toolchain-probe/
          cd /tmp/toolchain-probe && rustup show

      # ── Download pristine upstream Servo source for the pinned tag, then apply
      #    every patch under patches/servo-v${SERVO_TAG}/ on top, in order. This
      #    reconstructs this same directory's tree (minus what ../.gitignore
      #    excludes) plus our customizations — see ../CUSTOMIZATIONS.md for what
      #    each patch does and why.
      - name: download + patch Servo source
        shell: bash
        run: |
          curl -fsSL -o servo-src.zip "https://github.com/servo/servo/archive/refs/tags/v${SERVO_TAG}.zip"
          python3 -c "import zipfile; zipfile.ZipFile('servo-src.zip').extractall('servo-src-tmp')"
          mv "servo-src-tmp/servo-${SERVO_TAG}" servo-src
          rm -rf servo-src-tmp servo-src.zip

          shopt -s nullglob
          patches=(patches/servo-v${SERVO_TAG}/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::No patches found in patches/servo-v${SERVO_TAG}/ — nothing to test."
            exit 1
          fi
          cd servo-src
          chmod +x mach
          for p in "${patches[@]}"; do
            echo "Applying $(basename "$p")..."
            patch -p1 < "../$p"
          done

          # test-page/ isn't part of any patch (../CUSTOMIZATIONS.md: plain test
          # fixtures, not derived from any upstream file, same reasoning as the
          # icon.png/icon.ico entry there) — the patch-apply loop above never
          # recreates it inside servo-src. Mirror it in ourselves so this tree
          # actually matches this repo's real layout (test-page/ next to
          # ports/servoshell/), which ports/servoshell/build.rs's game-icon
          # fallback depends on: it reads test-page/public/icon.{png,ico} via a
          # path relative to its own crate dir, same as a real in-place build,
          # so that file has to genuinely be there — not just reachable one
          # directory further up, the way the bundle step below can get away
          # with. Only public/ (icons) and dist/ (built by the step above) are
          # needed; node_modules is deliberately left out.
          mkdir -p test-page
          cp -r ../test-page/public test-page/public
          cp -r ../test-page/dist test-page/dist

          # Same reasoning, for resources/fonts/ (see CUSTOMIZATIONS.md's boot-splash
          # wordmark entry): the bundled Metal Mania font is a new binary asset a text
          # patch can't carry, but unlike test-page/'s fixtures, gui.rs's
          # include_bytes!("../../../resources/fonts/MetalMania-Regular.ttf") needs it to
          # genuinely exist on disk at that path for mach build to compile at all.
          mkdir -p resources/fonts
          cp -r ../resources/fonts/. resources/fonts/

          # Same reasoning again, for the Roves-branded icon rasters (see
          # CUSTOMIZATIONS.md's "boot splash still shows Servo's icon" entry): these are
          # also new binary assets no text patch can carry, and without this copy step
          # this tree still had *upstream Servo's own* resources/servo_64.png/servo.ico
          # sitting at these exact paths (same filenames, real Servo ships its own icon
          # there too) — gui.rs's include_bytes!/build.rs's icon embedding compiled fine
          # either way, silently baking in the wrong (upstream) icon instead of failing
          # loudly, which is exactly how this went unnoticed.
          cp ../resources/servo_64.png ../resources/servo_1024.png ../resources/servo.ico ../resources/servo.icns resources/

      # Windows only: install the real GStreamer runtime+devel MSIs ourselves, directly via
      # msiexec, to the exact path `./mach bootstrap`'s own installer would use (see
      # python/servo/platform/windows.py's DEPENDENCIES_DIR — servo-src/target/dependencies
      # here). We bypass that installer's own `Start-Process -verb runAs` UAC elevation
      # request, which hangs indefinitely on a non-interactive GH runner with no one to click
      # through it — this used to be sidestepped entirely by building with
      # `--media-stack dummy` instead (no GStreamer needed at all), until this build started
      # needing real audio/video too. Same approach release.yml already uses for its own
      # real-GStreamer Windows build — see that workflow's own comment for the full
      # reasoning. `--skip-platform` below then skips mach's own (would-be-hanging) attempt
      # to install it again; `is_gstreamer_installed()` still finds it at this path
      # independently of that skip, since that check runs as part of the build step itself.
      - name: install GStreamer (Windows, non-interactive)
        if: matrix.os_name == 'windows'
        shell: pwsh
        working-directory: servo-src
        run: |
          $ErrorActionPreference = "Stop"
          $depsUrl = "https://github.com/servo/servo-build-deps/releases/download/msvc-deps"
          $targetDir = Join-Path (Get-Location) "target\dependencies"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          foreach ($name in @("gstreamer-1.0-msvc-x86_64-1.22.8.msi", "gstreamer-1.0-devel-msvc-x86_64-1.22.8.msi")) {
            $msi = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -Uri "$depsUrl/$name" -OutFile $msi
            $proc = Start-Process msiexec.exe -ArgumentList @("/a", $msi, "TARGETDIR=$targetDir", "/qn") -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "msiexec failed for $name with exit code $($proc.ExitCode)" }
          }

      # IMPORTANT: invoke `./mach`, never `python3 ./mach`. `mach` is a polyglot
      # shell+python script (see its own top comment): run as a shell script, it
      # re-execs itself via `uv run --frozen python ...` so the pyproject.toml/
      # uv.lock-managed venv (which has `packaging` and everything else `mach`
      # needs) is on sys.path. Feeding it to `python3` directly skips that re-exec
      # entirely — Python parses the shell wrapper as an inert string literal —
      # and runs against a bare interpreter with none of those deps installed,
      # which is exactly the `ModuleNotFoundError: No module named 'packaging'`
      # this comment is here to keep from silently regressing.
      #
      # Linux only: apt-daily-upgrade.service (a background timer, unrelated to anything we
      # ask for) can hold the dpkg lock for several minutes right after a fresh runner boots
      # -- any apt-get issued into that window (ours below, but also mach bootstrap's own
      # internal ones) just sits there waiting for the lock instead of failing, silently
      # consuming the whole job. Confirmed by two real, reproduced hangs: once inside our own
      # dpkg-dev install, once inside mach bootstrap's own apt-get calls for an entirely
      # different matrix entry -- i.e. this isn't specific to what *we* install, so the fix
      # has to run before mach bootstrap too, not just before our own apt-get call.
      - name: stop background apt timers (Linux only, avoids a dpkg-lock hang)
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true

      # Windows: --skip-platform (see the GStreamer step above for why). Linux/macOS: no
      # --skip-platform — their own bootstrap paths install GStreamer non-interactively
      # already (apt packages on Linux, `sudo installer` on macOS, both already covered by
      # `--yes` here), so nothing extra is needed there for the real media stack to work.
      - name: mach bootstrap (installs build dependencies)
        shell: bash
        working-directory: servo-src
        env:
          DEBIAN_FRONTEND: noninteractive
        # Backstop beyond the apt-timer fix above: caps how long a genuine hang here (this
        # exact step, on this exact matrix entry, silently ran for a full hour before being
        # investigated and cancelled by hand) can consume the job, regardless of the exact
        # cause. mach bootstrap itself is normally done in well under a minute.
        timeout-minutes: 15
        run: |
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            ./mach bootstrap --force --yes --skip-lints --skip-nextest --skip-platform
          else
            ./mach bootstrap --force --yes --skip-lints --skip-nextest
          fi
          # dpkg-dev ships preinstalled on the ubuntu-24.04 runner image, but `mach bundle
          # --deb` (see the assemble step below) hard-depends on dpkg-deb from it, so check
          # explicitly rather than silently relying on what happens to already be there --
          # skipping apt-get entirely in the (expected) common case avoids needing the lock
          # at all. `timeout` on both calls: a real hang now fails fast and loud instead of
          # silently consuming the job for hours, regardless of the exact cause.
          if [ "${{ matrix.package_mode }}" = "deb" ] && ! command -v dpkg-deb >/dev/null; then
            timeout 120 sudo apt-get update
            timeout 120 sudo apt-get install -y --no-install-recommends dpkg-dev
          fi

      # windows-latest ships WiX Toolset v3 preinstalled (see
      # actions/runner-images), with $WIX pointing at its install root — but
      # its bin/ (candle.exe/light.exe, which `mach bundle --msi` shells out
      # to, see post_build_commands.py's _wrap_windows_msi) isn't on PATH
      # by default.
      - name: add WiX Toolset to PATH (--msi only)
        if: matrix.package_mode == 'msi'
        shell: pwsh
        run: echo "$env:WIX\bin" >> $env:GITHUB_PATH

      # Debug build, not --release: this workflow exists to smoke-test behavior
      # (e.g. "are the tabs really gone?"), not to ship an optimized binary. Debug
      # compiles noticeably faster, which matters since this runs on every push.
      #
      # Real GStreamer media stack, no --media-stack dummy: this used to build with
      # `dummy` (no GStreamer needed at all, on any platform) since this workflow only
      # existed to check window chrome, not real playback — but that also meant a real
      # audio/video regression (e.g. a broken bundled-DLL/dylib layout) could go
      # completely unnoticed through an all-green run, since the dummy backend never
      # touches that code path at all. The Windows GStreamer install itself is handled
      # non-interactively above, specifically so this doesn't hang; Linux/macOS already
      # got real GStreamer for free from a plain `mach bootstrap`. The smoke-test step
      # below now also explicitly checks roves.log for a GStreamer init failure.
      #
      # --features steam: `steam` is opt-in (not in servoshell's default Cargo
      # features, see ports/servoshell/Cargo.toml) and, until now, had never
      # actually been compiled by CI — see CUSTOMIZATIONS.md's "steam:` protocol
      # bridge" entry, which flagged exactly this as unverified. Building it here
      # on all 3 platforms is that verification: it exercises steamworks-sys
      # actually compiling/linking and build.rs's copy_steam_lib finding and
      # copying the Steamworks redistributable (steam_api64.dll/libsteam_api.*)
      # next to the binary, which the bundle step below then picks up.
      - name: mach build (debug)
        shell: bash
        working-directory: servo-src
        run: ./mach build --features steam

      # `mach bundle` (see ../CUSTOMIZATIONS.md) is what actually builds the
      # single play.exe/play.app/play executable — this step's only job is
      # to hand it the diagnostic page built above (test-page/dist, copied
      # into servo-src by the "download + patch" step so this tree mirrors
      # this repo's real layout — a real run would point --content-dir at
      # the parent project's own `dist/` instead) and, for the linux-deb
      # matrix entry, ask for --deb instead of the default self-contained
      # `play` binary.
      - name: assemble test bundle
        shell: bash
        working-directory: servo-src
        run: |
          BUNDLE_ARGS=(
            --content-dir test-page/dist --output ../release
            --package-name servoshell-test --package-version "${SERVO_TAG}"
            --diagnostic-script
          )
          case "${{ matrix.package_mode }}" in
            deb) BUNDLE_ARGS+=(--deb) ;;
            msi) BUNDLE_ARGS+=(--msi) ;;
            dmg) BUNDLE_ARGS+=(--dmg) ;;
          esac
          ./mach bundle "${BUNDLE_ARGS[@]}"

          cat > ../release/NOTE.txt << 'EOF'
          Debug test build, real GStreamer media stack. This build only
          exists to smoke-test window chrome/behavior/audio-video on every
          push — see the parent project's embedded.yml for the real release
          build.
          EOF
          if [ "${{ matrix.os_name }}" = "macos" ] && [ "${{ matrix.package_mode }}" = "portable" ]; then
            echo "Native arch of the macos-latest runner only (no universal binary, no x86_64 cross-build)." >> ../release/NOTE.txt
          fi
          case "${{ matrix.package_mode }}" in
            deb) echo "Install with: sudo dpkg -i *.deb — then launch via your app menu, or /usr/bin/servoshell-test." >> ../release/NOTE.txt ;;
            msi) echo "Run the .msi installer, then launch from the Start Menu or Program Files\\servoshell-test\\play.exe." >> ../release/NOTE.txt ;;
            dmg) echo "Open the .dmg and drag play.app to Applications, as prompted." >> ../release/NOTE.txt ;;
            portable) echo "Run play.exe (Windows) / play.app (macOS) / play (Linux) — the only executable here; no separate engine binary or extractor tool is included." >> ../release/NOTE.txt ;;
          esac

      # Every step above only ever confirmed `mach bundle` *succeeds* — never
      # that the bundle it produces actually *launches*. That gap is exactly
      # how the `--package-name`/`--package-version` launch-args leak (see
      # CUSTOMIZATIONS.md's "Bundled launches no longer die on a broken
      # launch.json" entry) went unnoticed through multiple green runs of
      # this same workflow: every real double-click of the resulting
      # play.exe crashed instantly, while CI stayed green throughout. These
      # two steps actually run the binary mach just built — for real, for a
      # few seconds — and fail the job if it doesn't come up cleanly, the
      # same check a human tester would do by hand. Deliberately not a
      # pixel-perfect check (no screenshot, no window-content assertion) —
      # just "does the process still exist a few seconds after launch, past
      # argument parsing and window/GL creation", which is exactly the class
      # of failure this exists to catch (a crash or exit before a window
      # ever appears) without needing a display-comparison harness.
      - name: smoke test — launch the bundle and check it doesn't crash (Linux/macOS)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          if [ "${{ matrix.os_name }}" = "linux" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
            RUNNER=(xvfb-run -a --server-args="-screen 0 1280x720x24")
            if [ "${{ matrix.package_mode }}" = "deb" ]; then
              # A real .deb, unlike --msi/--dmg's "wrap the same portable output" — the
              # binary only exists once actually installed (see post_build_commands.py's
              # _bundle_linux_deb: /usr/lib/<package_name>/, /usr/bin/<package_name> symlink).
              sudo dpkg -i release/*.deb
              BIN="/usr/bin/servoshell-test"
            else
              BIN="release/play"
            fi
          else
            RUNNER=()
            if [ "${{ matrix.package_mode }}" = "dmg" ]; then
              # --dmg wraps play.app into a real disk image and deletes the staged .app
              # (see post_build_commands.py's bundle()) — has to be mounted to reach the
              # same binary a player would get from dragging it to Applications.
              DMG=$(ls release/*.dmg 2>/dev/null | head -1)
              if [ -z "$DMG" ]; then
                echo "::error::no .dmg found under release/ — contents:"
                find release -maxdepth 3
                exit 1
              fi
              MOUNT_DIR=$(mktemp -d)
              hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT_DIR"
              BIN="$MOUNT_DIR/play.app/Contents/MacOS/play"
            else
              BIN="release/play.app/Contents/MacOS/play"
            fi
          fi

          if [ ! -e "$BIN" ]; then
            echo "::error::expected binary not found at $BIN — contents of release/:"
            find release -maxdepth 3
            exit 1
          fi
          chmod +x "$BIN" || true

          # `set -e` (this shell's default) would otherwise abort the whole step the
          # instant the launched process has already exited — right when this step most
          # needs to print diagnostics instead of silently vanishing into a bare "Process
          # completed with exit code N".
          set +e
          "${RUNNER[@]}" "$BIN" > smoke-stdout.log 2> smoke-stderr.log &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            STILL_RUNNING=true
            kill "$PID"
            wait "$PID" 2>/dev/null
          else
            STILL_RUNNING=false
            wait "$PID"
            EXIT_CODE=$?
          fi

          echo "still running after 10s: $STILL_RUNNING"
          [ "$STILL_RUNNING" = false ] && echo "exit code: $EXIT_CODE"
          echo "--- stdout ---"; cat smoke-stdout.log
          echo "--- stderr ---"; cat smoke-stderr.log

          CACHE_ROOT="$HOME/.cache"
          [ "${{ matrix.os_name }}" = "macos" ] && CACHE_ROOT="$HOME/Library/Caches"
          LOG=$(find "$CACHE_ROOT" -iname roves.log 2>/dev/null -exec ls -t {} + 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            echo "--- roves.log ($LOG) ---"; cat "$LOG"
          else
            echo "no roves.log found under $CACHE_ROOT"
          fi

          # Explicit GStreamer/audio check: media_platform::init (servo.rs) logs this exact
          # line and exits before a window ever appears on a real init failure, so
          # STILL_RUNNING=false already catches it — but calling it out by name here means
          # a GStreamer regression reads as "GStreamer failed to initialize", not just a
          # generic "bundle exited early", straight from the job summary/annotations.
          if [ -n "$LOG" ] && grep -q "Error initializing GStreamer" "$LOG"; then
            echo "::error::GStreamer failed to initialize — see roves.log above for the plugin/DLL error"
          fi

          [ -n "${MOUNT_DIR:-}" ] && hdiutil detach "$MOUNT_DIR" 2>/dev/null

          if [ "$STILL_RUNNING" = false ]; then
            # Also emitted as ::notice:: annotations, not just plain echo: annotations are
            # readable from the public Checks API without a token (unlike step logs, which
            # need repo-admin auth to download) — the only way to see this output at all
            # without a GitHub token/gh CLI on hand. %25/%0D/%0A-escaped per the workflow
            # command spec so embedded newlines don't break parsing.
            gh_notice() {
              local msg="$1"
              msg="${msg//%/%25}"; msg="${msg//$'\r'/%0D}"; msg="${msg//$'\n'/%0A}"
              echo "::notice::${msg}"
            }
            gh_notice "exit code: $EXIT_CODE"
            gh_notice "stdout: $(cat smoke-stdout.log)"
            gh_notice "stderr: $(cat smoke-stderr.log)"
            gh_notice "roves.log: $([ -n "$LOG" ] && cat "$LOG" || echo '(none found)')"
            echo "::error::bundle exited on its own within 10s — treating as a launch failure"
            exit 1
          fi

      - name: smoke test — launch the bundle and check it doesn't crash (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          if ("${{ matrix.package_mode }}" -eq "msi") {
            # --msi wraps the portable output into a real installer and deletes the
            # staged play.exe (see post_build_commands.py's bundle()) — release/ only has
            # the .msi itself here, so testing "does the bundle launch" means actually
            # installing it first, the same way a player running the installer would.
            $msi = Get-ChildItem -Path release -Filter *.msi -Recurse | Select-Object -First 1
            if (-not $msi) {
              Write-Error "no .msi found under release/ — contents:"
              Get-ChildItem -Path release -Recurse
              exit 1
            }
            $installDir = Join-Path $env:RUNNER_TEMP "roves-install"
            $msiLog = Join-Path $env:RUNNER_TEMP "msiexec.log"
            $msiProc = Start-Process msiexec.exe -ArgumentList @(
              "/i", $msi.FullName, "/quiet", "/qn", "/norestart",
              "INSTALLDIR=$installDir", "/l*v", $msiLog
            ) -Wait -PassThru
            if ($msiProc.ExitCode -ne 0) {
              Write-Error "msiexec install failed with exit code $($msiProc.ExitCode)"
              Get-Content $msiLog -Tail 60 -ErrorAction SilentlyContinue
              exit 1
            }
            $exe = Get-ChildItem -Path $installDir -Filter play.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) {
              Write-Error "no play.exe found under $installDir after a successful-looking install — contents:"
              Get-ChildItem -Path $installDir -Recurse -ErrorAction SilentlyContinue
              exit 1
            }
          } else {
            $exe = Get-ChildItem -Path release -Filter play.exe -Recurse | Select-Object -First 1
            if (-not $exe) { Write-Error "no play.exe found under release/"; exit 1 }
          }

          $stdout = Join-Path $env:RUNNER_TEMP "smoke-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "smoke-stderr.log"
          $proc = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 10
          $stillRunning = -not $proc.HasExited
          if ($stillRunning) { Stop-Process -Id $proc.Id -Force }

          Write-Host "still running after 10s: $stillRunning"
          if (-not $stillRunning) { Write-Host "exit code: $($proc.ExitCode)" }
          Write-Host "--- stdout ---"; Get-Content $stdout -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content $stderr -ErrorAction SilentlyContinue

          $log = Get-ChildItem -Path "$env:LOCALAPPDATA" -Filter roves.log -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) {
            Write-Host "--- roves.log ($($log.FullName)) ---"
            Get-Content $log.FullName
          } else {
            Write-Host "no roves.log found under $env:LOCALAPPDATA"
          }

          # Explicit GStreamer/audio check: media_platform::init (servo.rs) logs this exact
          # line and exits before a window ever appears on a real init failure, so
          # $stillRunning=$false already catches it — but calling it out by name here means
          # a GStreamer regression reads as "GStreamer failed to initialize", not just a
          # generic "bundle exited early", straight from the job summary/annotations.
          if ($log -and (Select-String -Path $log.FullName -Pattern "Error initializing GStreamer" -Quiet)) {
            Write-Host "::error::GStreamer failed to initialize — see roves.log above for the plugin/DLL error"
          }

          if (-not $stillRunning) {
            # Also emitted as ::notice:: annotations, not just plain Write-Host: annotations
            # are readable from the public Checks API without a token (unlike step logs,
            # which need repo-admin auth to download) — same reasoning, and same gap this
            # closes, as the Linux/macOS smoke-test step's own gh_notice() a few steps up.
            function gh_notice($msg) {
              $escaped = $msg -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::notice::$escaped"
            }
            gh_notice "exit code: $($proc.ExitCode)"
            gh_notice "stdout: $(Get-Content $stdout -ErrorAction SilentlyContinue | Out-String)"
            gh_notice "stderr: $(Get-Content $stderr -ErrorAction SilentlyContinue | Out-String)"
            $logText = if ($log) { Get-Content $log.FullName -Raw } else { '(none found)' }
            gh_notice "roves.log: $logText"
            Write-Host "::error::bundle exited on its own within 10s — treating as a launch failure"
            exit 1
          }

      # Renamed to a named subfolder (after the content being bundled — "test-page"
      # here; a real bundle would use the actual game's name) before zipping, rather
      # than zipping `release/`'s contents directly at the archive root: extracting
      # otherwise dumps play.exe/play and 8+ loose DLLs/support files straight into
      # whatever folder you extract into (e.g. Downloads), instead of one folder.
      - name: zip bundle (Linux/macOS)
        if: matrix.os_name != 'windows'
        run: |
          ZIP="servoshell-test_${{ matrix.os_name }}-${{ matrix.package_mode }}.zip"
          mv release servo-test-page
          zip -r "$ZIP" servo-test-page
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # Retries: the smoke test above just force-killed play.exe (a GUI process with dozens
      # of loaded DLLs); Windows can take a moment to actually release its file handles on
      # release/ afterward, so the very next Rename-Item can hit "the process cannot access
      # the file because it is being used by another process" -- confirmed by a real run
      # failing here right after a smoke test that otherwise passed cleanly.
      - name: zip bundle (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $zip = "servoshell-test_windows-${{ matrix.package_mode }}.zip"
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Rename-Item -Path release -NewName servo-test-page -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq $maxAttempts) { throw }
              Write-Host "Rename-Item attempt $attempt failed ($($_.Exception.Message)), retrying in $($attempt * 2)s..."
              Start-Sleep -Seconds ($attempt * 2)
            }
          }
          Compress-Archive -Path servo-test-page -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      # Retries: every matrix job uploads to the same "test" release concurrently, and
      # `gh release upload --clobber` (delete-then-reupload) occasionally hits a transient
      # conflict from another job's own delete/upload landing at the same moment -- confirmed
      # by real roves-ui CI runs (same pattern, mirrored workflow) failing here on unrelated,
      # upload-unrelated commits, always on a subset of platforms, never all of them, and
      # never at the build step itself.
      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$TEST_RELEASE_TAG" "$ZIP" --clobber && exit 0
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1
