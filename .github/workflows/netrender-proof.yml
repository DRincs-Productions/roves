name: Netrender shared-device proof

# Isolated, informational feasibility check of support/netrender-shared-device-proof
# (see its README). It builds only that standalone crate, with the proposed wgpu
# interop patch confined to the fixture's ignored patched/ directory; it does not
# build, gate or change the engine, the Blitz probe or any release.
#
# linux-lavapipe runs both producers (the raw wgpu-core one and the real
# deno_core/deno_webgpu one, where unprivileged JS draws the canvas) on Mesa's
# lavapipe (llvmpipe, Vulkan):
#  - negative: Netrender d2f13ca5 as published must fail ONLY the two known
#    ordering pixels (exit 1), after the bridge, hub, GC and teardown checks held;
#  - positive: the same revision plus upstream/netrender-d2f13ca5-external-texture-order.patch
#    must pass 6/6 with the same checks.
# windows-compile builds the same executables (static CRT link of deno_js) but
# does not run them: the runner's only adapter, WARP, crashes with an access
# violation inside d3d10warp.dll while executing Vello's compute frame, also
# with a plain wgpu device and no bridge (README "WARP").
'on':
  # No push trigger (user 2026-11-26): this old proof runs macOS/Linux jobs, which now run
  # only at release time; dispatch it by hand when needed.
  workflow_dispatch:

concurrency:
  group: netrender-proof-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proof:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-lavapipe
            os: ubuntu-24.04
            run: true
            exe: ''
            # Same layout as the Windows path; deno_core 0.413 without a
            # startup snapshot reads extension JS from the crate paths at run time.
            cargo_home: /home/runner/roves-cargo
            rustflags: ''
          - name: windows-compile
            os: windows-latest
            run: false
            exe: .exe
            cargo_home: C:/roves-cargo
            # One CRT for the whole link, as Deno itself builds on Windows: the
            # prebuilt rusty_v8.lib is /MT (/DEFAULTLIB:libcmt.lib) and v8 150.4.0's
            # build.rs links libcpmt with crt-static (msvcprt otherwise); cc 1.11
            # compiles lcms2-sys (deno_webgpu -> deno_image) with -MT when
            # crt-static is set. Without it the /MD lcms2 objects need ucrt.lib, and
            # adding it next to libcmt's libucrt.lib duplicates
            # _invalid_parameter_noinfo/_wctype. Job-scoped: no repository flag.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_HOME: ${{ matrix.cargo_home }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/../netrender-proof-target
      DENO_WEBGPU_BACKEND: vulkan
      RUST_BACKTRACE: '1'
      RUSTFLAGS: ${{ matrix.rustflags }}
      EXE: ${{ matrix.exe }}
    defaults:
      run:
        shell: bash
        working-directory: support/netrender-shared-device-proof
    steps:
      - uses: actions/checkout@v4
      # Mesa's lavapipe (llvmpipe Vulkan ICD) from the Ubuntu archive, and only
      # that ICD: the runner has no GPU, and VK_DRIVER_FILES pins the loader to
      # lavapipe so the adapter check in ci/verify.py is not satisfied by chance.
      # The ICD file name is taken from the package's own file list instead of
      # being hard-coded: job 132973982729 (ubuntu-24.04) installed the package
      # but had no lvp_icd.x86_64.json, so the manifest name differs on the current
      # image (Mesa can install it without the architecture suffix). Exactly one
      # lavapipe manifest must exist; the listing is annotated, not only logged.
      - name: install lavapipe (Mesa Vulkan software driver)
        if: ${{ runner.os == 'Linux' }}
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          echo "::notice::mesa-vulkan-drivers $(dpkg-query -W -f='${Version}' mesa-vulkan-drivers)"
          mapfile -t icds < <(dpkg-query -L mesa-vulkan-drivers | grep -E '/vulkan/icd\.d/lvp_icd(\.x86_64)?\.json$' || true)
          if [ "${#icds[@]}" -ne 1 ] || [ ! -f "${icds[0]}" ]; then
            echo "::error::expected exactly one lavapipe ICD manifest from mesa-vulkan-drivers, found ${#icds[@]}: ${icds[*]:-none}"
            { dpkg-query -L mesa-vulkan-drivers | grep -F '/vulkan/'; ls -l /usr/share/vulkan/icd.d /etc/vulkan/icd.d; } 2>&1 | sed 's/^/::notice::vulkan files: /' || true
            exit 1
          fi
          icd=${icds[0]}
          echo "::notice::lavapipe ICD $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_DRIVER_FILES=$icd vulkaninfo --summary 2>&1 | grep -E 'deviceName|deviceType|driverInfo|apiVersion' | sed 's/^/::notice::lavapipe: /' || true
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: restore Cargo and build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.cargo_home }}/registry/index
            ${{ matrix.cargo_home }}/registry/cache
            ${{ matrix.cargo_home }}/git/db
            ${{ github.workspace }}/../netrender-proof-target
            ${{ github.workspace }}/../netrender-proof-pristine-target
          key: netrender-proof-${{ matrix.name }}-rust-1.95.0-${{ matrix.rustflags != '' && 'crt-static' || 'default-crt' }}-${{ hashFiles('support/netrender-shared-device-proof/Cargo.lock', 'support/netrender-shared-device-proof/prepare-patched.sh', 'support/netrender-shared-device-proof/upstream/*.patch') }}
      - name: exact pins and crates.io provenance
        run: |
          mkdir -p "$RUNNER_TEMP/netrender-proof/logs"
          python -I ci/verify.py pins
          python -I ci/verify.py crates-io
          sha256sum upstream/*.patch | tee "$RUNNER_TEMP/netrender-proof/logs/patch-sha256.txt"
      # Compile repro of blocker 1: the crates.io wgpu/wgpu-core have no interop
      # API, so the fixture must fail with E0599 on exactly the proposed symbols.
      #
      # The gate reads rustc's JSON diagnostics (code + plain message), not the
      # human output: dtolnay/rust-toolchain exports CARGO_TERM_COLOR=always, so
      # in job 132973982981 every human line began with an ANSI escape, '^error\['
      # matched nothing and the gate reported "no E0599 diagnostic names
      # adapter_clone_id" although the log showed all five E0599 errors.
      # --color never also keeps the stderr log readable.
      - name: pristine wgpu compile repro (expected E0599)
        id: pristine
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/../netrender-proof-pristine-target
          CARGO_TERM_COLOR: never
        run: |
          logs="$RUNNER_TEMP/netrender-proof/logs"
          PRISTINE=1 sh ./prepare-patched.sh
          set +e
          cargo check --locked --color never --message-format json --bin roves-netrender-shared-device-proof \
            > "$logs/pristine-check.json" 2> "$logs/pristine-check.log"
          status=$?
          set -e
          [ "$status" -ne 0 ] || { echo "::error::the pristine wgpu build succeeded: the interop patch is no longer needed"; exit 1; }
          # Annotations, not only the step log: raw logs need repository admin rights.
          python -I - "$logs/pristine-check.json" "$logs/pristine-check.log" <<'PY'
          import json, sys
          symbols = ["adapter_clone_id", "device_clone_id", "queue_clone_id", "texture_clone_id", "from_core_global"]
          errors = []
          with open(sys.argv[1], encoding="utf-8", errors="replace") as f:
              for line in f:
                  if not line.startswith("{"):
                      continue
                  msg = json.loads(line)
                  if msg.get("reason") != "compiler-message" or msg["message"]["level"] != "error":
                      continue
                  m = msg["message"]
                  code = (m.get("code") or {}).get("code")
                  if code is None and m["message"].startswith("aborting due to"):
                      continue
                  errors.append((code, m["message"]))
          for code, text in errors[:20]:
              print(f"::notice::pristine: error[{code}]: {text}")
          ok = True
          if not errors:
              print("::error::pristine build failed without rustc errors (cargo failure, see stderr below)")
              with open(sys.argv[2], encoding="utf-8", errors="replace") as f:
                  for line in f.read().splitlines()[-8:]:
                      print(f"::notice::pristine stderr: {line}")
              sys.exit(1)
          other = [e for e in errors if e[0] != "E0599"]
          if other:
              print(f"::error::pristine build failed with {len(other)} errors other than E0599")
              ok = False
          # Each interop symbol must be named (in backticks) by an E0599
          # diagnostic itself (job 132956577307 reported "0 x E0599" and still
          # passed the former substring check).
          for symbol in symbols:
              if not any(code == "E0599" and f"`{symbol}`" in text for code, text in errors):
                  print(f"::error::no E0599 diagnostic names {symbol}")
                  ok = False
          if not ok:
              sys.exit(1)
          print(f"::notice::pristine wgpu/wgpu-core: {len(errors)} x E0599 on the interop symbols, as expected")
          PY
          rm -rf "$RUNNER_TEMP/pristine" && mv patched "$RUNNER_TEMP/pristine"
      # Runs only after every earlier step succeeded (default success()): after
      # a failed pristine gate, patched/ still holds the pristine sources, and
      # the order-fix steps below must not build against them (job 132973982981
      # did, and failed with E0599 instead of skipping).
      - name: prepare patched wgpu and check its provenance
        id: patched
        run: |
          sh ./prepare-patched.sh
          python -I ci/verify.py patched-diff "$RUNNER_TEMP/pristine" patched
      - name: build (published Netrender d2f13ca5)
        run: |
          bash ci/cargo-retry.sh "$RUNNER_TEMP/netrender-proof/logs/build-negative.log" \
            build --locked --features deno --bins
          mkdir -p "$RUNNER_TEMP/netrender-proof/negative"
          cp "$CARGO_TARGET_DIR/debug/roves-netrender-shared-device-proof$EXE" "$CARGO_TARGET_DIR/debug/deno_js$EXE" \
            "$RUNNER_TEMP/netrender-proof/negative/"
      - name: negative run (expected to fail only the two ordering pixels)
        if: ${{ matrix.run }}
        run: |
          dir="$RUNNER_TEMP/netrender-proof"
          ok=0
          for run in raw:roves-netrender-shared-device-proof deno:deno_js; do
            producer=${run%%:*}; exe="$dir/negative/${run#*:}$EXE"; log="$dir/logs/negative-$producer.log"
            set +e
            timeout 600 "$exe" > "$log" 2>&1
            status=$?
            set -e
            echo "::group::negative $producer (exit $status)"; cat "$log"; echo "::endgroup::"
            python -I ci/verify.py log negative "$producer" lavapipe "$log" "$status" || ok=1
          done
          exit $ok
      # The positive half needs only the patched wgpu tree, so it still runs
      # after a failed negative build or negative assertion, but is skipped
      # cleanly when the setup it depends on failed or was skipped.
      - name: Netrender d2f13ca5 with the proposed order fix
        id: order_fix
        if: ${{ !cancelled() && steps.patched.outcome == 'success' }}
        run: |
          rev=d2f13ca5ecd20df89d148a7cebef28c0962b90ca
          src="$RUNNER_TEMP/netrender"
          rm -rf "$src" && git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/merely-made/netrender "$rev"
          git -C "$src" checkout -q FETCH_HEAD
          [ "$(git -C "$src" rev-parse HEAD)" = "$rev" ] || { echo "::error::Netrender checkout is not $rev"; exit 1; }
          patch="$PWD/upstream/netrender-d2f13ca5-external-texture-order.patch"
          stat=$(git -C "$src" apply --numstat "$patch" | awk '{a+=$1; d+=$2} END {print "+" a "/-" d}')
          [ "$stat" = "+41/-5" ] || { echo "::error::order patch is $stat, expected +41/-5"; exit 1; }
          git -C "$src" apply --check "$patch"
          git -C "$src" apply "$patch"
          git -C "$src" diff --stat
      - name: build (Netrender with the order fix, local path override)
        id: build_positive
        if: ${{ !cancelled() && steps.order_fix.outcome == 'success' }}
        run: |
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.orig"
          netrender="$RUNNER_TEMP/netrender/netrender"
          if command -v cygpath >/dev/null; then netrender=$(cygpath -m "$netrender"); fi
          # Not --locked: the override rewrites the netrender entries of Cargo.lock.
          bash ci/cargo-retry.sh "$RUNNER_TEMP/netrender-proof/logs/build-positive.log" \
            build --features deno --bins \
            --config "patch.\"https://github.com/merely-made/netrender\".netrender.path=\"$netrender\""
          python -I ci/verify.py lock-diff "$RUNNER_TEMP/Cargo.lock.orig" Cargo.lock
          cp "$RUNNER_TEMP/Cargo.lock.orig" Cargo.lock
          git diff --exit-code -- Cargo.lock
          mkdir -p "$RUNNER_TEMP/netrender-proof/positive"
          cp "$CARGO_TARGET_DIR/debug/roves-netrender-shared-device-proof$EXE" "$CARGO_TARGET_DIR/debug/deno_js$EXE" \
            "$RUNNER_TEMP/netrender-proof/positive/"
      - name: positive run (expected 6/6)
        if: ${{ !cancelled() && matrix.run && steps.build_positive.outcome == 'success' }}
        run: |
          dir="$RUNNER_TEMP/netrender-proof"
          [ -d "$dir/positive" ] || { echo "::error::positive executables missing"; exit 1; }
          ok=0
          for run in raw:roves-netrender-shared-device-proof deno:deno_js; do
            producer=${run%%:*}; exe="$dir/positive/${run#*:}$EXE"; log="$dir/logs/positive-$producer.log"
            set +e
            timeout 600 "$exe" > "$log" 2>&1
            status=$?
            set -e
            echo "::group::positive $producer (exit $status)"; cat "$log"; echo "::endgroup::"
            python -I ci/verify.py log positive "$producer" lavapipe "$log" "$status" || ok=1
          done
          exit $ok
      - name: artifact notes
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/netrender-proof"
          cat > "$RUNNER_TEMP/netrender-proof/NOTES.txt" <<EOF
          Commit: $GITHUB_SHA
          Job: ${{ matrix.name }} (executables run in CI: ${{ matrix.run }})
          negative/: fixture with Netrender d2f13ca5 as published (Cargo.lock).
          positive/: same revision + upstream/netrender-d2f13ca5-external-texture-order.patch.
          Both use wgpu 29.0.4 / wgpu-core 29.0.1 + upstream/wgpu-29-core-interop.patch.
          Debug builds. Run with DENO_WEBGPU_BACKEND=vulkan (or dx12 on Windows;
          not on WARP, which crashes in Vello's compute frame, see README).
          roves-netrender-shared-device-proof needs only a Vulkan/DX12 driver.
          deno_js reads deno_webidl/deno_web/deno_webgpu extension JS at run time
          from ${{ matrix.cargo_home }}/registry/src (no startup snapshot): mirror
          that path (symlink/junction) on the machine that runs it.
          EOF
      - name: upload logs and executables
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: netrender-shared-device-proof-${{ matrix.name }}
          path: ${{ runner.temp }}/netrender-proof
          if-no-files-found: warn
          retention-days: 14
