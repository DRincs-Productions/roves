name: Build iOS native WKWebView app

# Smoke-tests the real `mach bundle --ios` path (python/servo/post_build_commands.py's
# `_bundle_ios`) end to end -- the same one roves-action drives, and the iOS mirror of
# android.yml's own reasoning (see that file's own comment): exercising the real toolchain via
# the same code path every real consumer uses, not a hand-rolled Xcode project, so a real
# `_bundle_ios`/bundle.py/App.swift bug can't pass CI undetected. Prior to the 2026-09-14
# `--ios` wiring (see CUSTOMIZATIONS.md), this workflow drove `support/ios/bundle.py` +
# `xcodegen`/`xcodebuild` directly -- now `mach bundle --ios` does that internally instead.
#
# `mach`'s command loader needs `tests/wpt/tests/tools/` to exist even for `bundle` (see
# CLAUDE.md's own entry on this, and android.yml's identical step) -- unlike before this
# change, this workflow now goes through `mach`, so it needs the same workaround.
#
# The `ios` job builds unsigned, for the iOS Simulator only (CODE_SIGNING_ALLOWED=NO) -- there
# is no real Apple developer/distribution signing identity available in CI, the same reason
# release.yml's desktop builds don't attempt any mobile app-store signing either. This only
# proves the staging + XcodeGen + Xcode build pipeline itself works, not a device-installable
# or distributable build -- see support/MOBILE.md's own iOS section for the real
# --ios-release/human-with-Xcode paths.
#
# The `ios-release-signing-smoke` job separately verifies `--ios-release`'s keychain-import
# mechanics using a **self-signed test certificate generated fresh on the runner** -- not a real
# Apple Distribution identity, see that job's own comment for why a full signed-archive-and-export
# can't be verified this way (or why this no longer needs any repo secrets at all).
#
# Also publishes `roves_ios_project.zip` (a snapshot of support/ios/) to the rolling "test"
# GitHub Release (same one test.yml/android.yml use), mirroring android.yml's own
# `roves_android_project.zip` -- a consumer (Packmaster, roves-action) that wants the iOS
# template without a git checkout of the engine can download this directly, the same way
# Packmaster's Android backend already does for the Android project.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SERVO_TAG: '0.5.0'
  TEST_RELEASE_TAG: 'test'

jobs:
  # Mirrors test.yml's/android.yml's own job of the same name -- see android.yml's own
  # comment. All three workflows publish to the same rolling "test" release, so whichever
  # runs first (after the release doesn't exist yet, e.g. right after someone deletes it to
  # retry a failed run) creates it.
  ensure-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ensure release "test" exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TEST_RELEASE_TAG" 2>/dev/null || \
          gh release create "$TEST_RELEASE_TAG" \
            --title "Servo customization test build" \
            --notes "Rolling test build (native WebView containers, no Servo/patches involved on iOS). Overwritten on every push to main. Not a real release — see release.yml for that." \
            --prerelease \
            2>/dev/null || \
          gh release view "$TEST_RELEASE_TAG" > /dev/null

  ios:
    needs: ensure-test-release
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: setup python (gives a consistent `python3` across runners, see ./mach)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: setup uv (needed by ./mach, see README.md)
        uses: astral-sh/setup-uv@v5

      - name: chmod +x mach
        # This repo's own `mach` is tracked as mode 100644 (committed from Windows, where the
        # exec bit is meaningless) -- see CLAUDE.md's "mach needs chmod +x on Linux/macOS".
        run: chmod +x mach

      - name: fetch tests/wpt/tests/tools (mach's command loader needs it to exist)
        # Identical to android.yml's own step of the same name -- see CLAUDE.md's entry on
        # this for the full explanation. Needed here now that this workflow goes through
        # `mach bundle --ios` instead of calling bundle.py/xcodegen/xcodebuild directly.
        run: |
          rm -rf /tmp/wpt-tools-src
          git init -q /tmp/wpt-tools-src
          git -C /tmp/wpt-tools-src remote add origin https://github.com/servo/servo.git
          git -C /tmp/wpt-tools-src config core.sparseCheckout true
          git -C /tmp/wpt-tools-src sparse-checkout init --cone
          git -C /tmp/wpt-tools-src sparse-checkout set tests/wpt/tests/tools
          git -C /tmp/wpt-tools-src fetch --depth 1 --filter=blob:none origin "v${SERVO_TAG}"
          git -C /tmp/wpt-tools-src checkout FETCH_HEAD
          mkdir -p tests/wpt
          cp -r /tmp/wpt-tools-src/tests/wpt/tests tests/wpt/tests
          rm -rf /tmp/wpt-tools-src

      - name: Build smoke-test content
        # Identical to android.yml's own step of the same name, so both platforms exercise
        # the same fetch/localStorage/local-asset behavior.
        run: |
          mkdir -p /tmp/smoke-content
          cp -r test-page/public/. /tmp/smoke-content/
          cat > /tmp/smoke-content/index.html <<'HTML'
          <!doctype html><html><body><h1>Roves native WKWebView</h1><script>
          localStorage.setItem('roves-smoke', 'ok');
          fetch('/favicon.svg').then(r => { if (!r.ok) throw Error(r.status); return r.text(); })
            .then(() => document.body.append('Local assets and storage ready'));
          </script></body></html>
          HTML

      - name: mach bundle --ios
        run: |
          ./mach bundle --ios \
            --content-dir /tmp/smoke-content \
            --output /tmp/ios-output \
            --ios-app-name "Roves Smoke Test" \
            --ios-bundle-id org.roves.smoketest

      - uses: actions/upload-artifact@v4
        with:
          name: roves-ios-webview
          path: /tmp/ios-output/RovesGame.app

      # A clean checkout of support/ios/ -- bundle.py never touches this tracked tree itself
      # (it stages into --output, a separate directory), so there's nothing to strip out
      # first, same as android.yml's own equivalent step for support/android/apk/.
      # Includes the branding assets bundle.py's `stage()` copies from resources/ at build
      # time (servo_1024.png, the Metal Mania font) alongside support/ios/ itself -- a
      # consumer that only downloads this zip (Packmaster's own ios.rs, mirroring how its
      # android.rs already does this for roves_android_project.zip) has no engine checkout to
      # read resources/ from otherwise, unlike support/android/apk/, which already carries
      # its own res/mipmap/servo.webp inside the zipped tree.
      - name: package iOS project for Packmaster/roves-action
        run: |
          mkdir -p /tmp/roves-ios-package/support/ios /tmp/roves-ios-package/resources/fonts
          cp -r support/ios/. /tmp/roves-ios-package/support/ios/
          cp resources/servo_1024.png /tmp/roves-ios-package/resources/
          cp resources/fonts/MetalMania-Regular.ttf resources/fonts/MetalMania-OFL.txt /tmp/roves-ios-package/resources/fonts/
          (cd /tmp/roves-ios-package && zip -rq "$GITHUB_WORKSPACE/roves_ios_project.zip" support/ios resources)

      # Retries: see test.yml's/android.yml's own identical step/comment -- this job can race
      # a concurrent test.yml/android.yml run uploading to the same "test" release.
      - name: upload to "test" release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "$TEST_RELEASE_TAG" roves_ios_project.zip --clobber && break
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
            if [ "$attempt" = "3" ]; then
              echo "::error::failed to upload roves_ios_project.zip after 3 attempts"
              exit 1
            fi
          done

  # Verifies the *keychain-import* half of --ios-release's signing mechanism
  # (_sign_and_export_ios_release in post_build_commands.py) using a self-signed **test**
  # certificate generated fresh on the runner itself -- not a real Apple Distribution identity.
  # Deliberately does NOT run `mach bundle --ios --ios-release` end to end: that also needs a
  # real, Apple-issued provisioning profile (a CMS structure only Apple can produce, see
  # support/MOBILE.md's iOS section) -- no amount of local tooling can fabricate one. What this
  # DOES prove: the `security create-keychain`/`import`/`set-key-partition-list` sequence
  # `_sign_and_export_ios_release` runs works for real on a macOS runner -- once a real
  # certificate/profile/team ID land as secrets, only the profile-trust step is genuinely new
  # ground.
  #
  # 2026-09-15: this used to import a certificate from IOS_CI_TEST_P12_BASE64/_PASSWORD repo
  # secrets, generated once and re-uploaded by hand. That went wrong twice in a row (the two
  # secrets drifted out of sync with each other, then -- even after a verified-matching
  # re-upload -- kept failing on what looked like leftover whitespace from a chat-to-GitHub-
  # secrets-field copy-paste). Since this certificate is purely a mechanism smoke test (its
  # whole point is proving the security-tool sequence works, not carrying any real identity)
  # and is never reused for anything else, generating it fresh inside the job removes the
  # secrets -- and this whole class of "did the two secrets actually stay in sync" bug --
  # entirely. See CUSTOMIZATIONS.md's entry of that date for the full incident.
  ios-release-signing-smoke:
    runs-on: macos-latest
    steps:
      - name: generate a fresh self-signed test signing certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ci-test-key.pem -out /tmp/ci-test-cert.pem \
            -days 1 -nodes -subj "/CN=Roves CI Test Signing" \
            -addext "keyUsage=critical,digitalSignature" -addext "extendedKeyUsage=critical,codeSigning"
          pass=$(uuidgen)
          echo "::add-mask::$pass"
          echo "P12_PASSWORD=$pass" >> "$GITHUB_ENV"
          openssl pkcs12 -export -out /tmp/ci-test.p12 -inkey /tmp/ci-test-key.pem \
            -in /tmp/ci-test-cert.pem -name "Roves CI Test Signing" -passout "pass:$pass"

      - name: import into an ephemeral keychain (same sequence _sign_and_export_ios_release uses)
        run: |
          keychain=/tmp/roves-ci-test.keychain
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import /tmp/ci-test.p12 -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain"
          existing=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$keychain" $existing
          security find-identity -v -p codesigning "$keychain" | tee /tmp/identities.txt
          grep -q "Roves CI Test Signing" /tmp/identities.txt
          security delete-keychain "$keychain"
