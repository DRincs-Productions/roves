name: 'Release'

# Builds and publishes a real, versioned Roves release — distinct from test.yml's rolling
# "test" build (which reconstructs a tree from a pristine upstream download + patches/, purely
# to smoke-test that the patch set itself still applies/works). This workflow builds directly
# from the tagged ref of THIS repo, which already tracks the full patched Servo source (see
# ../CLAUDE.md) — exactly what a real consumer (e.g. roves-action, pinning its `roves-ref`
# input to one of these tags) would get.
#
# Triggered by pushing a tag matching v<major>.<minor>.<patch> (e.g. v0.1.0). See CLAUDE.md's
# "Cutting a versioned release" section for the full procedure, including how to retry a
# failed release by deleting and re-pushing the same tag.

on:
  push:
    tags:
      - 'v*.*.*'

env:
  PACKAGE_NAME: 'roves'
  SERVO_TAG: '0.4.0'

jobs:
  # ── Create (or, on a retried tag, replace) the GitHub Release before the matrix starts ──
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create the GitHub Release for this tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Self-healing for the retry procedure in CLAUDE.md: if this exact tag was deleted
          # and re-pushed after a previous failed attempt, a stale Release object (with
          # partial/no artifacts) may still exist even though the git tag itself is fresh.
          # Start from a clean slate instead of "gh release create" erroring on "already exists".
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true

          cat > notes.md <<'EOF'
          Roves release: the engine shell only — no bundled UI/game content yet. See
          [Roves Packmaster](https://github.com/DRincs-Productions/roves-packmaster) for the GUI that will
          package a real game on top of this in a future release.

          Built with the real GStreamer media stack: bundled automatically with the
          Windows/macOS artifacts below; the Linux artifacts expect GStreamer to already be
          installed via your distro's package manager (see README.md's Linux "Getting
          started" section).

          Portable only for now — no `.msi`/`.dmg`/`.deb` installers in this release.

          Each platform is published twice: the plain default build, and a second build
          compiled with `--features steam` (Steamworks achievements/stats/DLC/overlay/store,
          see README.md's "Steam" section) — same engine otherwise, pick whichever your game
          actually needs.

          | Platform | Plain | Steam-enabled |
          | --- | --- | --- |
          | Windows | `roves_shell_windows.zip` | `roves_shell_windows_steam.zip` |
          | macOS | `roves_shell_macos.zip` | `roves_shell_macos_steam.zip` |
          | Linux | `roves_shell_linux.zip` | `roves_shell_linux_steam.zip` |
          EOF

          gh release create "${{ github.ref_name }}" \
            --title "Roves ${{ github.ref_name }}" \
            --notes-file notes.md

  # ── Build the real release bundle and publish it, once per platform ───────────────────
  build-and-publish:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Portable only for the engine shell release — no --msi/--dmg/--deb installers (see
        # README.md's "Portable vs. installable packages" for what those add; not worth the
        # extra CI surface for a shell-only build with no game content yet).
        #
        # Each platform builds twice: plain (default Cargo features) and Steam-enabled
        # (--features steam) — see the "mach build" step below. `asset_suffix`/`build_features`
        # are plain matrix data (not computed inline via `${{ }}` ternaries scattered across
        # steps) so every step downstream just reads them.
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
            steam: false
            asset_suffix: ''
            build_features: ''
          - platform: 'windows-latest'
            os_name: 'windows'
            steam: true
            asset_suffix: '_steam'
            build_features: '--features steam'
          - platform: 'macos-latest'
            os_name: 'macos'
            steam: false
            asset_suffix: ''
            build_features: ''
          - platform: 'macos-latest'
            os_name: 'macos'
            steam: true
            asset_suffix: '_steam'
            build_features: '--features steam'
          - platform: 'ubuntu-24.04'
            os_name: 'linux'
            steam: false
            asset_suffix: ''
            build_features: ''
          - platform: 'ubuntu-24.04'
            os_name: 'linux'
            steam: true
            asset_suffix: '_steam'
            build_features: '--features steam'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # This repo's `mach` is tracked in git as mode 100644 (not executable) — it was
      # committed from Windows, where the exec bit isn't meaningful. `./mach` runs anyway
      # there, but a fresh Linux/macOS checkout needs this or `./mach bootstrap` below fails
      # immediately with "Permission denied" (exit 126).
      - name: make mach executable (Linux/macOS)
        if: matrix.os_name != 'windows'
        run: chmod +x mach

      # mach's own command loader (python/mach_bootstrap.py's MACH_MODULES list) always
      # loads python/servo/testing_commands.py, which imports WPT test tooling that lives
      # under tests/wpt/ — a directory this repo deliberately excludes from git (~1.3GB of
      # WPT conformance tests, irrelevant to this project — see this repo's own top-level
      # comment). Without it, every mach command except `bootstrap` itself (which has a
      # special-cased fast path in the `mach` script that skips loading this module) crashes
      # immediately with "ModuleNotFoundError: No module named 'localpaths'", before doing
      # anything else — confirmed by reproducing this locally. We don't need the actual WPT
      # test content, only the small Python tooling package that makes those imports
      # resolve (tests/wpt/tests/tools/, ~90MB — not the multi-GB test suite itself), so
      # sparse-checkout just that, with blob filtering so nothing else downloads.
      - name: fetch tests/wpt/tests/tools (mach's command loader needs it to exist)
        shell: bash
        run: |
          rm -rf /tmp/wpt-tools-src
          git init -q /tmp/wpt-tools-src
          git -C /tmp/wpt-tools-src remote add origin https://github.com/servo/servo.git
          git -C /tmp/wpt-tools-src config core.sparseCheckout true
          git -C /tmp/wpt-tools-src sparse-checkout init --cone
          git -C /tmp/wpt-tools-src sparse-checkout set tests/wpt/tests/tools
          git -C /tmp/wpt-tools-src fetch --depth 1 --filter=blob:none origin "v${SERVO_TAG}"
          git -C /tmp/wpt-tools-src checkout FETCH_HEAD
          mkdir -p tests/wpt
          cp -r /tmp/wpt-tools-src/tests/wpt/tests tests/wpt/tests
          rm -rf /tmp/wpt-tools-src

      - name: setup python (gives a consistent `python3` across all 3 OSes)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: setup uv (needed by ./mach, see README.md)
        uses: astral-sh/setup-uv@v5

      # rustup ships preinstalled on all 3 GitHub-hosted runner images and auto-detects the
      # pinned toolchain from this repo's own rust-toolchain.toml the first time cargo/mach
      # runs — this just forces that fetch early, with its own clear log output.
      - name: prefetch pinned rust toolchain
        shell: bash
        run: rustup show

      # Windows only: install the real GStreamer runtime+devel MSIs ourselves, directly via
      # msiexec, to the exact path `./mach bootstrap`'s own installer would use (see
      # python/servo/platform/windows.py's DEPENDENCIES_DIR — target/dependencies under this
      # checkout). We bypass that installer's own `Start-Process -verb runAs` UAC elevation
      # request, which hangs indefinitely on a non-interactive GH runner with no one to click
      # through it (see test.yml's own comment for this exact, already-documented finding —
      # that workflow sidesteps it entirely by building with `--media-stack dummy`; this one
      # doesn't, so it has to solve the install differently). `--skip-platform` below then
      # skips mach's own (would-be-hanging) attempt to install it again;
      # `is_gstreamer_installed()` still finds GStreamer at this path independently of that
      # skip, since that check runs as part of the build step itself, not `_platform_bootstrap`.
      - name: install GStreamer (Windows, non-interactive)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $depsUrl = "https://github.com/servo/servo-build-deps/releases/download/msvc-deps"
          $targetDir = Join-Path (Get-Location) "target\dependencies"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          foreach ($name in @("gstreamer-1.0-msvc-x86_64-1.22.8.msi", "gstreamer-1.0-devel-msvc-x86_64-1.22.8.msi")) {
            $msi = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -Uri "$depsUrl/$name" -OutFile $msi
            $proc = Start-Process msiexec.exe -ArgumentList @("/a", $msi, "TARGETDIR=$targetDir", "/qn") -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "msiexec failed for $name with exit code $($proc.ExitCode)" }
          }

      # Linux only: apt-daily-upgrade.service/apt-daily.service/unattended-upgrades (all
      # background, unrelated to anything we ask for) can hold the dpkg lock for a while
      # right after a fresh runner boots -- an apt-get issued into that window (mach
      # bootstrap's own internal ones included) just sits there waiting for the lock instead
      # of failing, silently consuming the whole job. Confirmed by multiple real, reproduced
      # hangs in test.yml (same pattern, mirrored workflow) -- see that file's own comment on
      # this for the full story.
      - name: stop background apt processes and wait for the dpkg lock (Linux only)
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrade 2>/dev/null || true

          for i in $(seq 1 60); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
              echo "dpkg/apt lock free after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::dpkg/apt lock still held after 60s -- proceeding anyway, holders:"
          sudo fuser -v /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock 2>&1 || true

      # Windows: --skip-platform (see the GStreamer step above for why). Linux/macOS: no
      # --skip-platform — their own bootstrap paths install GStreamer non-interactively
      # already (apt packages on Linux, `sudo installer` on macOS, both already covered by
      # `--yes` here), so nothing extra is needed there for the real media stack to work.
      - name: mach bootstrap (installs build dependencies)
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        # Backstop beyond the apt-timer fix above -- see test.yml's own comment on this same
        # step for the real, reproduced hang this guards against. mach bootstrap itself is
        # normally done in well under a minute.
        timeout-minutes: 15
        run: |
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            ./mach bootstrap --force --yes --skip-lints --skip-nextest --skip-platform
          else
            ./mach bootstrap --force --yes --skip-lints --skip-nextest
          fi

      # Real release build: optimized (--release), real GStreamer media stack (no
      # --media-stack dummy — see the GStreamer step above). `matrix.build_features` is empty
      # for the plain variant (matching README.md's own default build instructions verbatim)
      # or `--features steam` for the Steam-enabled one — same build otherwise.
      - name: mach build (release)
        shell: bash
        run: ./mach build --release ${{ matrix.build_features }}

      # No --content-dir: this release ships the engine shell only, no bundled game content
      # (see this workflow's own top comment and the release notes in create-release above).
      # Portable output only (no --deb/--msi/--dmg) -- --package-name/--package-version only
      # affect those installer formats (see post_build_commands.py), so they're dropped too.
      - name: assemble bundle
        shell: bash
        run: ./mach bundle --release --output release --diagnostic-script

      # Same launch-and-check smoke test as test.yml (see that file for the full reasoning:
      # a plain build/bundle success once silently shipped a bundle that crashed on every
      # real double-click). ::notice::/::error:: annotations, not just plain echo/Write-Host:
      # they're readable from the public Checks API without a token — the only way to see
      # this output at all without repo-admin auth on hand.
      - name: smoke test — launch the bundle and check it doesn't crash (Linux/macOS)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          if [ "${{ matrix.os_name }}" = "linux" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
            RUNNER=(xvfb-run -a --server-args="-screen 0 1280x720x24")
            BIN="release/play"
          else
            RUNNER=()
            BIN="release/play.app/Contents/MacOS/play"
          fi

          if [ ! -e "$BIN" ]; then
            echo "::error::expected binary not found at $BIN — contents of release/:"
            find release -maxdepth 3
            exit 1
          fi
          chmod +x "$BIN" || true

          set +e
          "${RUNNER[@]}" "$BIN" > smoke-stdout.log 2> smoke-stderr.log &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            STILL_RUNNING=true
            kill "$PID"
            wait "$PID" 2>/dev/null
          else
            STILL_RUNNING=false
            wait "$PID"
            EXIT_CODE=$?
          fi

          echo "still running after 10s: $STILL_RUNNING"
          [ "$STILL_RUNNING" = false ] && echo "exit code: $EXIT_CODE"
          echo "--- stdout ---"; cat smoke-stdout.log
          echo "--- stderr ---"; cat smoke-stderr.log

          CACHE_ROOT="$HOME/.cache"
          [ "${{ matrix.os_name }}" = "macos" ] && CACHE_ROOT="$HOME/Library/Caches"
          LOG=$(find "$CACHE_ROOT" -iname roves.log 2>/dev/null -exec ls -t {} + 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            echo "--- roves.log ($LOG) ---"; cat "$LOG"
          else
            echo "no roves.log found under $CACHE_ROOT"
          fi

          [ -n "${MOUNT_DIR:-}" ] && hdiutil detach "$MOUNT_DIR" 2>/dev/null

          if [ "$STILL_RUNNING" = false ]; then
            gh_notice() {
              local msg="$1"
              msg="${msg//%/%25}"; msg="${msg//$'\r'/%0D}"; msg="${msg//$'\n'/%0A}"
              echo "::notice::${msg}"
            }
            gh_notice "exit code: $EXIT_CODE"
            gh_notice "stdout: $(cat smoke-stdout.log)"
            gh_notice "stderr: $(cat smoke-stderr.log)"
            gh_notice "roves.log: $([ -n "$LOG" ] && cat "$LOG" || echo '(none found)')"
            echo "::error::bundle exited on its own within 10s — treating as a launch failure"
            exit 1
          fi

      - name: smoke test — launch the bundle and check it doesn't crash (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter play.exe -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Error "no play.exe found under release/"; exit 1 }

          $stdout = Join-Path $env:RUNNER_TEMP "smoke-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "smoke-stderr.log"
          $proc = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 10
          $stillRunning = -not $proc.HasExited
          if ($stillRunning) { Stop-Process -Id $proc.Id -Force }

          Write-Host "still running after 10s: $stillRunning"
          if (-not $stillRunning) { Write-Host "exit code: $($proc.ExitCode)" }
          Write-Host "--- stdout ---"; Get-Content $stdout -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content $stderr -ErrorAction SilentlyContinue

          $log = Get-ChildItem -Path "$env:LOCALAPPDATA" -Filter roves.log -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($log) {
            Write-Host "--- roves.log ($($log.FullName)) ---"
            Get-Content $log.FullName
          } else {
            Write-Host "no roves.log found under $env:LOCALAPPDATA"
          }

          if (-not $stillRunning) {
            # Also emitted as ::notice:: annotations, not just plain Write-Host: annotations
            # are readable from the public Checks API without a token (unlike step logs,
            # which need repo-admin auth to download) — same reasoning, and same gap this
            # closes, as the Linux/macOS smoke-test step's own gh_notice() a few steps up.
            function gh_notice($msg) {
              $escaped = $msg -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::notice::$escaped"
            }
            gh_notice "exit code: $($proc.ExitCode)"
            gh_notice "stdout: $(Get-Content $stdout -ErrorAction SilentlyContinue | Out-String)"
            gh_notice "stderr: $(Get-Content $stderr -ErrorAction SilentlyContinue | Out-String)"
            $logText = if ($log) { Get-Content $log.FullName -Raw } else { '(none found)' }
            gh_notice "roves.log: $logText"
            Write-Host "::error::bundle exited on its own within 10s — treating as a launch failure"
            exit 1
          }

      # Renamed to a named subfolder before zipping, rather than zipping release/'s contents
      # directly at the archive root — same reasoning as test.yml.
      - name: zip bundle (Linux/macOS)
        if: matrix.os_name != 'windows'
        run: |
          ZIP="roves_shell_${{ matrix.os_name }}${{ matrix.asset_suffix }}.zip"
          mv release "$PACKAGE_NAME"
          zip -r "$ZIP" "$PACKAGE_NAME"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # Retries: the smoke test above just force-killed play.exe (a GUI process with dozens
      # of loaded DLLs); Windows can take a moment to actually release its file handles on
      # release/ afterward, so the very next Rename-Item can hit "the process cannot access
      # the file because it is being used by another process" -- confirmed by a real test.yml
      # run (same pattern, mirrored workflow) failing here right after a smoke test that
      # otherwise passed cleanly.
      - name: zip bundle (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $zip = "roves_shell_windows${{ matrix.asset_suffix }}.zip"
          $maxAttempts = 5
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Rename-Item -Path release -NewName $env:PACKAGE_NAME -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq $maxAttempts) { throw }
              Write-Host "Rename-Item attempt $attempt failed ($($_.Exception.Message)), retrying in $($attempt * 2)s..."
              Start-Sleep -Seconds ($attempt * 2)
            }
          }
          Compress-Archive -Path $env:PACKAGE_NAME -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      # Retries: every matrix job (6 now, plain+steam per platform) uploads to the same
      # release concurrently, and `gh release upload --clobber` (delete-then-reupload)
      # occasionally hits a transient conflict from another job's own delete/upload landing
      # at the same moment -- confirmed by real roves-ui CI runs (same pattern, mirrored
      # workflow) failing here on unrelated, upload-unrelated commits, always on a subset of
      # jobs, never all of them, and never at the build step itself.
      - name: upload to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            gh release upload "${{ github.ref_name }}" "$ZIP" --clobber && exit 0
            echo "upload attempt $attempt failed, retrying in $((attempt * 10))s..." >&2
            sleep $((attempt * 10))
          done
          exit 1
