name: CEF -> wgpu-weld -> wgpu + SDL3 macOS feasibility gate

# Developer experiment only (support/cef-macos-gate/README.md). Builds and bundles the macOS
# gate (same pins as the Windows player: vendored welding e991684 wgpu-29 row, CEF 154.0.34,
# wgpu 29.0.4, SDL3 0.20) on Apple silicon and runs it once with Chromium's sandbox on.
# Hard gates: compile, .app structure, Metal adapter, CEF/SDL init, sandboxed renderer
# (--seatbelt-client), clean shutdown. The accelerated IOSurface import is gated only when
# CEF delivers a frame (exit 0); a runner where Chromium disables GPU compositing yields
# exit 2, reported as a notice. The same .app then packages the UNMODIFIED production web
# build of DRincs-Productions/visual-novel-template (pinned, as the Windows package) under
# Contents/Resources/game and runs it once from the shared loopback server: accepted
# load-end, first frame after it, test close through SDL's quit event, OnBeforeClose,
# CEF shutdown, server stop (README "Packaged game"), first with --roves-isolated-profile,
# then twice with the persistent per-install profile (same origin across launches) and under
# contention (README "Saves and the player profile"). The .app carries the repository
# icon.png as its .icns (README "Application icon"); packaged runs require the startup screen
# released by the first game frame (README "Startup screen"). A second .app built with the
# `steam` feature (README "Steam") ships libsteam_api.dylib in Contents/MacOS only for the
# main executable and, with no Steam client on the runner, must log `steam unavailable` and
# play like the standard one. Separate from cef-netrender-probe.yml (Windows, unchanged).
# Also called by release.yml (workflow_call) on a v*.*.* tag: the same build and checks, and
# its two zipped .app artifacts become the macOS release assets.

on:
  push:
    # Branches only: a tag push runs this workflow through release.yml, not a second time here
    # (path filters are not evaluated for tag pushes).
    branches: ['**', '!release-check/**']
    paths:
      - 'support/cef-macos-gate/**'
      # Vendored welding (temporary fork, ROVES_PATCHES.md).
      - 'support/vendor/wgpu-weld/**'
      # Compiled into the gate through `#[path]` (packaged-game mode).
      - 'support/cef-window-probe/src/server.rs'
      - 'support/cef-window-probe/src/host_api.rs'
      # The Windows player's pure rules (origin, load status, profile name/files), `#[path]`.
      - 'support/cef-netrender-probe/src/game_rules.rs'
      # The players' shared page input, page-marker registration (+ its marker script) and
      # window icon (`#[path]`), and the embedded Roves logo.
      - 'support/cef-netrender-probe/src/input.rs'
      - 'support/cef-netrender-probe/src/page_init.rs'
      - 'support/cef-netrender-probe/src/mcp_rules.rs'
      - 'support/cef-netrender-probe/src/icon_rules.rs'
      - 'support/cef-netrender-probe/src/window_icon.rs'
      - 'icon.png'
      # Startup screen branding (`#[path]` splash.rs, build.rs wordmark and its font) and the
      # `steam` feature's Steamworks client (README "Startup screen", "Steam").
      - 'support/cef-netrender-probe/src/splash.rs'
      - 'support/cef-netrender-probe/build_wordmark.rs'
      - 'resources/fonts/MetalMania-Regular.ttf'
      - 'support/cef-netrender-probe/src/steam.rs'
      - '.github/workflows/cef-macos-gate.yml'
  workflow_dispatch:
  # release.yml (no inputs: a release runs exactly the checks of a push).
  workflow_call:

concurrency:
  group: cef-macos-gate-${{ github.ref }}
  # A cancelled run is not a verified one (AGENTS.md CI rules): queue instead of cancelling.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      # The repository root rust-toolchain.toml pins the engine toolchain; welding needs
      # 1.97.1+ and wgpu-weld e991684 uses 1.99.1, as the Windows player does.
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            support/cef-macos-gate
            support/vendor/wgpu-weld
            support/cef-window-probe/src
            support/cef-netrender-probe/src
            resources/fonts
          sparse-checkout-cone-mode: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: toolchain and host
        shell: bash
        run: |
          case "$(rustc --version)" in
            "rustc 1.99.1 "*) ;;
            *) echo "::error::expected rustc 1.99.1, got $(rustc --version)"; exit 1 ;;
          esac
          # cef-dll-sys builds libcef_dll_wrapper with CMake's Ninja generator.
          command -v ninja >/dev/null || brew install ninja
          echo "::notice::$(rustc --version) / $(sw_vers -productVersion) $(uname -m) / cmake $(cmake --version | head -1) / ninja $(ninja --version)"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gate-target" >> "$GITHUB_ENV"
          # CEF 154 distribution; also read at run time by the bundle binary.
          echo "CEF_PATH=$RUNNER_TEMP/cef154" >> "$GITHUB_ENV"
      - name: restore cargo and CEF cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/cef154
          key: cef-macos-gate-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('support/cef-macos-gate/Cargo.lock') }}
      - name: dependency graph evidence
        shell: bash
        working-directory: support/cef-macos-gate
        run: |
          tree() { cargo tree --locked --target aarch64-apple-darwin -e normal --prefix depth --depth 1 "$@"; }
          users29="$(tree -i wgpu@29.0.4 | grep '^1' | cut -d' ' -f1 | sed 's/^1//' | sort | tr '\n' ' ')"
          echo "::notice::wgpu 29.0.4 used by: $users29"
          for crate in grafting roves_cef_macos_gate welding; do
            echo " $users29" | grep -q " $crate " || { echo "::error::$crate is not on wgpu 29.0.4"; exit 1; }
          done
          # wgpu 30 may appear only under cef (accelerated_osr importer, never called).
          users30="$(tree -i wgpu@30.0.2 | grep '^1' | cut -d' ' -f1 | sed 's/^1//' | sort | tr '\n' ' ')"
          echo "::notice::wgpu 30.0.2 used by: $users30"
          test "$users30" = "cef " || { echo "::error::wgpu 30 reached by something other than cef"; exit 1; }
      - name: build (release)
        shell: bash
        working-directory: support/cef-macos-gate
        run: |
          cargo build --locked --release --bins 2>&1 | tee "$RUNNER_TEMP/gate-build.log"
          test "${PIPESTATUS[0]}" = 0
      - name: save cargo and CEF cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/cef154
          key: cef-macos-gate-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('support/cef-macos-gate/Cargo.lock') }}
      - name: bundle and check the .app
        id: bundle
        shell: bash
        run: |
          # README "Application icon": the repository icon.png as the .icns that cef's bundler
          # copies from <resources>/mac into Contents/Resources (CFBundleIconFile).
          res="$RUNNER_TEMP/gate-resources"
          bash support/cef-macos-gate/packaging/icns.sh icon.png "$res/mac/roves-cef-macos-gate.icns"
          echo "GATE_RESOURCES=$res" >> "$GITHUB_ENV"
          "$CARGO_TARGET_DIR/release/bundle" "$RUNNER_TEMP/gate-app" --resources "$res"
          app="$RUNNER_TEMP/gate-app/roves-cef-macos-gate.app"
          fw="$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          test -x "$app/Contents/MacOS/roves-cef-macos-gate"
          test -f "$app/Contents/Resources/roves-cef-macos-gate.icns" \
            || { echo "::error::Contents/Resources/roves-cef-macos-gate.icns missing"; exit 1; }
          icon_file="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist" 2>/dev/null || true)"
          test "$icon_file" = roves-cef-macos-gate.icns \
            || { echo "::error::Info.plist CFBundleIconFile is '$icon_file' (expected roves-cef-macos-gate.icns)"; exit 1; }
          echo "::notice::bundle icon: CFBundleIconFile=$icon_file ($(wc -c < "$app/Contents/Resources/roves-cef-macos-gate.icns" | tr -d ' ') bytes)"
          # The standard package is Steam-free (README "Steam").
          test ! -e "$app/Contents/MacOS/libsteam_api.dylib" || { echo "::error::standard .app contains libsteam_api.dylib"; exit 1; }
          if otool -L "$app/Contents/MacOS/roves-cef-macos-gate" | grep -q libsteam_api; then
            echo "::error::standard executable links libsteam_api"; exit 1
          fi
          test -f "$fw/Chromium Embedded Framework"
          # Loaded by welding in every helper before CEF (CefSandboxMode::Sandboxed).
          test -f "$fw/Libraries/libcef_sandbox.dylib"
          for helper in "" " (GPU)" " (Renderer)" " (Plugin)" " (Alerts)"; do
            name="roves-cef-macos-gate Helper$helper"
            test -x "$app/Contents/Frameworks/$name.app/Contents/MacOS/$name" \
              || { echo "::error::missing helper $name"; exit 1; }
          done
          file "$app/Contents/MacOS/roves-cef-macos-gate"
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: run the gate (sandboxed, Metal)
        shell: bash
        run: |
          set +e
          # Hard stop above the gate's own 60 s timeout plus close (macOS has no GNU timeout).
          ROVES_GATE_TIMEOUT_SECS=60 perl -e 'alarm shift; exec @ARGV' 150 \
            "$APP/Contents/MacOS/roves-cef-macos-gate" > "$RUNNER_TEMP/gate-run.log" 2>&1
          code=$?
          set -e
          grep '^gate:' "$RUNNER_TEMP/gate-run.log" || true
          need() { grep -q "$1" "$RUNNER_TEMP/gate-run.log" || { echo "::error::missing: $1"; exit 1; }; }
          if grep -q '^gate: FAIL' "$RUNNER_TEMP/gate-run.log"; then
            echo "::error::gate reported FAIL (exit $code)"; exit 1
          fi
          need '^gate: mode=fixture'
          # The startup screen is a packaged-game feature only (README "Startup screen").
          if grep -q -E '^gate: (startup |wordmark )' "$RUNNER_TEMP/gate-run.log"; then
            echo "::error::fixture gate built a startup screen"; exit 1
          fi
          need '^gate: cef initialized sandbox=Sandboxed'
          need '^gate: adapter .*backend=Metal'
          need '^gate: producer created mode=AcceleratedPaint'
          need '^gate: PASS sandbox renderers='
          need '^gate: browser closed elapsed_ms='
          need '^gate: cef shutdown complete'
          need "^gate: shutdown complete exit=$code"
          case "$code" in
            0)
              need '^gate: PASS pixel centre'
              echo "::notice::accelerated IOSurface -> Metal import verified on this runner (exit 0)" ;;
            2)
              need '^gate: NO_ACCELERATED_FRAME'
              echo "::notice::no OnAcceleratedPaint frame on this runner (exit 2): compile, bundle, sandbox and shutdown verified; the import path needs a real Mac" ;;
            *)
              echo "::error::unexpected exit $code"; exit 1 ;;
          esac
          echo "FIXTURE_CODE=$code" >> "$GITHUB_ENV"
          # No helper of this bundle may outlive the browser process.
          sleep 2
          if pgrep -fl "roves-cef-macos-gate" ; then
            echo "::error::gate processes still running after exit"; exit 1
          fi
      # ── Packaged game (README "Packaged game") ──────────────────────────────────────
      # Same pinned commit and build commands as the Windows package in
      # cef-netrender-probe.yml; dist/ is copied byte for byte into the same .app.
      - name: checkout visual-novel-template (pinned)
        id: template
        if: (success() || failure()) && steps.bundle.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: DRincs-Productions/visual-novel-template
          ref: 92e5115ac52de37202b2ebd657053da8322450e3
          path: visual-novel-template
          persist-credentials: false
      - name: setup node (template build)
        if: (success() || failure()) && steps.template.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build visual-novel-template (npm ci + npm run build)
        id: template_build
        if: (success() || failure()) && steps.template.outcome == 'success'
        shell: bash
        working-directory: visual-novel-template
        run: |
          pin=92e5115ac52de37202b2ebd657053da8322450e3
          head="$(git rev-parse HEAD)"
          test "$head" = "$pin" || { echo "::error::template HEAD $head is not the pin $pin"; exit 1; }
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/vnt-npm-ci.log"
          test "${PIPESTATUS[0]}" = 0
          npm run build 2>&1 | tee "$RUNNER_TEMP/vnt-build.log"
          test "${PIPESTATUS[0]}" = 0
          test -f dist/index.html || { echo "::error::template build produced no dist/index.html"; exit 1; }
          {
            echo "template_commit=$head"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "package_lock_sha256=$(shasum -a 256 package-lock.json | cut -d' ' -f1)"
            echo "dist_files=$(find dist -type f | wc -l | tr -d ' ')"
          } | tee "$RUNNER_TEMP/vnt-build-info.txt"
          echo "::notice::visual-novel-template $head built with node $(node --version): $(find dist -type f | wc -l | tr -d ' ') dist files"
      - name: package the game into the .app
        id: package
        if: (success() || failure()) && steps.template_build.outcome == 'success'
        shell: bash
        run: |
          game="$APP/Contents/Resources/game"
          test ! -e "$game" || { echo "::error::$game already exists"; exit 1; }
          mkdir -p "$APP/Contents/Resources"
          ditto visual-novel-template/dist "$game"
          # Unmodified: identical file list and bytes.
          diff -r visual-novel-template/dist "$game" || { echo "::error::packaged game differs from dist"; exit 1; }
          (cd "$game" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256) > "$RUNNER_TEMP/player-game-sha256.txt"
          echo "::notice::packaged $(wc -l < "$RUNNER_TEMP/player-game-sha256.txt" | tr -d ' ') game files into Contents/Resources/game"
      - name: run the packaged game (sandboxed, Metal, loopback)
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: bash
        run: |
          log="$RUNNER_TEMP/player-run.log"
          set +e
          # Test-only: close through SDL's quit event 8 s after the first game frame and
          # write the last frame as a BMP for the artifact.
          ROVES_GATE_TIMEOUT_SECS=60 ROVES_GATE_AUTO_CLOSE_MS=8000 \
            ROVES_GATE_FRAME_DUMP="$RUNNER_TEMP/player-last-frame.bmp" \
            perl -e 'alarm shift; exec @ARGV' 150 \
            "$APP/Contents/MacOS/roves-cef-macos-gate" --roves-isolated-profile > "$log" 2>&1
          code=$?
          set -e
          grep '^gate:' "$log" | grep -v '^gate: console ' || true
          failed=0
          if grep -q '^gate: FAIL' "$log"; then echo "::error::player reported FAIL (exit $code)"; failed=1; fi
          origin="$(grep -m1 '^gate: mode=packaged-game dir=.*/Contents/Resources/game origin=' "$log" | grep -o -E 'http://127\.0\.0\.1:[0-9]+$' || true)"
          test -n "$origin" || { echo "::error::missing: packaged-game mode line with the loopback origin"; exit 1; }
          o="${origin//./\\.}"
          if [ "$code" = 2 ] && [ "${FIXTURE_CODE:-}" = 2 ]; then
            # Same runner without accelerated frames: load and close only.
            expected=('^gate: player profile=isolated cache=' "^gate: load-end status=200 url=$o/ ok=true$"
              '^gate: NO_ACCELERATED_FRAME' '^gate: browser closed elapsed_ms=' '^gate: cef shutdown complete$'
              '^gate: loopback stopped$' '^gate: cache removed$' '^gate: shutdown complete exit=2$' '^gate: exit code=2$')
            echo "::notice::no accelerated frame on this runner (fixture and player exit 2): load and close verified, first frame not"
          else
            test "$code" = 0 || { echo "::error::player exit $code (expected 0)"; failed=1; }
            expected=('^gate: player profile=isolated cache=' '^gate: cef initialized sandbox=Sandboxed'
              '^gate: adapter .*backend=Metal' '^gate: game profile ready dir=.*/game-profile elapsed_ms='
              '^gate: producer created mode=AcceleratedPaint size=[0-9]+x[0-9]+ url=about:blank$'
              '^gate: page markers registered identifier=.+ mcp=false$' "^gate: game navigation url=$o/$"
              "^gate: load-end status=200 url=$o/ ok=true$" '^gate: game loaded elapsed_ms='
              '^gate: fresh frame requested ok=true$' '^gate: startup screen released$'
              '^gate: first game frame after load-end ms=[0-9]+ size=[0-9]+x[0-9]+ format=Bgra8Unorm '
              '^gate: test auto-close scheduled delay_ms=8000$' '^gate: test auto-close pushed SDL quit$'
              '^gate: loop end .* loaded=true game_frame=true close=quit ' '^gate: close requested source=quit$'
              '^gate: last game frame size=' '^gate: frame dump written ' '^gate: PASS sandbox renderers='
              '^gate: PASS packaged game loaded' '^gate: browser closed elapsed_ms='
              '^gate: cef shutdown complete$' '^gate: loopback stopped$' '^gate: cache removed$'
              '^gate: shutdown complete exit=0$' '^gate: exit code=0$')
          fi
          # In order: each pattern must match a line after the previous match.
          last=0
          for pattern in "${expected[@]}"; do
            at="$(tail -n "+$((last + 1))" "$log" | grep -n -m1 -E -- "$pattern" | cut -d: -f1 || true)"
            if [ -z "$at" ]; then echo "::error::missing or out of order: $pattern"; failed=1; else last=$((last + at)); fi
          done
          # Startup screen branding (README "Startup screen"), built before the first present.
          for pattern in '^gate: startup logo decoded size=[0-9]+x[0-9]+$' '^gate: wordmark rendered size=[0-9]+x[0-9]+ font=MetalMania$'; do
            grep -q -E -- "$pattern" "$log" || { echo "::error::missing: $pattern"; failed=1; }
          done
          # The standard package has no Steam code: no Steam line at all.
          if grep -q '^gate: steam ' "$log"; then echo "::error::standard package logged $(grep -m1 '^gate: steam ' "$log")"; failed=1; fi
          # No remote-debugging/DevTools endpoint: the player must not rely on one.
          if grep -q 'DevTools listening' "$log"; then echo "::error::a DevTools endpoint was opened"; failed=1; fi
          if grep -q -E '^gate: player (profile root=|origin-port stored|profile kept)' "$log"; then
            echo "::error::the isolated launch touched a persistent profile"; failed=1
          fi
          # The Steam variant's run (below) must end the same way.
          echo "PLAYER_CODE=$code" >> "$GITHUB_ENV"
          cache="$(sed -n 's|^gate: cef initialized sandbox=Sandboxed cache=||p' "$log" | head -1)"
          if [ -n "$cache" ] && [ -e "$cache" ]; then echo "::error::CEF cache left behind: $cache"; failed=1; fi
          if nc -z 127.0.0.1 "${origin##*:}" 2>/dev/null; then echo "::error::loopback port still accepting after exit"; failed=1; fi
          grep -E '^gate: (title|load-end|first game frame|last game frame|console lines|browser closed|popup refused)' "$log" \
            | while read -r line; do echo "::notice::$line"; done || true
          sleep 2
          if pgrep -fl "roves-cef-macos-gate" ; then echo "::error::player processes still running after exit"; failed=1; fi
          test "$failed" = 0
      # Ordinary launch (no --roves-isolated-profile), README "Saves and the player profile":
      # the persistent profile under ~/Library/Application Support/Roves/Player/<name> and its
      # stored origin port. Two sequential launches from an unrelated working directory must
      # use the same profile and loopback origin (origin-keyed storage, so saves, survive) and
      # keep the profile with its CEF directories; a lock held by another process and the
      # stored port taken by another program must each end the run with exit 6 before CEF
      # starts; a damaged port file must give exit 1 instead of a new origin. Mirrors the
      # Windows package step. Saves written by a real game across launches stay a manual check.
      - name: run the packaged game twice with the persistent profile, then under contention
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: bash
        run: |
          out="$RUNNER_TEMP/player-profile"
          base="$HOME/Library/Application Support/Roves/Player"
          test ! -e "$out" || { echo "::error::$out already exists"; exit 1; }
          mkdir -p "$out/unrelated-working-directory"
          if [ -e "$base" ]; then echo "::error::$base exists before the first launch"; exit 1; fi
          if pgrep -fl "roves-cef-macos-gate"; then echo "::error::gate processes left by a previous step"; exit 1; fi
          failed=0
          allowed=" 0 "; if [ "${FIXTURE_CODE:-}" = 2 ]; then allowed=" 0 2 "; fi
          # run_player <name> <hard stop s>: sets $code; log in $out/<name>.log.
          run_player() {
            set +e
            (cd "$out/unrelated-working-directory" && ROVES_GATE_TIMEOUT_SECS=60 ROVES_GATE_AUTO_CLOSE_MS=3000 \
              perl -e 'alarm shift; exec @ARGV' "$2" "$APP/Contents/MacOS/roves-cef-macos-gate" > "$out/$1.log" 2>&1)
            code=$?
            set -e
            grep '^gate:' "$out/$1.log" | grep -v '^gate: console ' | sed "s/^/  [$1] /" || true
          }
          ordered() { # ordered <log> <label> <pattern>...: each after the previous match
            local log="$1" label="$2" last=0 at; shift 2
            for pattern in "$@"; do
              at="$(tail -n "+$((last + 1))" "$log" | grep -n -m1 -E -- "$pattern" | cut -d: -f1 || true)"
              if [ -z "$at" ]; then echo "::error::$label: missing or out of order: $pattern"; failed=1; else last=$((last + at)); fi
            done
          }
          absent() { # absent <log> <label> <pattern>...
            local log="$1" label="$2"; shift 2
            for pattern in "$@"; do
              if grep -q -E -- "$pattern" "$log"; then echo "::error::$label: unexpected $(grep -m1 -E -- "$pattern" "$log")"; failed=1; fi
            done
          }
          for name in first second; do
            run_player "$name" 150
            log="$out/$name.log"
            case "$allowed" in *" $code "*) ;; *) echo "::error::$name persistent launch: exit $code (allowed:$allowed)"; failed=1 ;; esac
            ordered "$log" "$name" '^gate: player profile root=.+ lock=acquired origin-port=(new|[0-9]+)$' \
              '^gate: mode=packaged-game dir=.*/Contents/Resources/game origin=http://127\.0\.0\.1:[0-9]+$' \
              '^gate: player profile=persistent cache=.+/cef$' '^gate: cef initialized sandbox=Sandboxed cache=.+/cef$' \
              '^gate: game profile ready dir=.+/cef/game-profile elapsed_ms=' \
              '^gate: load-end status=(200|304) url=http://127\.0\.0\.1:[0-9]+/ ok=true$' \
              '^gate: browser closed elapsed_ms=' '^gate: cef shutdown complete$' '^gate: loopback stopped$' \
              '^gate: player profile kept root=' "^gate: shutdown complete exit=$code$" "^gate: exit code=$code$"
            absent "$log" "$name" '^gate: FAIL' '^gate: cache (not )?removed' 'DevTools listening'
            sleep 2
            if pgrep -fl "roves-cef-macos-gate"; then echo "::error::$name: processes still running after exit"; failed=1; fi
          done
          root="$(sed -n 's|^gate: player profile root=\(.*\) lock=acquired origin-port=new$|\1|p' "$out/first.log" | head -1)"
          o1="$(sed -n 's|^gate: mode=packaged-game dir=.* origin=||p' "$out/first.log" | head -1)"
          o2="$(sed -n 's|^gate: mode=packaged-game dir=.* origin=||p' "$out/second.log" | head -1)"
          port="${o1##*:}"
          echo "::notice::persistent origins: first=$o1 second=$o2 root=$root"
          if ! [[ "$root" =~ ^"$base"/roves-cef-macos-gate-[0-9a-f]{16}$ ]]; then
            echo "::error::first launch did not start a new profile at $base/roves-cef-macos-gate-<16 hex> (root '$root')"; failed=1
          fi
          if [ -z "$o1" ] || [ "$o1" != "$o2" ]; then echo "::error::the loopback origin changed between launches (saves would be lost)"; failed=1; fi
          grep -q -x -F "gate: player origin-port stored port=$port" "$out/first.log" \
            || { echo "::error::first launch did not store its origin port"; failed=1; }
          grep -q -x -F "gate: player profile root=$root lock=acquired origin-port=$port" "$out/second.log" \
            || { echo "::error::second launch did not reuse the stored profile and port"; failed=1; }
          if grep -q '^gate: player origin-port stored' "$out/second.log"; then echo "::error::second launch rewrote the origin port"; failed=1; fi
          if [ -n "$root" ] && [ -d "$root" ]; then
            stored="$(tr -d '[:space:]' < "$root/origin-port" 2>/dev/null || true)"
            test "$stored" = "$port" || { echo "::error::origin-port file holds '$stored', expected $port"; failed=1; }
            for dir in cef cef/game-profile; do
              test -d "$root/$dir" || { echo "::error::profile lacks $dir after exit"; failed=1; }
            done
            ls -A "$root" | while read -r entry; do echo "::notice::profile entry $entry"; done
            ls -A "$root/cef/game-profile" 2>/dev/null | while read -r entry; do echo "::notice::game-profile entry $entry"; done || true
          else
            echo "::error::profile root missing after exit: '$root'"; failed=1
          fi
          # Contention: each case must end before CEF starts.
          refused() { # refused <name> <expected exit> <pattern>...
            local name="$1" expected="$2"; shift 2
            run_player "$name" 60
            echo "::notice::$name: exit=$code"
            test "$code" = "$expected" || { echo "::error::$name: exit $code (expected $expected)"; failed=1; }
            ordered "$out/$name.log" "$name" "$@" "^gate: exit code=$expected$"
            absent "$out/$name.log" "$name" '^gate: cef initialized' '^gate: producer created'
          }
          if [ -n "$root" ] && [ -d "$root" ] && [ -n "$port" ]; then
            # flock(2), the call std's File::try_lock makes on macOS.
            perl -MFcntl=:flock -e '$| = 1; open(my $f, ">>", shift) or die "open: $!"; flock($f, LOCK_EX | LOCK_NB) or die "flock: $!"; print "locked\n"; sleep 60' \
              "$root/player.lock" > "$out/lock-holder.log" 2>&1 &
            holder=$!
            for _ in $(seq 50); do grep -q locked "$out/lock-holder.log" && break; sleep 0.2; done
            if grep -q locked "$out/lock-holder.log"; then
              refused busy-profile 6 '^gate: FAIL player profile busy root='
            else
              echo "::error::could not hold the profile lock: $(cat "$out/lock-holder.log")"; failed=1
            fi
            kill "$holder" 2>/dev/null || true; wait "$holder" 2>/dev/null || true
            perl -MIO::Socket::INET -e '$| = 1; my $socket = IO::Socket::INET->new(LocalAddr => "127.0.0.1", LocalPort => shift, Proto => "tcp", Listen => 1, ReuseAddr => 1) or die "listen: $!"; print "listening\n"; sleep 60' \
              "$port" > "$out/port-holder.log" 2>&1 &
            holder=$!
            for _ in $(seq 50); do grep -q listening "$out/port-holder.log" && break; sleep 0.2; done
            if grep -q listening "$out/port-holder.log"; then
              refused busy-port 6 "^gate: player profile root=.+ lock=acquired origin-port=$port$" "^gate: FAIL game loopback port busy port=$port "
            else
              echo "::error::could not hold port $port: $(cat "$out/port-holder.log")"; failed=1
            fi
            kill "$holder" 2>/dev/null || true; wait "$holder" 2>/dev/null || true
            printf 'not-a-port' > "$root/origin-port"
            refused damaged-port-file 1 '^gate: FAIL player profile root=.+ is damaged'
            printf '%s\n' "$port" > "$root/origin-port"
          else
            echo "::error::contention cases skipped: no profile root/origin"; failed=1
          fi
          sleep 2
          if pgrep -fl "roves-cef-macos-gate"; then echo "::error::gate processes still running"; failed=1; fi
          # Ephemeral runner, but leave no profile behind for later steps.
          rm -rf "$base"
          test "$failed" = 0
      # Player fixture (README "Player fixture"): the packaged template is swapped for
      # support/cef-macos-gate/player-fixture (restored afterwards) and run once with a fresh
      # persistent profile and the test-only input hook ROVES_GATE_TEST_INPUT_MS=1000. Required:
      # the window.__ROVES__ marker registered over welding's in-process DevTools channel
      # before the game document (roves-api isAvailable() true), a host API save written and
      # read back, the project icon.png from Contents/Resources on the window, the document
      # title, and one synthetic click, ArrowRight press and wheel notch pushed into SDL's
      # queue, forwarded through Input -> welding and reported by the page as trusted DOM
      # events (key=ArrowRight code=ArrowRight keyCode=39, no keypress; wheel deltaY < 0).
      # The click starts a WebAudio oscillator: its state is reported only (the runner may
      # have no audio device). Synthetic SDL events, not a physical mouse or keyboard.
      - name: run the player fixture (page marker, saves, input, persistent profile)
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: bash
        run: |
          out="$RUNNER_TEMP/player-fixture"
          base="$HOME/Library/Application Support/Roves/Player"
          game="$APP/Contents/Resources/game"
          icon="$APP/Contents/Resources/icon.png"
          test ! -e "$out" || { echo "::error::$out already exists"; exit 1; }
          test ! -e "$icon" || { echo "::error::$icon already exists"; exit 1; }
          mkdir -p "$out"
          rm -rf "$base"
          mv "$game" "$out/template-game"
          restore() { rm -rf "$game" "$icon"; mv "$out/template-game" "$game"; rm -rf "$base"; }
          trap restore EXIT
          ditto support/cef-macos-gate/player-fixture "$game"
          cp icon.png "$icon"
          log="$out/player-fixture.log"
          set +e
          ROVES_GATE_TIMEOUT_SECS=60 ROVES_GATE_AUTO_CLOSE_MS=6000 ROVES_GATE_TEST_INPUT_MS=1000 \
            perl -e 'alarm shift; exec @ARGV' 150 "$APP/Contents/MacOS/roves-cef-macos-gate" > "$log" 2>&1
          code=$?
          set -e
          grep '^gate:' "$log" || true
          failed=0
          allowed=" 0 "; if [ "${FIXTURE_CODE:-}" = 2 ]; then allowed=" 2 "; fi
          case "$allowed" in *" $code "*) ;; *) echo "::error::player fixture exit $code (allowed:$allowed)"; failed=1 ;; esac
          if grep -q '^gate: FAIL' "$log"; then echo "::error::player fixture reported FAIL"; failed=1; fi
          origin="$(sed -n 's|^gate: mode=packaged-game dir=.* origin=||p' "$log" | head -1)"
          test -n "$origin" || { echo "::error::missing: packaged-game mode line with the loopback origin"; exit 1; }
          o="${origin//./\\.}"
          src="^gate: console level=[0-9]+ source=$o/game\\.js:[0-9]+ message=\""
          ordered() { # ordered <label> <pattern>...: each after the previous match
            local label="$1" last=0 at; shift
            for pattern in "$@"; do
              at="$(tail -n "+$((last + 1))" "$log" | grep -n -m1 -E -- "$pattern" | cut -d: -f1 || true)"
              if [ -z "$at" ]; then echo "::error::$label: missing or out of order: $pattern"; failed=1; else last=$((last + at)); fi
            done
          }
          count() { # count <pattern> <want>
            local got; got="$(grep -c -E -- "$1" "$log" || true)"
            test "$got" = "$2" || { echo "::error::$got lines match $1 (expected $2)"; failed=1; }
          }
          ordered startup '^gate: window icon source=project size=1024x1024 set=true$' \
            '^gate: producer created mode=AcceleratedPaint size=[0-9]+x[0-9]+ url=about:blank$' \
            '^gate: page markers registered identifier=.+ mcp=false$' "^gate: game navigation url=$o/$" \
            "^gate: load-end status=200 url=$o/ ok=true$" '^gate: game loaded elapsed_ms='
          # README "Startup screen": released by the first game frame (none on exit 2).
          if [ "$code" = 0 ]; then
            ordered startup-screen "^gate: load-end status=200 url=$o/ ok=true$" '^gate: startup screen released$' \
              '^gate: first game frame (after load-end|settled) '
          fi
          ordered marker "${src}roves-ci-marker available=true\"$" \
            "${src}roves-ci-save os_type=macos available=true write=true read=hello-roves\"$"
          ordered title '^gate: title "roves ci player fixture"$'
          # The page's console line and the player's marker travel on different CEF IPC paths
          # (OnConsoleMessage vs. the page-marker channel), so each is ordered only after the
          # forwarded event, not against the other.
          up_click='^gate: test click forwarded event=up ok=true$'
          ordered click '^gate: test click requested x=100 y=60 pushed=true$' '^gate: test click forwarded event=down ok=true$' \
            "$up_click" '^gate: test click marker received$' '^gate: test click complete$'
          ordered click-page "$up_click" "${src}roves-test-click-received target=click-target trusted=true button=0 detail=1 "
          ordered key '^gate: test key requested key=Right pushed=true$' \
            '^gate: test key forwarded event=down ok=true raw=0x0000 usage=0x4F windows_key_code=0x27 native_key_code=0x007C$' \
            '^gate: test key forwarded event=up ok=true ' \
            '^gate: test key marker received kind=Down$' '^gate: test key marker received kind=Up$' '^gate: test key complete$'
          ordered key-page '^gate: test key forwarded event=down ok=true ' \
            "${src}roves-test-key-received type=keydown key=ArrowRight code=ArrowRight keyCode=39 repeat=false trusted=true " \
            "${src}roves-test-key-received type=keyup key=ArrowRight code=ArrowRight keyCode=39 repeat=false trusted=true "
          ordered wheel '^gate: test wheel requested pushed=true$' '^gate: test wheel forwarded ok=true delta=Some\(\(0, 120\)\)$' \
            '^gate: test wheel complete$'
          ordered wheel-page '^gate: test wheel forwarded ok=true ' \
            "${src}roves-test-wheel-received type=wheel deltaX=0 deltaY=-[0-9.e+-]+ deltaZ=0 deltaMode=[012] trusted=true "
          ordered end '^gate: game input forwarded=[1-9][0-9]* rejected=0 ' '^gate: PASS test input click, key and wheel delivered$' \
            '^gate: browser closed elapsed_ms=' '^gate: cef shutdown complete$' "^gate: exit code=$code$"
          count 'roves-test-key-received type=keypress' 0
          count 'roves-test-click-received' 1
          count 'roves-test-wheel-received' 1
          if grep -q 'DevTools listening' "$log"; then echo "::error::a DevTools endpoint was opened"; failed=1; fi
          grep -E 'roves-ci-audio' "$log" | while read -r line; do echo "::notice::audio (reported only): $line"; done || true
          grep -q 'roves-ci-audio' "$log" || echo "::notice::audio: no AudioContext report in the log"
          sleep 2
          if pgrep -fl "roves-cef-macos-gate"; then echo "::error::player fixture processes still running after exit"; failed=1; fi
          test "$failed" = 0
      # `steam` feature (README "Steam"): the same crate rebuilt with --features steam in the
      # same target directory (only the gate crate recompiles; the standard .app above is
      # already assembled and stays Steam-free) and bundled into its own .app with the same
      # icon and the same packaged template. bundle copies steamworks-sys's libsteam_api.dylib
      # into Contents/MacOS, where its install name @loader_path/libsteam_api.dylib resolves
      # from the main executable; the five CEF helpers are separate executables and must not
      # link it.
      - name: build and bundle the Steam variant (release, --features steam)
        id: steam_bundle
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: bash
        run: |
          (cd support/cef-macos-gate && cargo build --locked --release --bins --features steam) 2>&1 \
            | tee "$RUNNER_TEMP/gate-steam-build.log"
          test "${PIPESTATUS[0]}" = 0
          "$CARGO_TARGET_DIR/release/bundle" "$RUNNER_TEMP/gate-app-steam" --resources "$GATE_RESOURCES" \
            2>&1 | tee -a "$RUNNER_TEMP/gate-steam-build.log"
          test "${PIPESTATUS[0]}" = 0
          app="$RUNNER_TEMP/gate-app-steam/roves-cef-macos-gate.app"
          main="$app/Contents/MacOS/roves-cef-macos-gate"
          lib="$app/Contents/MacOS/libsteam_api.dylib"
          test -x "$main" || { echo "::error::Steam .app has no main executable"; exit 1; }
          test -f "$lib" || { echo "::error::Steam .app lacks Contents/MacOS/libsteam_api.dylib"; exit 1; }
          test -f "$app/Contents/Resources/roves-cef-macos-gate.icns" || { echo "::error::Steam .app lacks its .icns"; exit 1; }
          otool -L "$main" | grep -q -F '@loader_path/libsteam_api.dylib' \
            || { otool -L "$main"; echo "::error::main executable does not reference @loader_path/libsteam_api.dylib"; exit 1; }
          for helper in "" " (GPU)" " (Renderer)" " (Plugin)" " (Alerts)"; do
            name="roves-cef-macos-gate Helper$helper"
            exe="$app/Contents/Frameworks/$name.app/Contents/MacOS/$name"
            test -x "$exe" || { echo "::error::missing helper $name"; exit 1; }
            if otool -L "$exe" | grep -q libsteam_api; then echo "::error::helper '$name' links libsteam_api"; exit 1; fi
          done
          echo "::notice::Steam .app: $(otool -D "$lib" | tail -1) ($(file -b "$lib")); the five helpers do not link it"
          # The same packaged template as the standard .app.
          ditto "$APP/Contents/Resources/game" "$app/Contents/Resources/game"
          diff -r "$APP/Contents/Resources/game" "$app/Contents/Resources/game" \
            || { echo "::error::Steam .app game differs from the standard .app"; exit 1; }
          echo "STEAM_APP=$app" >> "$GITHUB_ENV"
      # No Steam client on the runner (and no emulator on macOS): the Steam variant must log
      # `steam unavailable reason=...`, still load the game and end exactly like the standard
      # isolated run. Steam missing is never fatal (README "Steam").
      - name: run the Steam variant without Steam (never fatal)
        if: (success() || failure()) && steps.steam_bundle.outcome == 'success'
        shell: bash
        run: |
          log="$RUNNER_TEMP/player-steam-run.log"
          set +e
          ROVES_GATE_TIMEOUT_SECS=60 ROVES_GATE_AUTO_CLOSE_MS=3000 \
            perl -e 'alarm shift; exec @ARGV' 150 \
            "$STEAM_APP/Contents/MacOS/roves-cef-macos-gate" --roves-isolated-profile > "$log" 2>&1
          code=$?
          set -e
          grep '^gate:' "$log" | grep -v '^gate: console ' || true
          failed=0
          expected_code="${PLAYER_CODE:-unknown}"
          test "$code" = "$expected_code" \
            || { echo "::error::Steam variant exit $code, expected the standard isolated run's exit $expected_code"; failed=1; }
          last=0
          for pattern in '^gate: steam unavailable reason=.+$' \
              '^gate: mode=packaged-game dir=.*/Contents/Resources/game origin=http://127\.0\.0\.1:[0-9]+$' \
              '^gate: player profile=isolated cache=' '^gate: cef initialized sandbox=Sandboxed' \
              '^gate: load-end status=200 url=http://127\.0\.0\.1:[0-9]+/ ok=true$' '^gate: browser closed elapsed_ms=' \
              '^gate: cef shutdown complete$' '^gate: loopback stopped$' "^gate: exit code=$code$"; do
            at="$(tail -n "+$((last + 1))" "$log" | grep -n -m1 -E -- "$pattern" | cut -d: -f1 || true)"
            if [ -z "$at" ]; then echo "::error::missing or out of order: $pattern"; failed=1; else last=$((last + at)); fi
          done
          for pattern in '^gate: FAIL' '^gate: steam (initialized|shutdown complete)' 'DevTools listening'; do
            if grep -q -E -- "$pattern" "$log"; then echo "::error::unexpected $(grep -m1 -E -- "$pattern" "$log")"; failed=1; fi
          done
          grep -m1 '^gate: steam unavailable' "$log" | while read -r line; do echo "::notice::$line"; done || true
          sleep 2
          if pgrep -fl "roves-cef-macos-gate"; then echo "::error::Steam variant processes still running after exit"; failed=1; fi
          test "$failed" = 0
      - name: zip the .app
        if: always() && env.APP != ''
        shell: bash
        run: ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/roves-cef-macos-arm64.zip"
      - name: zip the Steam .app
        if: always() && env.STEAM_APP != ''
        shell: bash
        run: ditto -c -k --keepParent "$STEAM_APP" "$RUNNER_TEMP/roves-cef-macos-arm64-steam.zip"
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-macos-gate-logs
          path: |
            ${{ runner.temp }}/gate-build.log
            ${{ runner.temp }}/gate-run.log
            ${{ runner.temp }}/gate-steam-build.log
            ${{ runner.temp }}/player-run.log
            ${{ runner.temp }}/player-steam-run.log
            ${{ runner.temp }}/player-profile/*.log
            ${{ runner.temp }}/player-fixture/*.log
            ${{ runner.temp }}/player-last-frame.bmp
            ${{ runner.temp }}/player-game-sha256.txt
            ${{ runner.temp }}/vnt-build-info.txt
            ${{ runner.temp }}/vnt-npm-ci.log
            ${{ runner.temp }}/vnt-build.log
          if-no-files-found: warn
      # Contains the packaged game when the packaging step ran (opening the .app then plays
      # it; without Contents/Resources/game it runs the fixture gate).
      - name: upload the .app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-macos-player-arm64
          path: ${{ runner.temp }}/roves-cef-macos-arm64.zip
          if-no-files-found: warn
      # The `steam` feature's .app (libsteam_api.dylib in Contents/MacOS, same packaged game).
      - name: upload the Steam .app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-macos-gate-arm64-steam
          path: ${{ runner.temp }}/roves-cef-macos-arm64-steam.zip
          if-no-files-found: warn
