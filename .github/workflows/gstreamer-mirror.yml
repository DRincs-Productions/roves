name: 'GStreamer mirror'

# Copies the GStreamer installers (Windows MSVC, macOS runtime + devel) into this repo's own
# "deps-gstreamer-<version>" release, verified against the published SHA-256. Builds download from
# that copy first: gstreamer.freedesktop.org cuts responses after ~1 MiB and often answers 503.
# Run once per GStreamer version, by pushing a `deps-gstreamer-*` tag or by hand.

on:
  push:
    tags:
      - 'deps-gstreamer-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: deps-gstreamer-1.28.7
    steps:
      - uses: actions/checkout@v4
      - name: download (ranged, retried, checksum-verified)
        run: python3 support/gstreamer_mirror.py mirror
      - name: publish to the deps release
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --prerelease \
            --title "GStreamer 1.28.7 (build dependency copy)" \
            --notes "Unmodified GStreamer 1.28.7 installers from gstreamer.freedesktop.org, verified against the published SHA-256. Used by Roves builds; not a Roves release."
          gh release upload "$RELEASE_TAG" mirror/* --clobber
