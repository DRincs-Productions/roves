name: Blitz + Deno/V8 probe

# Isolated feasibility check only; this does not build or gate the production engine.
'on':
  push:
    paths:
      - 'support/blitz-v8-probe/**'
      - '.github/workflows/blitz-probe.yml'
  workflow_dispatch: {}

concurrency:
  group: blitz-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # deno_core 0.413 without a startup snapshot reads extension JS (deno_web,
    # deno_webgpu, ...) at run time from the absolute crate paths of the build
    # machine. A neutral CARGO_HOME lets the CI-built executable also run on a
    # developer machine that mirrors C:/roves-cargo/registry/src (junction).
    # Production must use a startup snapshot instead (see TODO.md).
    env:
      CARGO_HOME: C:/roves-cargo
    # 65: room for the normal-mode WebGPU fixture (200 s), backend comparison
    # (up to 3 x 200 s) and story harness (600 s) after the primary smoke run,
    # so a hang there cannot cancel the job and hide results.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, jitless]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: support/blitz-v8-probe/js/package-lock.json
      - name: bundle the Motion scenario (include_str! input)
        working-directory: support/blitz-v8-probe/js
        run: |
          npm ci
          npm run build
      - name: restore Cargo and build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/roves-cargo/registry/index
            C:/roves-cargo/registry/cache
            ${{ runner.temp }}/blitz-probe-target
          key: blitz-probe-${{ runner.os }}-rust-1.95.0-${{ hashFiles('support/blitz-v8-probe/Cargo.lock') }}
      - name: check locked dependency graph
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/blitz-probe-target
        # rusty_v8's build script downloads the prebuilt V8 from GitHub releases
        # (no official mirror). Retry only a transient 502/503/504 of that
        # download; any other failure (Rust errors included) exits immediately.
        run: |
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/cargo-check-$attempt.log"
            set +e
            cargo check --locked --manifest-path support/blitz-v8-probe/Cargo.toml 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            [ "$status" -eq 0 ] && exit 0
            if [ "$attempt" -lt 3 ] \
              && grep -q 'Failed to download V8 prebuilt archive' "$log" \
              && grep -qE 'HTTP Error 50[234]' "$log"; then
              echo "::warning::V8 prebuilt download failed with HTTP 502/503/504 (attempt $attempt); retrying"
              sleep $((attempt * 60))
              continue
            fi
            exit "$status"
          done
      - name: run probe
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/blitz-probe-target
          ROVES_PROBE_JITLESS: ${{ matrix.mode == 'jitless' && '1' || '0' }}
          ROVES_PROBE_SCREENSHOT: ${{ runner.temp }}/blitz-probe.png
          ROVES_PROBE_STORAGE_DIR: ${{ runner.temp }}/blitz-storage
          RUST_BACKTRACE: '1'
        run: |
          set -o pipefail
          cargo test --locked --manifest-path support/blitz-v8-probe/Cargo.toml game::tests
          cargo run --locked --manifest-path support/blitz-v8-probe/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/blitz-probe.log"
          grep -q '"jitless":${{ matrix.mode == 'jitless' && 'true' || 'false' }}' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"web_audio_backend_offline","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"web_audio_channel_routing_offline","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"web_audio_stereo_panner_offline","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"web_audio_buffer_source_offline","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"web_audio_v8_context","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"web_audio_tone_15_1_22","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"scroll_viewport_and_elements","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"forms_text_entry_blitz_editor","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"css_finite_animation_monotonic_timeline","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"css_get_animations_stylo_state","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"dedicated_worker_pixi_image_bitmap_probe","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"canvas_2d_pixels_png_export","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"fetch_public_address_policy","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"fetch_resolver_refuses_non_public","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"gpu_frame_pacing_simulated_queue","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
          grep -Fq '"check":"gpu_teardown","status":"passed"' "$RUNNER_TEMP/blitz-probe.log"
      # getAnimations failure evidence (lifecycle log, live objects, Stylo
      # entries) as annotations, readable without the raw log.
      - name: annotate getAnimations evidence
        if: failure()
        shell: bash
        run: grep -F 'ROVES_PROBE_DEBUG' "$RUNNER_TEMP/blitz-probe.log" | cut -c1-4000 | sed 's/^/::notice::/' || true
      # Smoke run on the real game: visual-novel-template's production build (the
      # game roves-action tests with), unmodified, loaded with --game and the
      # default fetch policy (any safe https origin, no allow-list or extra flag).
      # The step fails only if the probe panics or produces no page report; the
      # report itself (script errors, rendered text, blocked fetches) stays
      # informational until the template runs fully.
      - name: checkout visual-novel-template
        uses: actions/checkout@v4
        with:
          repository: DRincs-Productions/visual-novel-template
          path: visual-novel-template
      - name: build visual-novel-template
        working-directory: visual-novel-template
        shell: bash
        run: |
          npm install
          npm run build
      - name: smoke run of the probe on the unmodified game
        shell: bash
        env:
          ROVES_PROBE_JITLESS: ${{ matrix.mode == 'jitless' && '1' || '0' }}
          ROVES_PROBE_STORAGE_DIR: ${{ runner.temp }}/blitz-game-storage
          ROVES_PROBE_SCREENSHOT: ${{ runner.temp }}/blitz-game.png
        run: |
          "$RUNNER_TEMP/blitz-probe-target/debug/roves-blitz-v8-probe.exe" --game visual-novel-template/dist --media-matrix > "$RUNNER_TEMP/blitz-game.log" 2>&1 || echo "probe exited with $?"
          grep -E 'ROVES_PROBE_RESULT|ROVES_PROBE_GAME_MISSING_RESOURCE|ROVES_PROBE_FETCH_BLOCKED|panicked' "$RUNNER_TEMP/blitz-game.log" | cut -c1-3000 || true
          # Mount report (fresh storage directory) and fetches the policy refused as
          # public annotations.
          grep -F '"check":"game_page"' "$RUNNER_TEMP/blitz-game.log" | cut -c1-900 | sed 's/^/::notice::/' || true
          # Route/connectivity summary (document pathname, navigator.onLine, router
          # "Not Found"/offline notice text, start-menu-like buttons), independent
          # of how long the error list in the full report is.
          grep -F '"check":"game_page"' "$RUNNER_TEMP/blitz-game.log" | head -n 1 \
            | grep -oE '"(location|pathname|navigator_online|not_found_text|offline_text|start_menu_like)":("[^"]*"|[a-z]+)|"buttons":\[[^]]*\]' \
            | paste -sd ' ' - | cut -c1-600 | sed 's/^/::notice::game route: /' || true
          grep -F 'ROVES_PROBE_FETCH_BLOCKED' "$RUNNER_TEMP/blitz-game.log" | head -n 5 | cut -c1-500 | sed 's/^/::notice::/' || true
          # Adapter/backend/device type and page submissions, printed before the
          # teardown wait: present even when that wait times out and panics.
          grep -F '"check":"gpu_adapter"' "$RUNNER_TEMP/blitz-game.log" | head -n 1 | cut -c1-600 | sed 's/^/::notice::/' || true
          # Software-adapter frame pacing over the page run (ticks, frames,
          # deferred rAF ticks, max tick gap, saturation, poll errors), and a
          # non-blocking poll error (printed once, then pacing stops); distinct
          # from the teardown wait below.
          grep -F '"check":"game_frame_pacing"' "$RUNNER_TEMP/blitz-game.log" | head -n 1 | cut -c1-600 | sed 's/^/::notice::/' || true
          grep -F '"check":"gpu_backpressure"' "$RUNNER_TEMP/blitz-game.log" | head -n 1 | cut -c1-600 | sed 's/^/::notice::/' || true
          if grep -q 'panicked' "$RUNNER_TEMP/blitz-game.log"; then
            echo "::error::the probe panicked on visual-novel-template"
            exit 1
          fi
          grep -Fq '"check":"game_page","status":"ran"' "$RUNNER_TEMP/blitz-game.log" || {
            echo "::error::the probe produced no game_page report for visual-novel-template"
            exit 1
          }
          grep -Fq '"check":"media_matrix_baseline","status":"passed"' "$RUNNER_TEMP/blitz-game.log" || {
            echo "::error::the deterministic media matrix baseline failed on visual-novel-template"
            exit 1
          }
          # Orderly WebGPU teardown (queue idle + device destroyed) before the
          # runtime drops; its wait time and submit count are public evidence.
          grep -F '"check":"gpu_teardown"' "$RUNNER_TEMP/blitz-game.log" | cut -c1-500 | sed 's/^/::notice::/' || true
          grep -Fq '"check":"gpu_teardown","status":"passed"' "$RUNNER_TEMP/blitz-game.log" || {
            echo "::error::the probe did not tear WebGPU down before exiting"
            exit 1
          }
      # Diagnostic only (run 42696023336: the template on forced/automatic DX12
      # got the runner's Cpu adapter "Microsoft Basic Render Driver", submitted
      # 238 command buffers and timed out at teardown; local GPUs pass). Runs the
      # existing minimal WebGPU + PixiJS fixture (ROVES_PROBE_WEBGPU=1, fixture
      # mode, no --game) on forced DX12 to tell whether the hang needs the full
      # template. Separate storage directory, bounded by timeout 200 and the step
      # timeout. continue-on-error and !cancelled(): runs even after the primary
      # smoke step failed and never changes the job result. A missing adapter is
      # reported as such, never as a fixture pass; a software adapter is run.
      - name: WebGPU Pixi fixture on forced DX12 (diagnostic, normal mode)
        if: ${{ !cancelled() && matrix.mode == 'normal' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          ROVES_PROBE_JITLESS: '0'
          ROVES_PROBE_WEBGPU: '1'
          DENO_WEBGPU_BACKEND: dx12
          ROVES_PROBE_STORAGE_DIR: ${{ runner.temp }}/blitz-webgpu-fixture-storage
          RUST_BACKTRACE: '1'
        run: |
          exe="$RUNNER_TEMP/blitz-probe-target/debug/roves-blitz-v8-probe.exe"
          [ -x "$exe" ] || { echo "::notice::WebGPU fixture skipped: probe executable missing"; exit 0; }
          log="$RUNNER_TEMP/blitz-webgpu-fixture-dx12.log"
          # Empty greps (no adapter, no teardown) are results here, not step errors.
          set +e +o pipefail
          timeout 200 "$exe" > "$log" 2>&1
          status=$?
          [ "$status" -eq 124 ] && echo "::notice::WebGPU fixture (dx12): killed by timeout 200 s"
          fixture=$(grep -F '"check":"webgpu_pixi_8_19_0"' "$log" | head -n 1)
          fixture_status=$(printf '%s' "$fixture" | grep -oE '"status":"[a-z_]+"' | head -n 1 | cut -d'"' -f4)
          fixture_adapter=$(printf '%s' "$fixture" | grep -oE '"adapter":(null|\{[^}]*\})' | head -n 1)
          echo "::notice::WebGPU fixture (dx12) exit=$status result=${fixture_status:-no result line (last stage: $(grep -F ROVES_PROBE_STAGE "$log" | tail -n 1 | cut -d' ' -f2))} adapter=${fixture_adapter:-none}"
          case "$fixture_status" in
            passed) ;;
            no_webgpu|no_adapter) echo "::notice::WebGPU fixture (dx12) did NOT run Pixi: $fixture_status (no usable WebGPU adapter; not a pass)" ;;
            '') ;;
            *) echo "::notice::WebGPU fixture (dx12) detail: $(printf '%s' "$fixture" | cut -c1-700)" ;;
          esac
          # Adapter/backend/device type and page submissions, printed by teardown
          # before its blocking wait (absent if the fixture panicked before it).
          gpu=$(grep -F '"check":"gpu_adapter"' "$log" | head -n 1)
          if [ -n "$gpu" ]; then
            device=$(printf '%s' "$gpu" | grep -oE '"(backend|device_type|name|driver|driver_info)":"[^"]*"' | paste -sd ' ' -)
            submissions=$(printf '%s' "$gpu" | grep -oE '"(submits|command_buffers|last_submit_ms_ago)":[0-9a-z]+' | paste -sd ' ' -)
            echo "::notice::WebGPU fixture (dx12) device: $device"
            echo "::notice::WebGPU fixture (dx12) submissions: $submissions"
            printf '%s' "$device" | grep -q '"device_type":"Cpu"' \
              && echo "::notice::WebGPU fixture (dx12) ran on a software (Cpu) adapter, same class as the template run"
          else
            echo "::notice::WebGPU fixture (dx12) device: no gpu_adapter line (no shared device, or panic before teardown)"
          fi
          teardown=$(grep -F '"check":"gpu_teardown","status":"passed"' "$log" | head -n 1 | grep -oE '"(elapsed_ms|poll_status|queue_idle_wait_ms|device)":("[^"]*"|[0-9a-z]+)' | paste -sd ' ' -)
          [ -n "$teardown" ] || teardown="NOT PASSED: $(grep -m 1 -E 'panicked|did not become idle' "$log" | cut -c1-300)"
          echo "::notice::WebGPU fixture (dx12) teardown: $teardown"
      # Diagnostic only (run 42684745291: normal mode reached the template menu,
      # then the teardown device_poll Wait timed out after 120 s; JITless passed).
      # Re-runs the same unmodified template once per forced wgpu backend
      # (DENO_WEBGPU_BACKEND) and reports adapter, submissions and teardown
      # outcome per backend. continue-on-error: it never changes the job result;
      # the primary smoke step above stays the gate and still fails on its own.
      - name: WebGPU backend comparison (diagnostic, normal mode)
        if: ${{ !cancelled() && matrix.mode == 'normal' }}
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        env:
          ROVES_PROBE_JITLESS: '0'
        run: |
          exe="$RUNNER_TEMP/blitz-probe-target/debug/roves-blitz-v8-probe.exe"
          [ -x "$exe" ] && [ -d visual-novel-template/dist ] || { echo "::notice::backend comparison skipped: probe or game build missing"; exit 0; }
          # Empty greps (no adapter, no menu) are results here, not step errors.
          set +e +o pipefail
          for backend in dx12 vulkan gl; do
            log="$RUNNER_TEMP/blitz-game-$backend.log"
            DENO_WEBGPU_BACKEND=$backend ROVES_PROBE_STORAGE_DIR="$RUNNER_TEMP/blitz-game-storage-$backend" \
              timeout 200 "$exe" --game visual-novel-template/dist > "$log" 2>&1
            status=$?
            adapter=$(grep -F '"check":"gpu_adapter"' "$log" | head -n 1 \
              | grep -oE '"(backend|device_type|name|submits|command_buffers|last_submit_ms_ago|ticks|frames|deferred_ticks|deferrals|max_deferred_run|max_tick_gap_ms|poll_errors|saturated|saturation)":("[^"]*"|[0-9a-z.]+)' | paste -sd ' ' -)
            midrun=$(grep -F '"check":"gpu_backpressure"' "$log" | head -n 1 | grep -oE '"status":"[a-z_]+"')
            [ -n "$midrun" ] && adapter="$adapter pacing $midrun"
            menu=$(grep -F '"check":"game_page"' "$log" | head -n 1 | grep -oE '"start_menu_like":[a-z]+')
            teardown=$(grep -F '"check":"gpu_teardown","status":"passed"' "$log" | head -n 1 | grep -oE '"(poll_status|queue_idle_wait_ms|device)":("[^"]*"|[0-9a-z]+)' | paste -sd ' ' -)
            [ -n "$teardown" ] || teardown="NOT PASSED: $(grep -m 1 -E 'panicked|did not become idle' "$log" | cut -c1-200)"
            echo "::notice::backend=$backend exit=$status ${menu:-no game_page} | adapter: ${adapter:-none} | teardown: $teardown"
          done
      # Diagnostic, opt-in story harness (--story) on the same unmodified
      # template: a real Start click (Blitz hit-test + trusted-event bridge),
      # then the first two settled story states (advanced by a "next" control,
      # a click on the dialogue text, Enter or Space, in that order). Each state
      # needs new dialogue text; toasts never count as progress and a visible
      # error toast fails the step. An error-boundary fallback ("Something went
      # wrong"/"Show Error") fails it at the first check, never as dialogue.
      # continue-on-error: a failure marks this step and is annotated with its
      # reason, but never changes the job result; the smoke step above stays
      # the gate. Separate storage directory; bounded by timeout 900.
      # A separate fresh game process opens Settings on the menu and closes it
      # with Escape (game_settings_popup), so its retained closed dialog cannot
      # affect the story run. After the two states, story types a name into the
      # story's input dialog (game_name_input), then clicks the HUD Save/Load
      # button at its center (game_hud_save_load: the save/load panel must open
      # and the dialogue must not advance). game_settings_popup, game_name_input
      # and game_quick_save are annotated as warnings when not passed and do not
      # change this step's result. The step stays diagnostic: continue-on-error
      # masks its failure, so the job result does not block on it. The
      # game_hud_save_load result it logs is enforced by the separate required
      # regression gate step right after it, which fails the job.
      - name: template story Start and first two dialogue states (diagnostic)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 17
        shell: bash
        env:
          ROVES_PROBE_JITLESS: ${{ matrix.mode == 'jitless' && '1' || '0' }}
          ROVES_PROBE_STORAGE_DIR: ${{ runner.temp }}/blitz-story-storage
          ROVES_PROBE_STORY_SCREENSHOT: ${{ runner.temp }}/blitz-story.png
          RUST_BACKTRACE: '1'
        run: |
          exe="$RUNNER_TEMP/blitz-probe-target/debug/roves-blitz-v8-probe.exe"
          if [ ! -x "$exe" ] || [ ! -d visual-novel-template/dist ]; then
            echo "::error::story harness NOT RUN: probe executable or game build missing"
            exit 1
          fi
          settings_log="$RUNNER_TEMP/blitz-settings.log"
          set +e +o pipefail
          ROVES_PROBE_STORAGE_DIR="$RUNNER_TEMP/blitz-settings-storage" timeout 240 \
            "$exe" --game visual-novel-template/dist --settings-popup > "$settings_log" 2>&1
          settings_status=$?
          settings=$(grep -F '"check":"game_settings_popup"' "$settings_log" | head -n 1)
          if [ "$settings_status" -ne 0 ] || [ -z "$settings" ] \
              || ! printf '%s' "$settings" | grep -Fq '"status":"passed"'; then
            echo "::warning::isolated Settings popup failed (exit=$settings_status): $(printf '%s' "$settings" | cut -c1-900)"
          else
            echo "::notice::isolated Settings popup passed $(printf '%s' "$settings" | cut -c1-700)"
          fi
          log="$RUNNER_TEMP/blitz-story.log"
          # Empty greps are results here, not step errors.
          set +e +o pipefail
          timeout 900 "$exe" --game visual-novel-template/dist --story > "$log" 2>&1
          status=$?
          [ "$status" -eq 124 ] && echo "::notice::story harness killed by timeout 900 s"
          name_input_events=$(grep -m 1 '^ROVES_PROBE_NAME_INPUT_EVENTS ' "$log")
          [ -n "$name_input_events" ] && echo "::notice::$name_input_events"
          for check in game_name_input game_quick_save; do
            line=$(grep -F "\"check\":\"$check\"" "$log" | head -n 1)
            if [ -z "$line" ]; then
              echo "::warning::$check: no result line"
            elif printf '%s' "$line" | grep -Fq "\"check\":\"$check\",\"status\":\"passed\""; then
              echo "::notice::$check passed $(printf '%s' "$line" | cut -c1-700)"
            else
              echo "::warning::$check not passed $(printf '%s' "$line" | cut -c1-900)"
            fi
          done
          story=$(grep -F '"check":"game_story"' "$log" | head -n 1)
          if [ -z "$story" ]; then
            echo "::error::story harness exit=$status: no game_story result (last stage: $(grep -F ROVES_PROBE_STAGE "$log" | tail -n 1 | cut -d' ' -f2); $(grep -m 1 'panicked' "$log" | cut -c1-300))"
            exit 1
          fi
          echo "::notice::story harness exit=$status $(printf '%s' "$story" | cut -c1-900)"
          printf '%s' "$story" | grep -oE '"states":\[[^]]*\]' | cut -c1-700 | sed 's/^/::notice::story states: /'
          printf '%s' "$story" | grep -oE '"toasts":\[[^]]*\]' | cut -c1-700 | sed 's/^/::notice::story toasts: /'
          printf '%s' "$story" | grep -oE '"new_error_messages":\[[^]]*\]' | cut -c1-900 | sed 's/^/::notice::story new errors: /'
          printf '%s' "$story" | grep -oE '"pacing":\{[^}]*\}' | cut -c1-500 | sed 's/^/::notice::story pacing: /'
          teardown=$(grep -F '"check":"gpu_teardown","status":"passed"' "$log" | head -n 1 | grep -oE '"(elapsed_ms|poll_status|queue_idle_wait_ms)":("[^"]*"|[0-9a-z]+)' | paste -sd ' ' -)
          echo "::notice::story harness teardown: ${teardown:-NOT PASSED: $(grep -m 1 -E 'panicked|did not become idle' "$log" | cut -c1-300)}"
          if ! printf '%s' "$story" | grep -Fq '"check":"game_story","status":"passed"'; then
            echo "::error::story harness failed (two dialogue states without error toasts or new script errors required):$(printf '%s' "$story" | grep -oE '"reason":"([^"\\]|\\.)*"' | cut -c1-500)"
            exit 1
          fi
          [ "$status" -eq 0 ] || { echo "::error::story states reached, but the probe exited with $status"; exit 1; }
      # Required regression gate (Blitz paint-order fix: a positioned HUD button
      # must not be hit-tested under later siblings). It only reads the log the
      # diagnostic story step above wrote; it never reruns the game. No
      # continue-on-error: a missing log, a missing result line, more than one
      # result line or a non-passed status fails the job. !cancelled(): it runs
      # even when earlier steps failed, but not after workflow cancellation.
      - name: required regression gate - game_hud_save_load passed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/blitz-story.log"
          if [ ! -f "$log" ]; then
            echo "::error::game_hud_save_load gate: story log $log is absent"
            exit 1
          fi
          lines=$(grep -F 'ROVES_PROBE_RESULT {"check":"game_hud_save_load",' "$log" || true)
          count=$(printf '%s' "$lines" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::game_hud_save_load gate: expected exactly one result line, found $count"
            exit 1
          fi
          if ! printf '%s' "$lines" | grep -Fq 'ROVES_PROBE_RESULT {"check":"game_hud_save_load","status":"passed"'; then
            echo "::error::game_hud_save_load gate: not passed $(printf '%s' "$lines" | cut -c1-900)"
            exit 1
          fi
          echo "::notice::game_hud_save_load passed $(printf '%s' "$lines" | cut -c1-700)"
      - name: template Continue after restart (diagnostic)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          ROVES_PROBE_JITLESS: ${{ matrix.mode == 'jitless' && '1' || '0' }}
          ROVES_PROBE_STORAGE_DIR: ${{ runner.temp }}/blitz-story-storage
        run: |
          set +e +o pipefail
          log="$RUNNER_TEMP/blitz-story.log"
          if ! grep -Fq '"check":"game_quick_save","status":"passed"' "$log"; then
            echo 'ROVES_PROBE_RESULT {"check":"game_restore_save","status":"not_run","detail":{"reason":"quick save did not pass"}}' >> "$log"
            exit 0
          fi
          ROVES_PROBE_RESTORE_LINE=$(node -e '
            const line = require("fs").readFileSync(process.argv[1], "utf8").split(/\r?\n/)
              .find(line => line.startsWith("ROVES_PROBE_RESULT {\"check\":\"game_story\","));
            const expected = line && JSON.parse(line.slice("ROVES_PROBE_RESULT ".length)).detail.dialogue[1]?.[0];
            if (!expected) process.exit(1);
            process.stdout.write(expected);
          ' "$log") || exit 1
          export ROVES_PROBE_RESTORE_LINE
          exe="$RUNNER_TEMP/blitz-probe-target/debug/roves-blitz-v8-probe.exe"
          restore_log="$RUNNER_TEMP/blitz-story-restore.log"
          timeout 240 "$exe" --game visual-novel-template/dist --story-restore > "$restore_log" 2>&1
          status=$?
          result=$(grep -m 1 -F '"check":"game_restore_save"' "$restore_log")
          if [ "$status" -ne 0 ]; then
            result="ROVES_PROBE_RESULT {\"check\":\"game_restore_save\",\"status\":\"failed\",\"detail\":{\"exit\":$status}}"
          elif [ -z "$result" ]; then
            result='ROVES_PROBE_RESULT {"check":"game_restore_save","status":"failed","detail":{"reason":"no result from restore process"}}'
          fi
          printf '%s\n' "$result" >> "$log"
          echo "::notice::restore exit=$status $(printf '%s' "$result" | cut -c1-900)"
          [ "$status" -eq 0 ] && printf '%s' "$result" | grep -Fq '"status":"passed"'
      # Raw step logs need admin auth; annotations are public. Re-emit the tail of the
      # probe log so a crash (e.g. exit 139) can be diagnosed without a token.
      - name: annotate probe log tail on failure
        if: failure()
        shell: bash
        run: |
          # GitHub keeps at most 10 notice annotations per step: emit only the last
          # meaningful lines, never cargo's Compiling/Downloaded progress.
          # If cargo check failed before the probe ran, show its last attempt.
          log="$RUNNER_TEMP/blitz-probe.log"
          [ -f "$log" ] || log=$(ls -1 "$RUNNER_TEMP"/cargo-check-*.log 2>/dev/null | sort | tail -n 1)
          if [ -z "$log" ] || [ ! -f "$log" ]; then
            echo "::notice::no probe or cargo check log was produced"
            exit 0
          fi
          echo "::notice::tail of $(basename "$log")"
          grep -v -E -e '^[[:space:]]*$' -e 'Compiling|Downloaded|Downloading|Checking|Finished|Locking|Updating' "$log" \
            | tail -n 9 \
            | while IFS= read -r line; do echo "::notice::${line:0:900}"; done || true
      # Real window: the probe opens an undecorated blitz-shell window at a known
      # position; this step screenshots it and sends a real OS click at the
      # button the probe reports. The probe exits 0 once the trusted click
      # reached the JS listeners (winit -> blitz-shell -> EventDriver -> JS).
      - name: window mode with a real OS click
        shell: pwsh
        env:
          ROVES_PROBE_JITLESS: ${{ matrix.mode == 'jitless' && '1' || '0' }}
          ROVES_PROBE_STORAGE_DIR: ${{ runner.temp }}/blitz-storage
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'blitz-probe-target/debug/roves-blitz-v8-probe.exe'
          $log = Join-Path $env:RUNNER_TEMP 'blitz-window.log'
          $err = Join-Path $env:RUNNER_TEMP 'blitz-window.err'
          $process = Start-Process -FilePath $exe -ArgumentList '--window' -RedirectStandardOutput $log -RedirectStandardError $err -PassThru -NoNewWindow
          $ready = $null
          for ($i = 0; $i -lt 240 -and -not $ready -and -not $process.HasExited; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) { $ready = Select-String -Path $log -Pattern 'ROVES_PROBE_WINDOW_READY (.*)' | Select-Object -First 1 }
          }
          if (-not $ready) {
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 20
            Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw 'the probe window never reported ready'
          }
          $info = $ready.Matches[0].Groups[1].Value | ConvertFrom-Json
          $scale = [double]$info.scale
          Start-Sleep -Milliseconds 700
          Add-Type -AssemblyName System.Drawing
          $left = [int]($info.origin[0] * $scale)
          $top = [int]($info.origin[1] * $scale)
          $bitmap = New-Object System.Drawing.Bitmap ([int](640 * $scale)), ([int](360 * $scale))
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($left, $top, 0, 0, $bitmap.Size)
          $bitmap.Save((Join-Path $env:RUNNER_TEMP 'blitz-window.png'))
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class RovesInput {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          }
          "@
          $x = [int](($info.origin[0] + $info.target.x) * $scale)
          $y = [int](($info.origin[1] + $info.target.y) * $scale)
          [RovesInput]::SetCursorPos($x, $y) | Out-Null
          Start-Sleep -Milliseconds 300
          [RovesInput]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 100
          [RovesInput]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'the window run timed out' }
          Select-String -Path $log -Pattern 'ROVES_PROBE_WINDOW_READY|window_presentation_real_input|storage_history|indexed_db' | ForEach-Object { $_.Line }
          # Second process on the same storage directory: localStorage and IndexedDB persisted.
          if (-not (Select-String -Path $log -Pattern '"local_storage_runs":2' -Quiet)) { throw 'localStorage did not persist across processes' }
          if (-not (Select-String -Path $log -Pattern '"indexed_db_runs":2' -Quiet)) { throw 'IndexedDB did not persist across processes' }
          if ($process.ExitCode -ne 0) {
            Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "window mode failed with exit code $($process.ExitCode)"
          }
      # Unified API compatibility report (support/blitz-v8-probe/compat): the
      # declared implementation state of each API and template path, combined
      # with this run's ROVES_PROBE_RESULT evidence from every log above, as
      # verified / present_incomplete / missing / unavailable / failed. It reads
      # results only and never changes the job result, except that an invalid
      # manifest (unknown evidence or check id) fails this step. Template files
      # the audit cites but main no longer has are warnings.
      - name: API compatibility report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          template_sha=$(git -C visual-novel-template rev-parse HEAD 2>/dev/null || echo unknown)
          template_args=()
          [ -d visual-novel-template/src ] && template_args=(--template visual-novel-template)
          node support/blitz-v8-probe/compat/report.mjs \
            --logs "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/blitz-compat-report.json" \
            --mode ${{ matrix.mode }} \
            --template-sha "$template_sha" \
            --sources support/blitz-v8-probe/src \
            "${template_args[@]}" \
            --github
      - name: upload probe log and offscreen screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blitz-probe-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/cargo-check-*.log
            ${{ runner.temp }}/blitz-probe.log
            ${{ runner.temp }}/blitz-probe.png
            ${{ runner.temp }}/blitz-window.png
            ${{ runner.temp }}/blitz-window.log
            ${{ runner.temp }}/blitz-window.err
            ${{ runner.temp }}/blitz-game.log
            ${{ runner.temp }}/blitz-game-*.log
            ${{ runner.temp }}/blitz-webgpu-fixture-*.log
            ${{ runner.temp }}/blitz-game.png
            ${{ runner.temp }}/blitz-settings.log
            ${{ runner.temp }}/blitz-story.log
            ${{ runner.temp }}/blitz-story-restore.log
            ${{ runner.temp }}/blitz-story.png
            ${{ runner.temp }}/blitz-compat-report.json
            ${{ runner.temp }}/blitz-probe-target/debug/roves-blitz-v8-probe.exe
          retention-days: 7
          if-no-files-found: warn


