name: Blitz + Deno/V8 probe

# Isolated feasibility check only; this does not build or gate the production engine.
'on':
  push:
    paths:
      - 'support/blitz-v8-probe/**'
      - '.github/workflows/blitz-probe.yml'
  workflow_dispatch: {}

concurrency:
  group: blitz-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, jitless]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: support/blitz-v8-probe/js/package-lock.json
      - name: bundle the Motion scenario (include_str! input)
        working-directory: support/blitz-v8-probe/js
        run: |
          npm ci
          npm run build
      - name: restore Cargo and build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/blitz-probe-target
          key: blitz-probe-${{ runner.os }}-rust-1.95.0-${{ hashFiles('support/blitz-v8-probe/Cargo.lock') }}
      - name: check locked dependency graph
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/blitz-probe-target
        run: cargo check --locked --manifest-path support/blitz-v8-probe/Cargo.toml
      - name: run probe
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/blitz-probe-target
          ROVES_PROBE_JITLESS: ${{ matrix.mode == 'jitless' && '1' || '0' }}
          ROVES_PROBE_SCREENSHOT: ${{ runner.temp }}/blitz-probe.png
          RUST_BACKTRACE: '1'
        run: |
          set -o pipefail
          cargo run --locked --manifest-path support/blitz-v8-probe/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/blitz-probe.log"
          grep -q '"jitless":${{ matrix.mode == 'jitless' && 'true' || 'false' }}' "$RUNNER_TEMP/blitz-probe.log"
      # Raw step logs need admin auth; annotations are public. Re-emit the tail of the
      # probe log so a crash (e.g. exit 139) can be diagnosed without a token.
      - name: annotate probe log tail on failure
        if: failure()
        shell: bash
        run: |
          tail -n 60 "$RUNNER_TEMP/blitz-probe.log" | grep -v '^\s*$' | while IFS= read -r line; do
            echo "::notice::${line:0:900}"
          done
      - name: upload probe log and offscreen screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blitz-probe-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/blitz-probe.log
            ${{ runner.temp }}/blitz-probe.png
          retention-days: 7
          if-no-files-found: warn


