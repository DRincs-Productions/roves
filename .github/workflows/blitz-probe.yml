name: Blitz + Deno/V8 probe

# Isolated feasibility check only; this does not build or gate the production engine.
'on':
  push:
    paths:
      - 'support/blitz-v8-probe/**'
      - '.github/workflows/blitz-probe.yml'
  workflow_dispatch: {}

concurrency:
  group: blitz-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, jitless]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: support/blitz-v8-probe/js/package-lock.json
      - name: bundle the Motion scenario (include_str! input)
        working-directory: support/blitz-v8-probe/js
        run: |
          npm ci
          npm run build
      - name: restore Cargo and build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}/blitz-probe-target
          key: blitz-probe-${{ runner.os }}-rust-1.95.0-${{ hashFiles('support/blitz-v8-probe/Cargo.lock') }}
      - name: check locked dependency graph
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/blitz-probe-target
        run: cargo check --locked --manifest-path support/blitz-v8-probe/Cargo.toml
      - name: run probe
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/blitz-probe-target
          ROVES_PROBE_JITLESS: ${{ matrix.mode == 'jitless' && '1' || '0' }}
          ROVES_PROBE_SCREENSHOT: ${{ runner.temp }}/blitz-probe.png
          ROVES_PROBE_STORAGE_DIR: ${{ runner.temp }}/blitz-storage
          RUST_BACKTRACE: '1'
        run: |
          set -o pipefail
          cargo run --locked --manifest-path support/blitz-v8-probe/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/blitz-probe.log"
          grep -q '"jitless":${{ matrix.mode == 'jitless' && 'true' || 'false' }}' "$RUNNER_TEMP/blitz-probe.log"
      # Raw step logs need admin auth; annotations are public. Re-emit the tail of the
      # probe log so a crash (e.g. exit 139) can be diagnosed without a token.
      - name: annotate probe log tail on failure
        if: failure()
        shell: bash
        run: |
          # GitHub keeps at most 10 notice annotations per step: emit only the last
          # meaningful lines, never cargo's Compiling/Downloaded progress.
          grep -v -E -e '^[[:space:]]*$' -e 'Compiling|Downloaded|Downloading|Checking|Finished|Locking|Updating' "$RUNNER_TEMP/blitz-probe.log" \
            | tail -n 9 \
            | while IFS= read -r line; do echo "::notice::${line:0:900}"; done
      # Real window: the probe opens an undecorated blitz-shell window at a known
      # position; this step screenshots it and sends a real OS click at the
      # button the probe reports. The probe exits 0 once the trusted click
      # reached the JS listeners (winit -> blitz-shell -> EventDriver -> JS).
      - name: window mode with a real OS click
        shell: pwsh
        env:
          ROVES_PROBE_JITLESS: ${{ matrix.mode == 'jitless' && '1' || '0' }}
          ROVES_PROBE_STORAGE_DIR: ${{ runner.temp }}/blitz-storage
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'blitz-probe-target/debug/roves-blitz-v8-probe.exe'
          $log = Join-Path $env:RUNNER_TEMP 'blitz-window.log'
          $err = Join-Path $env:RUNNER_TEMP 'blitz-window.err'
          $process = Start-Process -FilePath $exe -ArgumentList '--window' -RedirectStandardOutput $log -RedirectStandardError $err -PassThru -NoNewWindow
          $ready = $null
          for ($i = 0; $i -lt 240 -and -not $ready -and -not $process.HasExited; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) { $ready = Select-String -Path $log -Pattern 'ROVES_PROBE_WINDOW_READY (.*)' | Select-Object -First 1 }
          }
          if (-not $ready) {
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 20
            Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw 'the probe window never reported ready'
          }
          $info = $ready.Matches[0].Groups[1].Value | ConvertFrom-Json
          $scale = [double]$info.scale
          Start-Sleep -Milliseconds 700
          Add-Type -AssemblyName System.Drawing
          $left = [int]($info.origin[0] * $scale)
          $top = [int]($info.origin[1] * $scale)
          $bitmap = New-Object System.Drawing.Bitmap ([int](640 * $scale)), ([int](360 * $scale))
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($left, $top, 0, 0, $bitmap.Size)
          $bitmap.Save((Join-Path $env:RUNNER_TEMP 'blitz-window.png'))
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class RovesInput {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          }
          "@
          $x = [int](($info.origin[0] + $info.target.x) * $scale)
          $y = [int](($info.origin[1] + $info.target.y) * $scale)
          [RovesInput]::SetCursorPos($x, $y) | Out-Null
          Start-Sleep -Milliseconds 300
          [RovesInput]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 100
          [RovesInput]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'the window run timed out' }
          Select-String -Path $log -Pattern 'ROVES_PROBE_WINDOW_READY|window_presentation_real_input|storage_history' | ForEach-Object { $_.Line }
          # Second process on the same storage directory: localStorage persisted.
          if (-not (Select-String -Path $log -Pattern '"local_storage_runs":2' -Quiet)) { throw 'localStorage did not persist across processes' }
          if ($process.ExitCode -ne 0) {
            Get-Content $err -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "window mode failed with exit code $($process.ExitCode)"
          }
      - name: upload probe log and offscreen screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blitz-probe-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/blitz-probe.log
            ${{ runner.temp }}/blitz-probe.png
            ${{ runner.temp }}/blitz-window.png
            ${{ runner.temp }}/blitz-window.log
            ${{ runner.temp }}/blitz-window.err
          retention-days: 7
          if-no-files-found: warn


