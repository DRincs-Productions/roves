name: 'Test: Steamworks gate'

# Developer experiment only (support/steamworks-gate/README.md). Builds the standalone
# steamworks =0.13.1 gate on Windows, macOS and Linux and runs it in the two states a CI
# runner can honestly provide:
#   * compile + client unavailable (all three OSes): the bundled libsteam_api redistributable
#     loads next to the binary, SteamAPI_InitFlat fails gracefully with no Steam client, the
#     process exits cleanly; a negative run with --expect real must fail.
#   * emulation (Linux only): a pinned, checksum-verified Goldberg/GSE release (gbe_fork,
#     LGPL-3.0) replaces libsteam_api.so offline with Valve's public test App ID 480, proving
#     init -> UserStatsStored callback -> SteamAPI_Shutdown against an emulator. This is NOT
#     evidence about the real Steam client.
# Real Steam behaviour is a manual opt-in smoke on a developer machine (README.md); this
# workflow never uses Steam credentials, never uploads to Steam, never gates a release, and
# touches no other workflow or the CEF player.

on:
  # No push trigger (user 2026-11-26): this old feasibility gate runs macOS/Linux jobs, which
  # now run only at release time; dispatch it by hand when needed.
  workflow_dispatch:

concurrency:
  group: steamworks-gate-${{ github.ref }}
  # A cancelled run is not a verified one (AGENTS.md CI rules): queue instead of cancelling.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned Goldberg/GSE release for the Linux emulation job. Update tag and SHA-256 together;
  # the digest is the one GitHub publishes for the release asset.
  GSE_TAG: release-2026_09_27
  GSE_ASSET: emu-linux-release.tar.bz2
  GSE_SHA256: f3e08366fb8052e55d9ca29ef5bb1f80afb66d59e96879e5900aac8a6d86c7b9

jobs:
  unavailable:
    name: compile + client unavailable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            lib: steam_api64.dll
            exe: roves-steamworks-gate.exe
          - os: macos-15
            lib: libsteam_api.dylib
            exe: roves-steamworks-gate
          - os: ubuntu-24.04
            lib: libsteam_api.so
            exe: roves-steamworks-gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Cone mode keeps the root rust-toolchain.toml (Rust 1.95.0), which this crate uses.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            support/steamworks-gate
          sparse-checkout-cone-mode: true
      - name: toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          echo "::notice::$(rustc --version) on ${{ matrix.os }} $(uname -m)"
          # Mixed form (D:/a/_temp) on Windows: valid for both cargo and Git Bash tools.
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then tmp="$(cygpath -m "$RUNNER_TEMP")"; fi
          echo "GATE_TMP=$tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmp/gate-target" >> "$GITHUB_ENV"
      - name: build (release, locked)
        shell: bash
        working-directory: support/steamworks-gate
        run: |
          cargo build --locked --release 2>&1 | tee "$GATE_TMP/gate-build.log"
          test "${PIPESTATUS[0]}" = 0
      - name: stage binary with the bundled redistributable
        shell: bash
        run: |
          stage="$GATE_TMP/gate"
          mkdir -p "$stage"
          cp "$CARGO_TARGET_DIR/release/${{ matrix.exe }}" "$stage/"
          # steamworks-sys copies the SDK redistributable into its OUT_DIR and links it
          # dynamically; a shipped player places it next to the executable.
          lib="$(find "$CARGO_TARGET_DIR/release/build" -path '*steamworks-sys-*/out/${{ matrix.lib }}' | head -1)"
          test -n "$lib" || { echo "::error::${{ matrix.lib }} not found in steamworks-sys OUT_DIR"; exit 1; }
          cp "$lib" "$stage/"
          case "${{ runner.os }}" in
            Linux) ldd "$stage/${{ matrix.exe }}" | grep steam_api || true ;;
            macOS) otool -L "$stage/${{ matrix.exe }}" | grep steam_api || true; otool -D "$stage/${{ matrix.lib }}" ;;
          esac
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      - name: run the gate (no Steam client)
        shell: bash
        run: |
          # Linux binaries carry no rpath; macOS resolves the redistributable's install name
          # (printed above) and falls back to the binary's directory.
          export LD_LIBRARY_PATH="$STAGE" DYLD_FALLBACK_LIBRARY_PATH="$STAGE"
          log="$GATE_TMP/gate-run.log"
          set +e
          "$STAGE/${{ matrix.exe }}" --expect unavailable > "$log" 2>&1
          code=$?
          "$STAGE/${{ matrix.exe }}" --expect real --timeout-secs 5 > "$GATE_TMP/gate-negative.log" 2>&1
          negative=$?
          set -e
          cat "$log"
          need() { grep -q "$1" "$log" || { echo "::error::missing: $1"; exit 1; }; }
          test "$code" = 0 || { echo "::error::gate exit $code"; exit 1; }
          need '^gate: start steamworks=0.13.1'
          need '^gate: init outcome=unavailable kind='
          need '^gate: PASS outcome=unavailable'
          # Negative reproduction: the same environment must not pass as real Steam.
          cat "$GATE_TMP/gate-negative.log"
          test "$negative" = 1 || { echo "::error::--expect real exited $negative, expected 1"; exit 1; }
          grep -q '^gate: FAIL expected real' "$GATE_TMP/gate-negative.log" \
            || { echo "::error::negative run did not report the mismatch"; exit 1; }
          echo "::notice::$(grep '^gate: init outcome' "$log")"
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamworks-gate-unavailable-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/gate-build.log
            ${{ runner.temp }}/gate-run.log
            ${{ runner.temp }}/gate-negative.log
          if-no-files-found: warn

  emulation:
    name: emulation (Linux, Goldberg/GSE)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            support/steamworks-gate
          sparse-checkout-cone-mode: true
      - name: toolchain
        shell: bash
        run: |
          echo "::notice::$(rustc --version)"
          # Mixed form (D:/a/_temp) on Windows: valid for both cargo and Git Bash tools.
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null; then tmp="$(cygpath -m "$RUNNER_TEMP")"; fi
          echo "GATE_TMP=$tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$tmp/gate-target" >> "$GITHUB_ENV"
      - name: build (release, locked)
        shell: bash
        working-directory: support/steamworks-gate
        run: |
          cargo build --locked --release 2>&1 | tee "$GATE_TMP/gate-build.log"
          test "${PIPESTATUS[0]}" = 0
      - name: fetch the pinned emulator and verify its checksum
        shell: bash
        run: |
          mkdir -p "$GATE_TMP/gse"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$GATE_TMP/gse.tar.bz2" \
            "https://github.com/Detanup01/gbe_fork/releases/download/$GSE_TAG/$GSE_ASSET"
          echo "$GSE_SHA256  $GATE_TMP/gse.tar.bz2" | sha256sum -c -
          tar xjf "$GATE_TMP/gse.tar.bz2" -C "$GATE_TMP/gse"
      - name: stage the gate with the emulator
        shell: bash
        run: |
          stage="$GATE_TMP/gate"
          mkdir -p "$stage/steam_settings"
          cp "$CARGO_TARGET_DIR/release/roves-steamworks-gate" "$stage/"
          real="$(find "$CARGO_TARGET_DIR/release/build" -path '*steamworks-sys-*/out/libsteam_api.so' | head -1)"
          test -n "$real" || { echo "::error::redistributable libsteam_api.so not found"; exit 1; }
          emu="$(find "$GATE_TMP/gse" -path '*regular*' -path '*x64*' -name libsteam_api.so | head -1)"
          gen="$(find "$GATE_TMP/gse" -name 'generate_interfaces*x64*' -type f | head -1)"
          test -n "$emu" || { echo "::error::emulator libsteam_api.so (regular/x64) not found in $GSE_ASSET"; find "$GATE_TMP/gse" -maxdepth 4; exit 1; }
          test -n "$gen" || { echo "::error::generate_interfaces x64 not found in $GSE_ASSET"; find "$GATE_TMP/gse" -maxdepth 4; exit 1; }
          # steam_interfaces.txt lists the interface versions of the redistributable the gate
          # was linked against (steamworks-sys 0.13.0's SDK), generated with GSE's own tool.
          work="$GATE_TMP/interfaces"
          mkdir -p "$work"
          cp "$real" "$work/libsteam_api.so"
          cp "$gen" "$work/generate_interfaces"
          chmod +x "$work/generate_interfaces"
          ( cd "$work" && ./generate_interfaces libsteam_api.so )
          test -s "$work/steam_interfaces.txt" || { echo "::error::steam_interfaces.txt not generated"; ls -la "$work"; exit 1; }
          cp "$work/steam_interfaces.txt" "$stage/steam_settings/"
          # Valve's public test app; the emulator is offline and local.
          echo 480 > "$stage/steam_settings/steam_appid.txt"
          printf '[main::connectivity]\ndisable_networking=1\n' > "$stage/steam_settings/configs.main.ini"
          cp "$emu" "$stage/libsteam_api.so"
          # The library loaded must be the emulator, not the redistributable.
          if cmp -s "$real" "$stage/libsteam_api.so"; then echo "::error::emulator equals redistributable"; exit 1; fi
          echo "::notice::emulator $GSE_TAG $(sha256sum "$stage/libsteam_api.so" | cut -c1-16); redistributable $(sha256sum "$real" | cut -c1-16)"
          LD_LIBRARY_PATH="$stage" ldd "$stage/roves-steamworks-gate" | grep steam_api
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      - name: run the gate (emulation)
        shell: bash
        run: |
          log="$GATE_TMP/gate-run.log"
          set +e
          mkdir -p "$GATE_TMP/gse-home"
          LD_LIBRARY_PATH="$STAGE" HOME="$GATE_TMP/gse-home" timeout 120 \
            "$STAGE/roves-steamworks-gate" --expect emulation --timeout-secs 30 > "$log" 2>&1
          code=$?
          set -e
          grep '^gate:' "$log" || cat "$log"
          need() { grep -q "$1" "$log" || { echo "::error::missing: $1"; exit 1; }; }
          test "$code" = 0 || { echo "::error::gate exit $code"; exit 1; }
          need '^gate: init outcome=initialized'
          need '^gate: identity app_id=480 '
          need '^gate: callback UserStatsStored result=Ok'
          need '^gate: shutdown complete'
          need '^gate: PASS outcome=initialized expect=emulation'
          if pgrep -f roves-steamworks-gate; then echo "::error::gate still running after exit"; exit 1; fi
          echo "::notice::emulation: $(grep '^gate: callbacks' "$log")"
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamworks-gate-emulation-linux
          path: |
            ${{ runner.temp }}/gate-build.log
            ${{ runner.temp }}/gate-run.log
          if-no-files-found: warn
