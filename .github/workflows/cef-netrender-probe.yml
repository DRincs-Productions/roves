name: CEF -> wgpu-weld -> wgpu + SDL3 probe

# Developer experiment only (support/cef-netrender-probe/README.md): builds the isolated
# Windows probe (welding e991684, CEF 154, wgpu 29.0.4 and SDL3) and runs it on
# the runner's only DX12 adapter, WARP. Accelerated frame import is also tested on
# real GPUs using the uploaded bundle. The same bundle then runs a --roves-game-dir loading
# gate on a minimal loopback JS fixture (no GPU frame or gameplay claim). Finally it
# packages the same Release bundle with the unmodified web build of
# DRincs-Productions/visual-novel-template (pinned commit) as a directly playable Windows
# folder (play.exe + game\, provenance, dependency check), runs it by direct launch and
# uploads it as a workflow artifact only (no GitHub Release). Separate from
# cef-window-probe.yml (CEF 156 baseline, unchanged). Never gates a release.

on:
  push:
    paths:
      - 'support/cef-netrender-probe/**'
      # Compiled into the probe's opt-in game mode through `#[path]`.
      - 'support/cef-window-probe/src/server.rs'
      # Embedded by the game-mode startup screen and used for play.exe's icon.
      - 'icon.png'
      - '.github/workflows/cef-netrender-probe.yml'
  workflow_dispatch:

concurrency:
  group: cef-netrender-probe-${{ github.ref }}
  # A cancelled run is not a verified one (AGENTS.md CI rules): queue instead of cancelling.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    # The repository root rust-toolchain.toml pins the engine toolchain (1.95.0), below the
    # probe's MSRV; rustup gives RUSTUP_TOOLCHAIN precedence over that file, so every cargo,
    # rustc and nested cargo spawned by the bundle binary (cef::build_util) uses 1.99.1.
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
      # welding 0.15.0 requires Rust 1.97.1; wgpu-weld e991684 pins 1.99.1 for its own CI.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: toolchain versions
        shell: bash
        working-directory: support/cef-netrender-probe
        run: |
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN"
          rustup show active-toolchain
          cargo --version --verbose
          rustc --version --verbose
          case "$(rustc --version)" in
            "rustc 1.99.1 "*) ;;
            *) echo "::error::expected rustc 1.99.1, got $(rustc --version)"; exit 1 ;;
          esac
          echo "::notice::$(cargo --version) / $(rustc --version)"
      - name: set build directories
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'cef-nr-target')" >> $env:GITHUB_ENV
          # CEF 154 distribution, kept apart from the stage-1 probe's CEF 156.
          "CEF_PATH=$(Join-Path $env:RUNNER_TEMP 'cef154')" >> $env:GITHUB_ENV
      - name: restore cargo and CEF cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}\cef154
          key: cef-netrender-probe-${{ runner.os }}-rust-1.99.1-${{ hashFiles('support/cef-netrender-probe/Cargo.lock') }}
      - name: dependency graph evidence
        shell: bash
        working-directory: support/cef-netrender-probe
        run: |
          cargo tree --locked --target x86_64-pc-windows-msvc -e normal -d \
            | tee "$RUNNER_TEMP/cef-nr-duplicates.txt"
          # One wgpu 29 for the host, welding and grafting; wgpu 30 may appear only
          # under cef (accelerated_osr importer, never called).
          tree() { cargo tree --locked --target x86_64-pc-windows-msvc -e normal --prefix depth --depth 1 "$@"; }
          users29="$(tree -i wgpu@29.0.4 | grep '^1' | cut -d' ' -f1 | sed 's/^1//' | sort | tr '\n' ' ')"
          echo "::notice::wgpu 29.0.4 used by: $users29"
          for crate in grafting roves_cef_netrender_probe welding; do
            echo " $users29" | grep -q " $crate " || { echo "::error::$crate is not on wgpu 29.0.4"; exit 1; }
          done
          users30="$(tree -i wgpu@30.0.2 | grep '^1' | cut -d' ' -f1 | sed 's/^1//' | sort | tr '\n' ' ')"
          echo "::notice::wgpu 30.0.2 used by: $users30"
          test "$users30" = "cef " || { echo "::error::wgpu 30 reached by something other than cef"; exit 1; }
      - name: build and bundle (release, sandbox)
        id: bundle
        shell: bash
        working-directory: support/cef-netrender-probe
        run: |
          cargo run --locked --release --bin bundle -- "$RUNNER_TEMP/cef-nr-bundle" --release \
            2>&1 | tee "$RUNNER_TEMP/cef-nr-build.log"
          test -f "$RUNNER_TEMP/cef-nr-bundle/roves_cef_netrender_probe.exe"
          test -f "$RUNNER_TEMP/cef-nr-bundle/roves_cef_netrender_probe.dll"
          test -f "$RUNNER_TEMP/cef-nr-bundle/libcef.dll"
      - name: save cargo and CEF cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}\cef154
          key: cef-netrender-probe-${{ runner.os }}-rust-1.99.1-${{ hashFiles('support/cef-netrender-probe/Cargo.lock') }}
      # Gated on WARP: sandbox information present, DX12 adapter, producer created, every CEF
      # child launched without --no-sandbox (command lines sampled while it runs), clean exit
      # and no leftover process. If CEF imports frames, the pixel/alpha/resize checks are
      # gated too; if accelerated OSR delivers nothing on WARP, that is reported as a notice
      # (the GPU path is then verified only on real hardware) and the process must still
      # close cleanly.
      - name: run the probe (wgpu composition, WARP)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cef-nr-run'
          New-Item -ItemType Directory -Force $out | Out-Null
          $log = Join-Path $out 'roves-cef-nr.log'
          $exe = Join-Path $env:RUNNER_TEMP 'cef-nr-bundle\roves_cef_netrender_probe.exe'
          $arguments = @(
            '--roves-compose=wgpu', "--roves-log=$log", '--roves-timeout-ms=90000',
            "--roves-cache-dir=$(Join-Path $out 'cache')", "--log-file=$(Join-Path $out 'cef-debug.log')"
          )
          $proc = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          $null = $proc.Handle  # keep the handle so ExitCode is available after exit
          $children = @{}
          $deadline = (Get-Date).AddSeconds(150)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            Get-CimInstance Win32_Process -Filter "Name='roves_cef_netrender_probe.exe'" -ErrorAction SilentlyContinue |
              ForEach-Object { if ($_.CommandLine) { $children[$_.ProcessId] = $_.CommandLine } }
            Start-Sleep -Milliseconds 300
          }
          if (-not $proc.HasExited) {
            Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Output '::error::the probe did not exit in time'
            exit 1
          }
          $code = $proc.ExitCode
          $children.Values | Set-Content (Join-Path $out 'process-command-lines.txt')
          Get-Content $log
          $failed = $false
          foreach ($pattern in @(
              'sandbox-info present=true', 'adapter name=.* backend=Dx12', 'surface format=',
              'producer created accelerated=true background=transparent', 'closing imported=',
              'browser closed', 'cef shutdown complete', "exit code=$code")) {
            if (-not (Select-String -Path $log -Pattern $pattern -Quiet)) {
              Write-Output "::error::missing evidence: $pattern"; $failed = $true
            }
          }
          $types = $children.Values | ForEach-Object { if ($_ -match '--type=([\w-]+)') { $Matches[1] } } | Sort-Object -Unique
          Write-Output "::notice::CEF child types seen: $($types -join ', ')"
          if (-not ($types -contains 'renderer')) { Write-Output '::error::no renderer child observed'; $failed = $true }
          if ($children.Values | Where-Object { $_ -match '--no-sandbox' }) {
            Write-Output '::error::a CEF child process was launched with --no-sandbox'; $failed = $true
          }
          $imported = Select-String -Path $log -Pattern 'import frame=' -Quiet
          if ($imported) {
            if ($code -ne 0) { Write-Output "::error::frames were imported but the checks failed (exit $code)"; $failed = $true }
            if (@(Select-String -Path $log -Pattern '^roves-cef-nr PASS pixel').Count -ne 16) {
              Write-Output '::error::expected 16 PASS pixel lines (2 checks x 4 points x composed/cef-texture)'; $failed = $true
            }
          } else {
            Write-Output "::notice::accelerated OSR imported no frame on WARP (exit $code): GPU import not verifiable on this runner"
            if ($code -ne 2) { Write-Output "::error::unexpected exit code $code without frames"; $failed = $true }
          }
          Select-String -Path $log -Pattern 'FAIL|adapter name|import frame=|title ' | ForEach-Object { Write-Output "::notice::$($_.Line)" }
          Start-Sleep -Seconds 3
          if (Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue) {
            Write-Output '::error::probe processes left running after exit'; $failed = $true
          }
          if ($failed) { exit 1 }
      # Opt-in --roves-game-dir LOADING gate only, on the same bundle (no second build). A
      # two-file fixture written here (index.html + an ES module) is served by the probe's own
      # loopback server; required: navigation to the loopback root accepted, the module's
      # console marker from <origin>/game.js, auto-close, clean CEF shutdown, server stop,
      # exit 0, sandboxed children and no leftover process. WARP delivers no accelerated frame,
      # so imported frames are reported, never required: this proves neither GPU frames nor
      # gameplay/input (real hardware only, README "Real-game mode"). No window automation.
      - name: run the probe in game mode (loopback JS fixture, WARP)
        if: (success() || failure()) && steps.bundle.outcome == 'success'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cef-nr-game-run'
          $game = Join-Path $out 'game'
          New-Item -ItemType Directory -Force $game | Out-Null
          Set-Content -Encoding utf8 (Join-Path $game 'index.html') @'
          <!doctype html>
          <meta charset="utf-8">
          <title>roves ci game fixture</title>
          <script type="module" src="./game.js"></script>
          '@
          # A module script also proves the server's JavaScript MIME type (Chromium refuses
          # module scripts served with a non-JavaScript type).
          Set-Content -Encoding utf8 (Join-Path $game 'game.js') @'
          const same = new URL(import.meta.url).origin === location.origin;
          console.log(`roves-ci-game-fixture module-ok same-origin=${same}`);
          document.title = 'roves ci game fixture ready';
          '@
          if (Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue) {
            Write-Output '::notice::stopping processes left by the previous step before the game run'
            Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
          }
          $log = Join-Path $out 'roves-cef-nr-game.log'
          $exe = Join-Path $env:RUNNER_TEMP 'cef-nr-bundle\roves_cef_netrender_probe.exe'
          $arguments = @(
            "--roves-game-dir=$game", '--roves-compose=wgpu', '--roves-auto-close-ms=5000',
            '--roves-timeout-ms=90000', "--roves-log=$log",
            "--roves-cache-dir=$(Join-Path $out 'cache')", "--log-file=$(Join-Path $out 'cef-debug.log')"
          )
          $proc = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          $null = $proc.Handle  # keep the handle so ExitCode is available after exit
          $children = @{}
          $deadline = (Get-Date).AddSeconds(150)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            Get-CimInstance Win32_Process -Filter "Name='roves_cef_netrender_probe.exe'" -ErrorAction SilentlyContinue |
              ForEach-Object { if ($_.CommandLine) { $children[$_.ProcessId] = $_.CommandLine } }
            Start-Sleep -Milliseconds 300
          }
          if (-not $proc.HasExited) {
            Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Output '::error::the probe did not exit in time in game mode'
            exit 1
          }
          $code = $proc.ExitCode
          $children.Values | Set-Content (Join-Path $out 'process-command-lines.txt')
          Get-Content $log
          $lines = @(Get-Content $log)
          $failed = $false
          $origin = ($lines | Select-String -Pattern 'game loopback origin=(http://127\.0\.0\.1:\d+) ' |
            Select-Object -First 1).Matches.Groups[1].Value
          if (-not $origin) { Write-Output '::error::missing evidence: game loopback origin'; exit 1 }
          $o = [regex]::Escape($origin)
          # Required lines, in this order (index of the first match of each).
          $last = -1
          foreach ($pattern in @(
              'sandbox-info present=true', 'adapter name=.* backend=Dx12',
              'producer created accelerated=true background=white',
              "load-end status=200 url=$o/ ok=true", 'auto-close scheduled delay_ms=5000',
              'auto-close window', 'closing imported=', 'game input forwarded=', 'browser closed',
              'producer and renderer dropped', 'cef shutdown complete', 'game loopback stopped',
              'exit code=0$')) {
            $at = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match $pattern) { $at = $i; break } }
            if ($at -lt 0) { Write-Output "::error::missing evidence: $pattern"; $failed = $true }
            elseif ($at -le $last) { Write-Output "::error::out of order: $pattern"; $failed = $true }
            else { $last = $at }
          }
          # Module execution and CEF load notifications can be observed in either order.
          $marker = "console level=\d+ source=$o/game\.js:\d+ message=`"roves-ci-game-fixture module-ok same-origin=true`""
          $markerLine = $lines | Select-String -Pattern $marker | Select-Object -First 1
          $closeLine = $lines | Select-String -Pattern 'auto-close window' | Select-Object -First 1
          if (!$markerLine -or !$closeLine -or $markerLine.LineNumber -ge $closeLine.LineNumber) {
            Write-Output '::error::missing game module marker before auto-close'
            $failed = $true
          }
          if ($code -ne 0) { Write-Output "::error::game mode exit code $code (expected 0)"; $failed = $true }
          # The test-only minimize and click hooks must stay off without their flags.
          foreach ($pattern in @(' FAIL ', 'close requested by the OS', 'popup refused', 'test minimize', 'test click', 'test key', 'test wheel')) {
            $hit = $lines | Select-String -Pattern $pattern | Select-Object -First 1
            if ($hit) { Write-Output "::error::unexpected: $($hit.Line)"; $failed = $true }
          }
          $types = $children.Values | ForEach-Object { if ($_ -match '--type=([\w-]+)') { $Matches[1] } } | Sort-Object -Unique
          Write-Output "::notice::game mode CEF child types seen: $($types -join ', ')"
          if (-not ($types -contains 'renderer')) { Write-Output '::error::no renderer child observed'; $failed = $true }
          if ($children.Values | Where-Object { $_ -match '--no-sandbox' }) {
            Write-Output '::error::a CEF child process was launched with --no-sandbox'; $failed = $true
          }
          $closing = $lines | Select-String -Pattern 'closing imported=\d+ presented=\d+' | Select-Object -First 1
          Write-Output "::notice::game-mode loading gate only (no GPU frame or gameplay verification): $($closing.Line)"
          Start-Sleep -Seconds 3
          if (Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue) {
            Write-Output '::error::probe processes left running after the game-mode exit'; $failed = $true
          }
          if ($failed) { exit 1 }
      # Minimized-window suspension regression (same bundle). The test-only flag
      # --roves-test-minimize-ms=1000 makes the probe itself call SDL_MinimizeWindow 1 s after
      # load-end, hold 1.5 s and call SDL_RestoreWindow; the window manager reports both
      # transitions through ordinary SDL window events. Required, in log order: minimize
      # request, `frame work suspended reason=minimized`, the fixture's visibilitychange
      # marker `visibility=hidden` drained while suspended (CEF events kept flowing), the
      # restore request (issued from the deadline path on a suspended turn), `frame work
      # resumed` with suspended_ms >= 1500 and idle_ticks >= 20, cycle complete,
      # `visibility=visible`, auto-close and the clean close/shutdown lines; exit 0, no FAIL
      # line, no leftover process. Frames, presents, input and visuals are not required
      # (WARP); the `resume first-present` line is only reported.
      - name: run the probe in game mode (scripted minimize/restore, WARP)
        if: (success() || failure()) && steps.bundle.outcome == 'success'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cef-nr-suspend-run'
          $game = Join-Path $out 'game'
          New-Item -ItemType Directory -Force $game | Out-Null
          Set-Content -Encoding utf8 (Join-Path $game 'index.html') @'
          <!doctype html>
          <meta charset="utf-8">
          <title>roves ci lifecycle fixture</title>
          <script type="module" src="./game.js"></script>
          '@
          Set-Content -Encoding utf8 (Join-Path $game 'game.js') @'
          console.log(`roves-ci-lifecycle-fixture module-ok visibility=${document.visibilityState}`);
          document.addEventListener('visibilitychange', () => {
            console.log(`roves-ci-lifecycle-fixture visibility=${document.visibilityState}`);
          });
          '@
          if (Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue) {
            Write-Output '::notice::stopping processes left by the previous step before the suspension run'
            Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
          }
          $log = Join-Path $out 'roves-cef-nr-suspend.log'
          $exe = Join-Path $env:RUNNER_TEMP 'cef-nr-bundle\roves_cef_netrender_probe.exe'
          $arguments = @(
            "--roves-game-dir=$game", '--roves-compose=wgpu', '--roves-test-minimize-ms=1000',
            '--roves-auto-close-ms=8000', '--roves-timeout-ms=90000', "--roves-log=$log",
            "--roves-cache-dir=$(Join-Path $out 'cache')", "--log-file=$(Join-Path $out 'cef-debug.log')"
          )
          $proc = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          $null = $proc.Handle  # keep the handle so ExitCode is available after exit
          if (-not $proc.WaitForExit(150000)) {
            Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue | Stop-Process -Force
            if (Test-Path $log) { Get-Content $log }
            Write-Output '::error::the probe did not exit in time in the suspension run'
            exit 1
          }
          $code = $proc.ExitCode
          Get-Content $log
          $lines = @(Get-Content $log)
          $failed = $false
          $origin = ($lines | Select-String -Pattern 'game loopback origin=(http://127\.0\.0\.1:\d+) ' |
            Select-Object -First 1).Matches.Groups[1].Value
          if (-not $origin) { Write-Output '::error::missing evidence: game loopback origin'; exit 1 }
          $o = [regex]::Escape($origin)
          $marker = "console level=\d+ source=$o/game\.js:\d+ message=`"roves-ci-lifecycle-fixture"
          # Each pattern must match a line after the previous match (earlier occlusion-driven
          # visibility changes, if any, are skipped rather than taken as evidence).
          $last = -1
          $found = @{}
          foreach ($pattern in @(
              'producer created accelerated=true background=white',
              "load-end status=200 url=$o/ ok=true", 'auto-close scheduled delay_ms=8000',
              'test minimize requested ok=true hold_ms=1500',
              'frame work suspended reason=minimized phase=Game ',
              "$marker visibility=hidden`"",
              'test restore requested ok=true ',
              'frame work resumed reason=\w+ suspended_ms=(\d+) idle_ticks=(\d+) ',
              'test minimize cycle complete', "$marker visibility=visible`"",
              'auto-close window', 'closing imported=', 'browser closed',
              'producer and renderer dropped', 'cef shutdown complete', 'game loopback stopped',
              'exit code=0$')) {
            $at = -1
            for ($i = $last + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -match $pattern) { $at = $i; break } }
            if ($at -lt 0) { Write-Output "::error::missing or out of order: $pattern"; $failed = $true }
            else { $last = $at; $found[$pattern] = $lines[$at] }
          }
          $resumed = $found['frame work resumed reason=\w+ suspended_ms=(\d+) idle_ticks=(\d+) ']
          if ($resumed -match 'suspended_ms=(\d+) idle_ticks=(\d+)') {
            if ([int64]$Matches[1] -lt 1500) { Write-Output "::error::suspended for less than the 1500 ms hold: $resumed"; $failed = $true }
            if ([int64]$Matches[2] -lt 20) { Write-Output "::error::too few suspended loop turns: $resumed"; $failed = $true }
          }
          if (@($lines | Select-String -Pattern 'frame work suspended').Count -ne 1) {
            Write-Output '::error::expected exactly one suspension (the scripted one)'; $failed = $true
          }
          if ($code -ne 0) { Write-Output "::error::suspension run exit code $code (expected 0)"; $failed = $true }
          foreach ($pattern in @(' FAIL ', 'close requested by the OS', 'popup refused')) {
            $hit = $lines | Select-String -Pattern $pattern | Select-Object -First 1
            if ($hit) { Write-Output "::error::unexpected: $($hit.Line)"; $failed = $true }
          }
          Select-String -Path $log -Pattern 'frame work (suspended|resumed)|resume first-(present|import)|closing imported=' |
            ForEach-Object { Write-Output "::notice::$($_.Line)" }
          Write-Output '::notice::suspension gate: SDL minimize/restore lifecycle only (no GPU frame, present, input or visual verification)'
          Start-Sleep -Seconds 3
          if (Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue) {
            Write-Output '::error::probe processes left running after the suspension run'; $failed = $true
          }
          if ($failed) { exit 1 }
      # Synthetic mouse-click delivery regression (same bundle). The test-only flag
      # --roves-test-click-ms=1000 makes the probe push one left button down + up (SDL window
      # point 100,60, a sentinel mouse id) into the SDL queue with SDL_PushEvent 1 s after
      # load-end; the events come back through the loop's ordinary SDL poll -> Input ->
      # welding send_mouse_input path. The fixture's fixed 200x120 px button at the top-left
      # logs `roves-test-click-received ...` from its click handler. Required, in log order:
      # the module marker (listener installed) before the request, the request with
      # pushed=true, down and up forwarded ok=true, the click marker from <origin>/game.js
      # with trusted=true button=0 detail=1, marker received, click complete, auto-close and
      # the clean close/shutdown lines; exit 0, exactly one click marker, no FAIL line, no
      # leftover process. Fresh cache. Frames/presents are only reported (WARP). This is a
      # synthetic SDL event, not a physical mouse, and no gameplay or visual proof. Negative
      # checks first: the flag is refused without --roves-game-dir and together with
      # --roves-test-minimize-ms (usage error before the log opens, exit 1).
      - name: run the probe in game mode (synthetic click, WARP)
        if: (success() || failure()) && steps.bundle.outcome == 'success'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cef-nr-click-run'
          if (Test-Path -LiteralPath $out) {
            Write-Output "::error::synthetic-click output directory already exists: $out"
            exit 1
          }
          $game = Join-Path $out 'game'
          New-Item -ItemType Directory -Force $game | Out-Null
          Set-Content -Encoding utf8 (Join-Path $game 'index.html') @'
          <!doctype html>
          <meta charset="utf-8">
          <title>roves ci click fixture</title>
          <style>
            html, body { margin: 0; }
            #click-target { position: fixed; left: 0; top: 0; width: 200px; height: 120px;
                            margin: 0; border: 0; padding: 0; }
          </style>
          <button id="click-target" type="button">click target</button>
          <script type="module" src="./game.js"></script>
          '@
          Set-Content -Encoding utf8 (Join-Path $game 'game.js') @'
          document.getElementById('click-target').addEventListener('click', (e) => {
            console.log(`roves-test-click-received target=${e.target.id} trusted=${e.isTrusted} button=${e.button} detail=${e.detail} x=${e.clientX} y=${e.clientY}`);
          });
          console.log('roves-ci-click-fixture module-ok');
          '@
          if (Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue) {
            Write-Output '::notice::stopping processes left by the previous step before the click run'
            Get-Process roves_cef_netrender_probe -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
          }
          $exe = Join-Path $env:RUNNER_TEMP 'cef-nr-bundle\roves_cef_netrender_probe.exe'
          $failed = $false
          # Negative: refused usage (exit 1 before the evidence log is opened).
          $refused = @(
            @{ name = 'without game mode'; args = @('--roves-test-click-ms=1000') },
