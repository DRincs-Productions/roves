name: CEF -> wgpu-weld -> wgpu + SDL3 Linux feasibility gate

# Developer experiment only (support/cef-linux-gate/README.md). Builds the Linux gate (same
# pins as the Windows player and the macOS gate: vendored welding e991684 wgpu-29 row, CEF 154.0.34,
# wgpu 29.0.4, SDL3 0.20) on x86_64 and runs it twice under Xvfb with Chromium's sandbox on:
# once with the setuid layer 1 (chrome-sandbox root 4755, user namespaces restricted) and once
# with the user-namespace layer 1. Hard gates: compile, $ORIGIN run path, flat CEF layout,
# Vulkan adapter, CEF/SDL3 (X11) init, SDL3 presentation, sandboxed renderers (seccomp-BPF,
# NoNewPrivs, PID namespace, no --no-sandbox), clean shutdown, no leftover process.
# Hosted runners have no GPU and no /dev/dri: Vulkan is Mesa lavapipe (CPU), so the gate
# selects CEF's software output (OnPaint uploaded by the vendored welding, README "Software
# paint") and must pass with `evidence=software` (exit 0, fixture colour read back); that is
# never GPU-import evidence. Exit 2 (no frame) is an error on a CPU adapter. Separate from cef-netrender-probe.yml
# (Windows) and cef-macos-gate.yml (macOS), both unchanged. Never gates a release.
# The same gate directory then packages the UNMODIFIED production web build of
# DRincs-Productions/visual-novel-template (same pin and commands as the Windows and macOS
# packages) under game/ and runs it from the shared loopback server with the setuid layer 1
# (Ubuntu's default): accepted load-end, test close through SDL's quit event, OnBeforeClose,
# CEF shutdown, server stop; first with --roves-isolated-profile, then twice with the
# persistent per-install profile (same origin across launches) and under contention (README
# "Packaged game", "Saves and the player profile"). On the hosted runner (lavapipe) the game
# frames are CEF's software output: the packaged run must show and read back a multi-colour
# game frame with `evidence=software` (exit 0); GPU import needs a real GPU. Packaged runs
# require the startup screen released by the first game frame (README "Startup screen"). A
# second package built with the `steam` feature (README "Steam") ships libsteam_api.so next
# to the gate ($ORIGIN) and runs the host API fixture once under the pinned GSE emulator
# (App ID 480, offline; emulation, not the real Steam client).

on:
  push:
    paths:
      - 'support/cef-linux-gate/**'
      # Vendored welding (temporary fork, ROVES_PATCHES.md).
      - 'support/vendor/wgpu-weld/**'
      # Compiled into the gate through `#[path]` (packaged-game mode).
      - 'support/cef-window-probe/src/server.rs'
      - 'support/cef-window-probe/src/host_api.rs'
      # The Windows player's pure rules (origin, load status, profile name/files), `#[path]`.
      - 'support/cef-netrender-probe/src/game_rules.rs'
      # The macOS gate's profile glue (lock, stored origin port), `#[path]`.
      - 'support/cef-macos-gate/src/profile.rs'
      # The players' shared page input, page-marker registration (+ its marker script) and
      # window icon (`#[path]`), and the embedded Roves logo.
      - 'support/cef-netrender-probe/src/input.rs'
      - 'support/cef-netrender-probe/src/page_init.rs'
      - 'support/cef-netrender-probe/src/mcp_rules.rs'
      - 'support/cef-netrender-probe/src/icon_rules.rs'
      - 'support/cef-netrender-probe/src/window_icon.rs'
      - 'icon.png'
      # The macOS gate's session glue and key codes (`#[path]`).
      - 'support/cef-macos-gate/src/session.rs'
      - 'support/cef-macos-gate/src/keys.rs'
      - 'support/cef-macos-gate/src/key_rules.rs'
      # The player fixture (page marker, saves, input, audio).
      - 'support/cef-macos-gate/player-fixture/**'
      # Startup screen (the macOS gate's module, the Windows player's splash.rs branding,
      # build.rs wordmark and its font) and the `steam` feature (the macOS gate's Steamworks
      # lifetime and redistributable lookup, the Windows player's client and host API fixture).
      - 'support/cef-macos-gate/src/startup_screen.rs'
      - 'support/cef-macos-gate/src/player_steam.rs'
      - 'support/cef-macos-gate/src/steam_lib.rs'
      - 'support/cef-netrender-probe/src/splash.rs'
      - 'support/cef-netrender-probe/build_wordmark.rs'
      - 'resources/fonts/MetalMania-Regular.ttf'
      - 'support/cef-netrender-probe/src/steam.rs'
      - 'support/cef-netrender-probe/host-api-fixture/**'
      - '.github/workflows/cef-linux-gate.yml'
  workflow_dispatch:

concurrency:
  group: cef-linux-gate-${{ github.ref }}
  # A cancelled run is not a verified one (AGENTS.md CI rules): queue instead of cancelling.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # The repository root rust-toolchain.toml pins the engine toolchain; welding needs
      # 1.97.1+ and wgpu-weld e991684 uses 1.99.1, as the Windows player does.
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            support/cef-linux-gate
            support/vendor/wgpu-weld
            support/cef-window-probe/src
            support/cef-netrender-probe/src
            support/cef-macos-gate/src
            support/cef-macos-gate/player-fixture
            support/cef-netrender-probe/host-api-fixture
            resources/fonts
          sparse-checkout-cone-mode: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: system packages
        shell: bash
        run: |
          sudo apt-get update -q
          # Build: cef-dll-sys (CMake + Ninja for libcef_dll_wrapper), SDL3 from source with
          # its X11 and Wayland backends (Wayland is built so the gap is a runtime one).
          # Run: CEF 154 runtime libraries, Xvfb, Mesa Vulkan drivers (lavapipe on runners),
          # PulseAudio (+ pactl) as the sound server of the player fixture's audio check.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdrm-dev libgbm-dev libegl-dev libdbus-1-dev libudev-dev \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxcomposite1 \
            libxdamage1 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libxshmfence1 \
            xvfb xauth mesa-vulkan-drivers vulkan-tools util-linux             pulseaudio pulseaudio-utils
      - name: toolchain and host
        shell: bash
        run: |
          case "$(rustc --version)" in
            "rustc 1.99.1 "*) ;;
            *) echo "::error::expected rustc 1.99.1, got $(rustc --version)"; exit 1 ;;
          esac
          dri="$(ls /dev/dri 2>/dev/null | tr '\n' ' ')"
          echo "::notice::$(rustc --version) / $(. /etc/os-release; echo "$PRETTY_NAME") $(uname -r) / cmake $(cmake --version | head -1) / ninja $(ninja --version) / /dev/dri: ${dri:-none}"
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|deviceType|driverName' || echo "::warning::vulkaninfo found no device"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/gate-target" >> "$GITHUB_ENV"
          # CEF 154 distribution; also read at run time by the bundle binary.
          echo "CEF_PATH=$RUNNER_TEMP/cef154" >> "$GITHUB_ENV"
      - name: restore cargo and CEF cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/cef154
          key: cef-linux-gate-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('support/cef-linux-gate/Cargo.lock') }}
      - name: dependency graph evidence
        shell: bash
        working-directory: support/cef-linux-gate
        run: |
          tree() { cargo tree --locked --target x86_64-unknown-linux-gnu -e normal --prefix depth --depth 1 "$@"; }
          users29="$(tree -i wgpu@29.0.4 | grep '^1' | cut -d' ' -f1 | sed 's/^1//' | sort | tr '\n' ' ')"
          echo "::notice::wgpu 29.0.4 used by: $users29"
          for crate in grafting roves_cef_linux_gate welding; do
            echo " $users29" | grep -q " $crate " || { echo "::error::$crate is not on wgpu 29.0.4"; exit 1; }
          done
          # wgpu 30 may appear only under cef (accelerated_osr importer, never called).
          users30="$(tree -i wgpu@30.0.2 | grep '^1' | cut -d' ' -f1 | sed 's/^1//' | sort | tr '\n' ' ')"
          echo "::notice::wgpu 30.0.2 used by: $users30"
          test "$users30" = "cef " || { echo "::error::wgpu 30 reached by something other than cef"; exit 1; }
      - name: build (release)
        shell: bash
        working-directory: support/cef-linux-gate
        run: |
          cargo build --locked --release --bins 2>&1 | tee "$RUNNER_TEMP/gate-build.log"
          test "${PIPESTATUS[0]}" = 0
      - name: save cargo and CEF cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/cef154
          key: cef-linux-gate-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1-${{ hashFiles('support/cef-linux-gate/Cargo.lock') }}
      - name: bundle and check the layout
        id: bundle
        shell: bash
        run: |
          out="$RUNNER_TEMP/gate-app"
          "$CARGO_TARGET_DIR/release/bundle" "$out"
          gate="$out/roves-cef-linux-gate"
          test -x "$gate"
          for f in libcef.so chrome-sandbox icudtl.dat resources.pak v8_context_snapshot.bin locales/en-US.pak; do
            test -e "$out/$f" || { echo "::error::missing $f"; exit 1; }
          done
          # The zygote may be started through the setuid chrome-sandbox, which drops
          # LD_LIBRARY_PATH: libcef must resolve through the binary's own run path.
          readelf -d "$gate" | grep -E 'RUNPATH|RPATH' | grep -q '\$ORIGIN' \
            || { echo "::error::no \$ORIGIN run path"; exit 1; }
          ldd "$gate" | grep -q "libcef.so => $out/libcef.so" \
            || { ldd "$gate"; echo "::error::libcef.so not resolved next to the gate"; exit 1; }
          if ldd "$gate" | grep -q 'not found'; then ldd "$gate"; echo "::error::unresolved libraries"; exit 1; fi
          # The standard package is Steam-free (README "Steam").
          test ! -e "$out/libsteam_api.so" || { echo "::error::standard package contains libsteam_api.so"; exit 1; }
          if readelf -d "$gate" | grep -q libsteam_api; then echo "::error::standard executable needs libsteam_api"; exit 1; fi
          # Chromium's setuid layer 1 requires chrome-sandbox owned by root with mode 4755
          # (sandbox/linux/suid/client/setuid_sandbox_host.cc). This is root-only packaging,
          # done here on purpose; the gate itself never runs as root.
          sudo chown root:root "$out/chrome-sandbox"
          sudo chmod 4755 "$out/chrome-sandbox"
          stat -c '%U %a %n' "$out/chrome-sandbox"
          file "$gate"
          echo "GATE=$gate" >> "$GITHUB_ENV"
          echo "GATE_DIR=$out" >> "$GITHUB_ENV"
      - name: write the run script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/run-gate.sh" <<'EOF'
          #!/usr/bin/env bash
          # Usage: run-gate.sh <setuid|namespace>. Runs the gate once under Xvfb and checks its
          # verdict lines; the layer-1 expectation is enforced through the AppArmor sysctl.
          set -uo pipefail
          layer="$1"
          log="$RUNNER_TEMP/gate-run-$layer.log"
          key=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$key" ]; then
            case "$layer" in
              setuid) sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 ;;
              namespace) sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 ;;
            esac
          else
            echo "::warning::$key absent: layer-1 selection not enforced for the $layer run"
          fi
          # Hard stop above the gate's own 60 s timeout plus close.
          ROVES_GATE_TIMEOUT_SECS=60 timeout -k 10 150 \
            xvfb-run -a -s "-screen 0 1280x800x24" "$GATE" > "$log" 2>&1
          code=$?
          grep '^gate:' "$log" || true
          fail() { echo "::error::[$layer] $1"; exit 1; }
          need() { grep -q "$1" "$log" || fail "missing: $1"; }
          if grep -q '^gate: FAIL' "$log"; then
            grep '^gate: FAIL' "$log" | grep -q 'IMPLICIT_MODIFIER' \
              && echo "::error::[$layer] CEF gave an implicit DRM modifier; the wgpu-29 row cannot import it"
            fail "gate reported FAIL (exit $code)"
          fi
          need '^gate: mode=fixture$'
          # The startup screen is a packaged-game feature only (README "Startup screen").
          if grep -q -E '^gate: (startup |wordmark )' "$log"; then fail "fixture gate built a startup screen"; fi
          need '^gate: cef initialized sandbox=Sandboxed ozone=x11'
          need '^gate: sdl video driver=x11'
          need '^gate: adapter .*backend=Vulkan'
          need '^gate: producer created mode=\(AcceleratedPaint\|CpuPaint\)'
          cpu=0
          if grep -q '^gate: adapter .*type=Cpu' "$log"; then
            cpu=1
            # A CPU adapter (lavapipe) must take CEF's software output and show the fixture.
            need '^gate: paint path=Software("cpu-adapter") evidence=software$'
            need '^gate: producer created mode=CpuPaint'
            test "$code" = 0 || fail "software paint on the CPU adapter did not pass (exit $code)"
          fi
          need '^gate: loop end .*presented=[1-9]'
          need '^gate: PASS sandbox renderers='
          need '^gate: browser closed elapsed_ms='
          need '^gate: cef shutdown complete$'
          need "^gate: shutdown complete exit=$code"
          if [ -e "$key" ]; then
            need "^gate: host userns-probe=.* sandbox-layer1-expected=$layer"
          fi
          case "$code" in
            0)
              need '^gate: PASS pixel centre'
              if grep -q '^gate: PASS pixel .*evidence=gpu' "$log"; then
                echo "::notice::[$layer] accelerated DMA-BUF -> Vulkan import verified on a GPU adapter (exit 0)"
              else
                need '^gate: PASS pixel .*evidence=software'
                echo "::notice::[$layer] CEF software output (OnPaint -> Queue::write_texture) shown and colour-checked (exit 0, cpu=$cpu): software evidence only, not GPU-import evidence"
              fi ;;
            2)
              need '^gate: NO_FRAME'
              echo "::notice::[$layer] no frame on this runner (exit 2): build, sandbox, SDL3/Vulkan presentation and shutdown verified" ;;
            124|137)
              fail "hard timeout (exit $code)" ;;
            *)
              fail "unexpected exit $code" ;;
          esac
          # No process of this gate may outlive the browser process.
          sleep 2
          if pgrep -fl "roves-cef-linux-gate" ; then
            fail "gate processes still running after exit"
          fi
          # The packaged-game steps expect the same adapter outcome as this layer's fixture.
          echo "FIXTURE_CODE_$layer=$code" >> "$GITHUB_ENV"
          EOF
          chmod +x "$RUNNER_TEMP/run-gate.sh"
      - name: run the gate (sandboxed, setuid layer 1, X11)
        shell: bash
        run: '"$RUNNER_TEMP/run-gate.sh" setuid'
      - name: run the gate (sandboxed, user-namespace layer 1, X11)
        shell: bash
        run: '"$RUNNER_TEMP/run-gate.sh" namespace'
      # ── Packaged game (README "Packaged game") ──────────────────────────────────────
      # Same pinned commit and build commands as the Windows and macOS packages; dist/ is
      # copied byte for byte into game/ next to the gate executable.
      - name: checkout visual-novel-template (pinned)
        id: template
        if: (success() || failure()) && steps.bundle.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: DRincs-Productions/visual-novel-template
          ref: e88e9ac29e736e007904e0767815e21cd8725941
          path: visual-novel-template
          persist-credentials: false
      - name: setup node (template build)
        if: (success() || failure()) && steps.template.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: build visual-novel-template (npm ci + npm run build)
        id: template_build
        if: (success() || failure()) && steps.template.outcome == 'success'
        shell: bash
        working-directory: visual-novel-template
        run: |
          pin=e88e9ac29e736e007904e0767815e21cd8725941
          head="$(git rev-parse HEAD)"
          test "$head" = "$pin" || { echo "::error::template HEAD $head is not the pin $pin"; exit 1; }
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/vnt-npm-ci.log"
          test "${PIPESTATUS[0]}" = 0
          npm run build 2>&1 | tee "$RUNNER_TEMP/vnt-build.log"
          test "${PIPESTATUS[0]}" = 0
          test -f dist/index.html || { echo "::error::template build produced no dist/index.html"; exit 1; }
          {
            echo "template_commit=$head"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "package_lock_sha256=$(sha256sum package-lock.json | cut -d' ' -f1)"
            echo "dist_files=$(find dist -type f | wc -l | tr -d ' ')"
          } | tee "$RUNNER_TEMP/vnt-build-info.txt"
          echo "::notice::visual-novel-template $head built with node $(node --version): $(find dist -type f | wc -l | tr -d ' ') dist files"
      - name: package the game into the gate directory
        id: package
        if: (success() || failure()) && steps.template_build.outcome == 'success'
        shell: bash
        run: |
          game="$GATE_DIR/game"
          test ! -e "$game" || { echo "::error::$game already exists"; exit 1; }
          cp -a visual-novel-template/dist "$game"
          # Unmodified: identical file list and bytes.
          diff -r visual-novel-template/dist "$game" || { echo "::error::packaged game differs from dist"; exit 1; }
          (cd "$game" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/player-game-sha256.txt"
          echo "::notice::packaged $(wc -l < "$RUNNER_TEMP/player-game-sha256.txt" | tr -d ' ') game files into game/"
          # Packaged runs use the setuid layer 1, the Ubuntu 23.10+ default (user namespaces
          # restricted by AppArmor); the fixture already covered both layers.
          key=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$key" ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1; fi
      - name: run the packaged game (sandboxed, X11, loopback, isolated profile)
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: bash
        run: |
          log="$RUNNER_TEMP/player-run.log"
          set +e
          # Test-only: close through SDL's quit event 8 s after the first game frame (import
          # device) or after the accepted load-end (no import device), and write the last
          # imported frame as a BMP for the artifact.
          ROVES_GATE_TIMEOUT_SECS=60 ROVES_GATE_AUTO_CLOSE_MS=8000 \
            ROVES_GATE_FRAME_DUMP="$RUNNER_TEMP/player-last-frame.bmp" \
            timeout -k 10 150 xvfb-run -a -s "-screen 0 1280x800x24" \
            "$GATE" --roves-isolated-profile > "$log" 2>&1
          code=$?
          set -e
          grep '^gate:' "$log" | grep -v '^gate: console ' || true
          failed=0
          if grep -q '^gate: FAIL' "$log"; then echo "::error::player reported FAIL (exit $code)"; failed=1; fi
          origin="$(grep -m1 '^gate: mode=packaged-game dir=.*/game origin=' "$log" | grep -o -E 'http://127\.0\.0\.1:[0-9]+$' || true)"
          test -n "$origin" || { echo "::error::missing: packaged-game mode line with the loopback origin"; exit 1; }
          o="${origin//./\\.}"
          expected_code="${FIXTURE_CODE_setuid:-unknown}"
          test "$code" = "$expected_code" \
            || { echo "::error::player exit $code, expected the setuid fixture's exit $expected_code (same adapter)"; failed=1; }
          common=('^gate: player profile=isolated cache=' '^gate: cef initialized sandbox=Sandboxed ozone=x11 cache='
            '^gate: sdl video driver=x11$' '^gate: adapter .*backend=Vulkan'
            "^gate: producer created mode=(AcceleratedPaint|CpuPaint) size=[0-9]+x[0-9]+ url=about:blank profile=.*/game-profile elapsed_ms="
            '^gate: page markers registered identifier=.+ mcp=false$' "^gate: game navigation url=$o/$"
            "^gate: load-end status=200 url=$o/ ok=true$" '^gate: game loaded elapsed_ms=' '^gate: fresh frame requested ok=true$')
          tail_ok=('^gate: browser closed elapsed_ms=' '^gate: cef shutdown complete$' '^gate: loopback stopped$'
            '^gate: cache removed$' "^gate: shutdown complete exit=$code$" "^gate: exit code=$code$")
          case "$code" in
            0)
              expected=("${common[@]}" '^gate: startup screen released$'
                '^gate: first game frame after load-end ms=[0-9]+ size=[0-9]+x[0-9]+ format=(Bgra|Rgba)8UnormSrgb '
                '^gate: test auto-close scheduled delay_ms=8000 anchor=first-frame$' '^gate: test auto-close pushed SDL quit$'
                '^gate: loop end .* presented=[1-9][0-9]* loaded=true game_frame=true close=quit ' '^gate: close requested source=quit$'
                '^gate: last game frame size=' '^gate: frame dump written ' '^gate: PASS sandbox renderers='
                '^gate: PASS packaged game loaded, first frame shown, close requested evidence=(gpu|software)$'
                "${tail_ok[@]}")
              if grep -q '^gate: PASS packaged game .*evidence=gpu$' "$log"; then
                echo "::notice::packaged game frames imported and shown on a GPU adapter (exit 0)"
              else
                echo "::notice::packaged game frames shown from CEF's software output (exit 0, evidence=software): game graphics verified by readback, not GPU-import evidence"
              fi ;;
            2)
              expected=("${common[@]}" '^gate: PASS sandbox renderers=' '^gate: NO_FRAME' "${tail_ok[@]}")
              echo "::notice::no frame on this runner (exit 2): loopback load, sandbox and close verified; game graphics NOT verified" ;;
            *)
              expected=("${common[@]}" "${tail_ok[@]}")
              echo "::error::unexpected player exit $code"; failed=1 ;;
          esac
          # In order: each pattern must match a line after the previous match.
          last=0
          for pattern in "${expected[@]}"; do
            at="$(tail -n "+$((last + 1))" "$log" | grep -n -m1 -E -- "$pattern" | cut -d: -f1 || true)"
            if [ -z "$at" ]; then echo "::error::missing or out of order: $pattern"; failed=1; else last=$((last + at)); fi
          done
          # Startup screen branding (README "Startup screen"), built before the first present;
          # the window icon falls back to the embedded Roves logo (no icon.png in this package).
          for pattern in '^gate: startup logo decoded size=[0-9]+x[0-9]+$' '^gate: wordmark rendered size=[0-9]+x[0-9]+ font=MetalMania$' \
              '^gate: window icon source=(project|roves) .*set=true$'; do
            grep -q -E -- "$pattern" "$log" || { echo "::error::missing: $pattern"; failed=1; }
          done
          # The standard package has no Steam code: no Steam line at all.
          if grep -q '^gate: steam ' "$log"; then echo "::error::standard package logged $(grep -m1 '^gate: steam ' "$log")"; failed=1; fi
          # No remote-debugging/DevTools endpoint: the player must not rely on one.
          if grep -q 'DevTools listening' "$log"; then echo "::error::a DevTools endpoint was opened"; failed=1; fi
          if grep -q -E '^gate: player (profile root=|origin-port stored|profile kept)' "$log"; then
            echo "::error::the isolated launch touched a persistent profile"; failed=1
          fi
          cache="$(sed -n 's|^gate: cef initialized sandbox=Sandboxed ozone=x11 cache=||p' "$log" | head -1)"
          if [ -n "$cache" ] && [ -e "$cache" ]; then echo "::error::CEF cache left behind: $cache"; failed=1; fi
          if (exec 3<>"/dev/tcp/127.0.0.1/${origin##*:}") 2>/dev/null; then echo "::error::loopback port still accepting after exit"; failed=1; fi
          grep -E '^gate: (adapter|paint path|title|load-end|first (game|accelerated) frame|last game frame|console lines|browser closed|popup refused|NO_|PASS)' "$log" \
            | while read -r line; do echo "::notice::$line"; done || true
          sleep 2
          if pgrep -fl "roves-cef-linux-gate" ; then echo "::error::player processes still running after exit"; failed=1; fi
          test "$failed" = 0
      # Ordinary launch (no --roves-isolated-profile), README "Saves and the player profile":
      # the persistent profile under $XDG_CONFIG_HOME/Roves/Player/<name> and its stored origin
      # port. Two sequential launches from an unrelated working directory must use the same
      # profile and loopback origin (origin-keyed storage, so saves, survive) and keep the
      # profile with its CEF directories; a lock held by another process and the stored port
      # taken by another program must each end the run with exit 6 before CEF starts; a
      # damaged port file must give exit 1 instead of a new origin. Mirrors the macOS step.
      # Saves written by a real game across launches stay a manual check.
      - name: run the packaged game twice with the persistent profile, then under contention
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: bash
        run: |
          out="$RUNNER_TEMP/player-profile"
          test ! -e "$out" || { echo "::error::$out already exists"; exit 1; }
          mkdir -p "$out/unrelated-working-directory"
          # An explicit, absolute XDG_CONFIG_HOME: the player must honour it.
          export XDG_CONFIG_HOME="$out/xdg-config"
          base="$XDG_CONFIG_HOME/Roves/Player"
          if pgrep -fl "roves-cef-linux-gate"; then echo "::error::gate processes left by a previous step"; exit 1; fi
          failed=0
          expected_code="${FIXTURE_CODE_setuid:-unknown}"
          # run_player <name> <hard stop s>: sets $code; log in $out/<name>.log.
          run_player() {
            set +e
            (cd "$out/unrelated-working-directory" && ROVES_GATE_TIMEOUT_SECS=60 ROVES_GATE_AUTO_CLOSE_MS=3000 \
              timeout -k 10 "$2" xvfb-run -a -s "-screen 0 1280x800x24" "$GATE" > "$out/$1.log" 2>&1)
            code=$?
            set -e
            grep '^gate:' "$out/$1.log" | grep -v '^gate: console ' | sed "s/^/  [$1] /" || true
          }
          ordered() { # ordered <log> <label> <pattern>...: each after the previous match
            local log="$1" label="$2" last=0 at; shift 2
            for pattern in "$@"; do
              at="$(tail -n "+$((last + 1))" "$log" | grep -n -m1 -E -- "$pattern" | cut -d: -f1 || true)"
              if [ -z "$at" ]; then echo "::error::$label: missing or out of order: $pattern"; failed=1; else last=$((last + at)); fi
            done
          }
          absent() { # absent <log> <label> <pattern>...
            local log="$1" label="$2"; shift 2
            for pattern in "$@"; do
              if grep -q -E -- "$pattern" "$log"; then echo "::error::$label: unexpected $(grep -m1 -E -- "$pattern" "$log")"; failed=1; fi
            done
          }
          for name in first second; do
            run_player "$name" 150
            log="$out/$name.log"
            test "$code" = "$expected_code" \
              || { echo "::error::$name persistent launch: exit $code (expected the setuid fixture's $expected_code)"; failed=1; }
            ordered "$log" "$name" '^gate: player profile root=.+ lock=acquired origin-port=(new|[0-9]+)$' \
              '^gate: mode=packaged-game dir=.*/game origin=http://127\.0\.0\.1:[0-9]+$' \
              '^gate: player profile=persistent cache=.+/cef$' '^gate: cef initialized sandbox=Sandboxed ozone=x11 cache=.+/cef$' \
              '^gate: producer created mode=(AcceleratedPaint|CpuPaint) .* profile=.+/cef/game-profile elapsed_ms=' \
              '^gate: load-end status=(200|304) url=http://127\.0\.0\.1:[0-9]+/ ok=true$' \
              '^gate: browser closed elapsed_ms=' '^gate: cef shutdown complete$' '^gate: loopback stopped$' \
              '^gate: player profile kept root=' "^gate: shutdown complete exit=$code$" "^gate: exit code=$code$"
            absent "$log" "$name" '^gate: FAIL' '^gate: cache (not )?removed' 'DevTools listening'
            sleep 2
            if pgrep -fl "roves-cef-linux-gate"; then echo "::error::$name: processes still running after exit"; failed=1; fi
          done
          root="$(sed -n 's|^gate: player profile root=\(.*\) lock=acquired origin-port=new$|\1|p' "$out/first.log" | head -1)"
          o1="$(sed -n 's|^gate: mode=packaged-game dir=.* origin=||p' "$out/first.log" | head -1)"
          o2="$(sed -n 's|^gate: mode=packaged-game dir=.* origin=||p' "$out/second.log" | head -1)"
          port="${o1##*:}"
          echo "::notice::persistent origins: first=$o1 second=$o2 root=$root"
          if ! [[ "$root" =~ ^"$base"/roves-cef-linux-gate-[0-9a-f]{16}$ ]]; then
            echo "::error::first launch did not start a new profile at $base/roves-cef-linux-gate-<16 hex> (root '$root')"; failed=1
          fi
          if [ -z "$o1" ] || [ "$o1" != "$o2" ]; then echo "::error::the loopback origin changed between launches (saves would be lost)"; failed=1; fi
          grep -q -x -F "gate: player origin-port stored port=$port" "$out/first.log" \
            || { echo "::error::first launch did not store its origin port"; failed=1; }
          grep -q -x -F "gate: player profile root=$root lock=acquired origin-port=$port" "$out/second.log" \
            || { echo "::error::second launch did not reuse the stored profile and port"; failed=1; }
          if grep -q '^gate: player origin-port stored' "$out/second.log"; then echo "::error::second launch rewrote the origin port"; failed=1; fi
          if [ -n "$root" ] && [ -d "$root" ]; then
            stored="$(tr -d '[:space:]' < "$root/origin-port" 2>/dev/null || true)"
            test "$stored" = "$port" || { echo "::error::origin-port file holds '$stored', expected $port"; failed=1; }
            for dir in cef cef/game-profile; do
              test -d "$root/$dir" || { echo "::error::profile lacks $dir after exit"; failed=1; }
            done
            ls -A "$root" | while read -r entry; do echo "::notice::profile entry $entry"; done
            ls -A "$root/cef/game-profile" 2>/dev/null | while read -r entry; do echo "::notice::game-profile entry $entry"; done || true
          else
            echo "::error::profile root missing after exit: '$root'"; failed=1
          fi
          # Contention: each case must end before CEF starts.
          refused() { # refused <name> <expected exit> <pattern>...
            local name="$1" expected="$2"; shift 2
            run_player "$name" 60
            echo "::notice::$name: exit=$code"
            test "$code" = "$expected" || { echo "::error::$name: exit $code (expected $expected)"; failed=1; }
            ordered "$out/$name.log" "$name" "$@" "^gate: exit code=$expected$"
            absent "$out/$name.log" "$name" '^gate: cef initialized' '^gate: producer created'
          }
          if [ -n "$root" ] && [ -d "$root" ] && [ -n "$port" ]; then
            # flock(2), the call std's File::try_lock makes on Linux.
            perl -MFcntl=:flock -e '$| = 1; open(my $f, ">>", shift) or die "open: $!"; flock($f, LOCK_EX | LOCK_NB) or die "flock: $!"; print "locked\n"; sleep 60' \
              "$root/player.lock" > "$out/lock-holder.log" 2>&1 &
            holder=$!
            for _ in $(seq 50); do grep -q locked "$out/lock-holder.log" && break; sleep 0.2; done
            if grep -q locked "$out/lock-holder.log"; then
              refused busy-profile 6 '^gate: FAIL player profile busy root='
            else
              echo "::error::could not hold the profile lock: $(cat "$out/lock-holder.log")"; failed=1
            fi
            kill "$holder" 2>/dev/null || true; wait "$holder" 2>/dev/null || true
            perl -MIO::Socket::INET -e '$| = 1; my $socket = IO::Socket::INET->new(LocalAddr => "127.0.0.1", LocalPort => shift, Proto => "tcp", Listen => 1, ReuseAddr => 1) or die "listen: $!"; print "listening\n"; sleep 60' \
              "$port" > "$out/port-holder.log" 2>&1 &
            holder=$!
            for _ in $(seq 50); do grep -q listening "$out/port-holder.log" && break; sleep 0.2; done
            if grep -q listening "$out/port-holder.log"; then
              refused busy-port 6 "^gate: player profile root=.+ lock=acquired origin-port=$port$" "^gate: FAIL game loopback port busy port=$port "
            else
              echo "::error::could not hold port $port: $(cat "$out/port-holder.log")"; failed=1
            fi
            kill "$holder" 2>/dev/null || true; wait "$holder" 2>/dev/null || true
            printf 'not-a-port' > "$root/origin-port"
            refused damaged-port-file 1 '^gate: FAIL player profile root=.+ is damaged'
            printf '%s\n' "$port" > "$root/origin-port"
          else
            echo "::error::contention cases skipped: no profile root/origin"; failed=1
          fi
          sleep 2
          if pgrep -fl "roves-cef-linux-gate"; then echo "::error::gate processes still running"; failed=1; fi
          test "$failed" = 0
      # Player fixture (README "Player fixture"), the macOS step's Linux counterpart: the
      # packaged template is swapped for support/cef-macos-gate/player-fixture (restored
      # afterwards) and run once with a fresh persistent profile (own XDG_CONFIG_HOME) and the
      # test-only input hook ROVES_GATE_TEST_INPUT_MS=1000. Required: the window.__ROVES__
      # marker registered over welding's in-process DevTools channel before the game document,
      # a host API save written and read back, the project icon.png next to the executable on
      # the window, the document title, and one synthetic click, ArrowRight press and wheel
      # notch pushed into SDL's queue, forwarded through Input -> welding and reported by the
      # page as trusted DOM events (key=ArrowRight code=ArrowRight keyCode=39, no keypress;
      # wheel deltaY < 0). Audio: a PulseAudio daemon with a null sink stands in for the
      # desktop's sound server; the click starts a WebAudio oscillator, which must reach
      # Chromium's audio output as a PulseAudio sink input (pactl) with a running
      # AudioContext. Synthetic SDL events, not a physical mouse or keyboard; no audible check.
      - name: run the player fixture (page marker, saves, input, audio, persistent profile)
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: bash
        run: |
          out="$RUNNER_TEMP/player-fixture"
          game="$GATE_DIR/game"
          icon="$GATE_DIR/icon.png"
          test ! -e "$out" || { echo "::error::$out already exists"; exit 1; }
          test ! -e "$icon" || { echo "::error::$icon already exists"; exit 1; }
          mkdir -p "$out"
          export XDG_CONFIG_HOME="$out/xdg-config"
          # Sound server for the audio check: the session's own runtime directory, a null sink.
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$out/xdg-runtime}"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          pulseaudio --daemonize=yes --exit-idle-time=-1 --log-target=file:"$out/pulseaudio.log"
          for _ in $(seq 50); do pactl info > /dev/null 2>&1 && break; sleep 0.2; done
          pactl load-module module-null-sink sink_name=roves_ci > /dev/null
          pactl set-default-sink roves_ci
          echo "::notice::pulseaudio $(pactl info | sed -n 's/^Server Version: //p') default sink $(pactl get-default-sink)"
          mv "$game" "$out/template-game"
          restore() { rm -rf "$game" "$icon"; mv "$out/template-game" "$game"; pulseaudio --kill 2>/dev/null || true; }
          trap restore EXIT
          cp -a support/cef-macos-gate/player-fixture "$game"
          cp icon.png "$icon"
          log="$out/player-fixture.log"
          set +e
          (cd "$out" && ROVES_GATE_TIMEOUT_SECS=60 ROVES_GATE_AUTO_CLOSE_MS=6000 ROVES_GATE_TEST_INPUT_MS=1000 \
            timeout -k 10 150 xvfb-run -a -s "-screen 0 1280x800x24" "$GATE" > "$log" 2>&1) &
          player=$!
          # Chromium's audio output streams while the player runs (sampled twice a second).
          while kill -0 "$player" 2>/dev/null; do
            pactl list short sink-inputs >> "$out/sink-inputs.txt" 2>&1
            sleep 0.5
          done
          wait "$player"
          code=$?
          set -e
          grep '^gate:' "$log" || true
          failed=0
          expected_code="${FIXTURE_CODE_setuid:-unknown}"
          test "$code" = "$expected_code" \
            || { echo "::error::player fixture exit $code, expected the setuid fixture's exit $expected_code (same adapter)"; failed=1; }
          if grep -q '^gate: FAIL' "$log"; then echo "::error::player fixture reported FAIL"; failed=1; fi
          origin="$(sed -n 's|^gate: mode=packaged-game dir=.* origin=||p' "$log" | head -1)"
          test -n "$origin" || { echo "::error::missing: packaged-game mode line with the loopback origin"; exit 1; }
          o="${origin//./\\.}"
          src="^gate: console level=[0-9]+ source=$o/game\\.js:[0-9]+ message=\""
          ordered() { # ordered <label> <pattern>...: each after the previous match
            local label="$1" last=0 at; shift
            for pattern in "$@"; do
              at="$(tail -n "+$((last + 1))" "$log" | grep -n -m1 -E -- "$pattern" | cut -d: -f1 || true)"
              if [ -z "$at" ]; then echo "::error::$label: missing or out of order: $pattern"; failed=1; else last=$((last + at)); fi
            done
          }
          count() { # count <pattern> <want>
            local got; got="$(grep -c -E -- "$1" "$log" || true)"
            test "$got" = "$2" || { echo "::error::$got lines match $1 (expected $2)"; failed=1; }
          }
          ordered startup '^gate: window icon source=project size=1024x1024 set=true$' \
            '^gate: producer created mode=(AcceleratedPaint|CpuPaint) size=[0-9]+x[0-9]+ url=about:blank profile=.+/cef/game-profile elapsed_ms=' \
            '^gate: page markers registered identifier=.+ mcp=false$' "^gate: game navigation url=$o/$" \
            "^gate: load-end status=200 url=$o/ ok=true$" '^gate: game loaded elapsed_ms='
          # README "Startup screen": released by the first game frame (none on exit 2).
          if [ "$code" = 0 ]; then
            ordered startup-screen "^gate: load-end status=200 url=$o/ ok=true$" '^gate: startup screen released$' \
              '^gate: first game frame (after load-end|settled) '
          fi
          ordered marker "${src}roves-ci-marker available=true\"$" \
            "${src}roves-ci-save os_type=[a-z]+ available=true write=true read=hello-roves\"$"
          ordered title '^gate: title "roves ci player fixture"$'
          # The page's console line and the player's marker travel on different CEF IPC paths
          # (OnConsoleMessage vs. the page-marker channel), so each is ordered only after the
          # forwarded event, not against the other.
          up_click='^gate: test click forwarded event=up ok=true$'
          ordered click '^gate: test click requested x=100 y=60 pushed=true$' '^gate: test click forwarded event=down ok=true$' \
            "$up_click" '^gate: test click marker received$' '^gate: test click complete$'
          ordered click-page "$up_click" "${src}roves-test-click-received target=click-target trusted=true button=0 detail=1 "
          ordered key '^gate: test key requested key=Right pushed=true$' \
            '^gate: test key forwarded event=down ok=true raw=0x0000 usage=0x4F windows_key_code=0x27 native_key_code=0x0072$' \
            '^gate: test key forwarded event=up ok=true ' \
            '^gate: test key marker received kind=Down$' '^gate: test key marker received kind=Up$' '^gate: test key complete$'
          ordered key-page '^gate: test key forwarded event=down ok=true ' \
            "${src}roves-test-key-received type=keydown key=ArrowRight code=ArrowRight keyCode=39 repeat=false trusted=true " \
            "${src}roves-test-key-received type=keyup key=ArrowRight code=ArrowRight keyCode=39 repeat=false trusted=true "
          ordered wheel '^gate: test wheel requested pushed=true$' '^gate: test wheel forwarded ok=true delta=Some\(\(0, 120\)\)$' \
            '^gate: test wheel complete$'
          ordered wheel-page '^gate: test wheel forwarded ok=true ' \
            "${src}roves-test-wheel-received type=wheel deltaX=0 deltaY=-[0-9.e+-]+ deltaZ=0 deltaMode=[012] trusted=true "
          ordered audio "${src}roves-ci-audio state=running sampleRate=[0-9]+\"$" \
            "${src}roves-ci-audio later state=running currentTime=[0-9.]+\"$"
          ordered end '^gate: game input forwarded=[1-9][0-9]* rejected=0 ' '^gate: PASS test input click, key and wheel delivered$' \
            '^gate: browser closed elapsed_ms=' '^gate: cef shutdown complete$' "^gate: exit code=$code$"
          count 'roves-test-key-received type=keypress' 0
          count 'roves-test-click-received' 1
          count 'roves-test-wheel-received' 1
          if grep -q 'DevTools listening' "$log"; then echo "::error::a DevTools endpoint was opened"; failed=1; fi
          streams="$(grep -c -E '^[0-9]+[[:space:]]' "$out/sink-inputs.txt" 2>/dev/null || true)"
          if [ "${streams:-0}" -gt 0 ]; then
            echo "::notice::audio: Chromium output reached PulseAudio ($streams sink-input samples: $(grep -m1 -E '^[0-9]+[[:space:]]' "$out/sink-inputs.txt"))"
          else
            echo "::error::audio: no PulseAudio sink input while the player ran (Chromium produced no audio output stream)"; failed=1
          fi
          sleep 2
          if pgrep -fl "roves-cef-linux-gate"; then echo "::error::player fixture processes still running after exit"; failed=1; fi
          test "$failed" = 0
      # `steam` feature (README "Steam"): the same crate rebuilt with --features steam in the
      # same target directory (only the gate crate recompiles; the standard package above is
      # already laid out and stays Steam-free) and bundled into its own directory with the same
      # packaged template. bundle copies steamworks-sys's libsteam_api.so next to the
      # executable, where the $ORIGIN run path resolves it (also for the zygote and the other
      # CEF subprocesses, which re-execute the same binary; chrome-sandbox is CEF's own
      # setuid helper and must not depend on it).
      - name: build and bundle the Steam variant (release, --features steam)
        id: steam_bundle
        if: (success() || failure()) && steps.package.outcome == 'success'
        shell: bash
        run: |
          (cd support/cef-linux-gate && cargo build --locked --release --bins --features steam) 2>&1 \
            | tee "$RUNNER_TEMP/gate-steam-build.log"
          test "${PIPESTATUS[0]}" = 0
          out="$RUNNER_TEMP/gate-app-steam"
          "$CARGO_TARGET_DIR/release/bundle" "$out" 2>&1 | tee -a "$RUNNER_TEMP/gate-steam-build.log"
          test "${PIPESTATUS[0]}" = 0
          gate="$out/roves-cef-linux-gate"
          test -x "$gate" || { echo "::error::Steam package has no gate executable"; exit 1; }
          test -f "$out/libsteam_api.so" || { echo "::error::Steam package lacks libsteam_api.so"; exit 1; }
          real="$(find "$CARGO_TARGET_DIR/release/build" -path '*steamworks-sys-*/out/libsteam_api.so' | head -1)"
          cmp -s "$real" "$out/libsteam_api.so" || { echo "::error::packaged libsteam_api.so is not steamworks-sys's redistributable"; exit 1; }
          readelf -d "$gate" | grep NEEDED | grep -q -F '[libsteam_api.so]' \
            || { readelf -d "$gate" | grep NEEDED; echo "::error::gate does not need libsteam_api.so"; exit 1; }
          readelf -d "$gate" | grep -E 'RUNPATH|RPATH' | grep -q '\$ORIGIN' || { echo "::error::no \$ORIGIN run path"; exit 1; }
          ldd "$gate" | grep -q "libsteam_api.so => $out/libsteam_api.so" \
            || { ldd "$gate"; echo "::error::libsteam_api.so not resolved next to the gate"; exit 1; }
          ldd "$gate" | grep -q "libcef.so => $out/libcef.so" || { ldd "$gate"; echo "::error::libcef.so not resolved next to the gate"; exit 1; }
          if ldd "$gate" | grep -q 'not found'; then ldd "$gate"; echo "::error::unresolved libraries"; exit 1; fi
          if readelf -d "$out/chrome-sandbox" | grep -q libsteam_api; then echo "::error::chrome-sandbox depends on libsteam_api"; exit 1; fi
          echo "::notice::Steam package: $(ldd "$gate" | grep libsteam_api | sed 's/^[[:space:]]*//'); chrome-sandbox does not need it"
          sudo chown root:root "$out/chrome-sandbox"
          sudo chmod 4755 "$out/chrome-sandbox"
          # The same packaged template as the standard package.
          cp -a "$GATE_DIR/game" "$out/game"
          diff -r "$GATE_DIR/game" "$out/game" || { echo "::error::Steam package game differs from the standard package"; exit 1; }
          echo "STEAM_GATE=$gate" >> "$GITHUB_ENV"
          echo "STEAM_GATE_DIR=$out" >> "$GITHUB_ENV"
      # Steam variant under EMULATION, never evidence about the real Steam client (the Windows
      # player's step in cef-netrender-probe.yml): the pinned, SHA-256-checked Goldberg/GSE
      # Linux release (gbe_fork, LGPL-3.0; same tag, asset and digest as steamworks-gate.yml's
      # emulation job) replaces libsteam_api.so offline with Valve's public test App ID 480.
      # The Steam package is changed in place for one launch and restored afterwards (the
      # uploaded package keeps the redistributable and the template): the game is
      # support/cef-netrender-probe/host-api-fixture with a fresh persistent profile (saves
      # need it), which calls steam is_available -> true, get_app_id -> 480,
      # unlock/is_unlocked ACH_WIN_ONE_GAME, set/get stat NumGames, store_stats (ids declared
      # in the emulator's steam_settings), writes a save, then core/exit. Steamworks must shut
      # down before CEF. Setuid layer 1, as the other packaged runs.
      - name: Steam variant under the GSE emulator (emulation, lavapipe)
        if: (success() || failure()) && steps.steam_bundle.outcome == 'success'
        shell: bash
        env:
          GSE_TAG: release-2026_09_27
          GSE_ASSET: emu-linux-release.tar.bz2
          GSE_SHA256: f3e08366fb8052e55d9ca29ef5bb1f80afb66d59e96879e5900aac8a6d86c7b9
        run: |
          out="$RUNNER_TEMP/steam-emulation"
          pkg="$STEAM_GATE_DIR"
          test ! -e "$out" || { echo "::error::$out already exists"; exit 1; }
          mkdir -p "$out/gse" "$out/home" "$out/xdg-config"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$out/gse.tar.bz2" \
            "https://github.com/Detanup01/gbe_fork/releases/download/$GSE_TAG/$GSE_ASSET"
          echo "$GSE_SHA256  $out/gse.tar.bz2" | sha256sum -c -
          tar xjf "$out/gse.tar.bz2" -C "$out/gse"
          emu="$(find "$out/gse" -path '*regular*' -path '*x64*' -name libsteam_api.so | head -1)"
          gen="$(find "$out/gse" -name 'generate_interfaces*x64*' -type f | head -1)"
          test -n "$emu" || { echo "::error::emulator libsteam_api.so (regular/x64) not found in $GSE_ASSET"; find "$out/gse" -maxdepth 4; exit 1; }
          test -n "$gen" || { echo "::error::generate_interfaces x64 not found in $GSE_ASSET"; find "$out/gse" -maxdepth 4; exit 1; }
          real="$out/libsteam_api.redistributable.so"
          cp "$pkg/libsteam_api.so" "$real"
          # steam_interfaces.txt from the redistributable the gate links (steamworks-sys 0.13.0).
          work="$out/interfaces"
          mkdir -p "$work"
          cp "$real" "$work/libsteam_api.so"
          cp "$gen" "$work/generate_interfaces"
          chmod +x "$work/generate_interfaces"
          ( cd "$work" && ./generate_interfaces libsteam_api.so ) > /dev/null
          test -s "$work/steam_interfaces.txt" || { echo "::error::steam_interfaces.txt not generated"; ls -la "$work"; exit 1; }
          # One launch on a throw-away state of the Steam package, restored on exit.
          game="$pkg/game"
          settings="$pkg/steam_settings"
          mv "$game" "$out/template-game"
          restore() {
            rm -rf "$game" "$settings" "$pkg/steam_appid.txt"
            mv "$out/template-game" "$game"
            cp "$real" "$pkg/libsteam_api.so"
          }
          trap restore EXIT
          cp -a support/cef-netrender-probe/host-api-fixture "$game"
          mkdir -p "$settings"
          cp "$work/steam_interfaces.txt" "$settings/"
          # Valve's public test app: next to the executable (the player's dev convention) and
          # in steam_settings (the emulator's). The emulator stays offline.
          printf '480' > "$pkg/steam_appid.txt"
          printf '480' > "$settings/steam_appid.txt"
          printf '[main::connectivity]\ndisable_networking=1\n' > "$settings/configs.main.ini"
          printf '%s\n' '[{"name":"ACH_WIN_ONE_GAME","displayName":"Winner","description":"CI","hidden":"0","icon":"","icongray":""}]' > "$settings/achievements.json"
          printf '%s\n' '[{"name":"NumGames","type":"int","default":"0","global":"0"}]' > "$settings/stats.json"
          cp "$emu" "$pkg/libsteam_api.so"
          if cmp -s "$real" "$pkg/libsteam_api.so"; then echo "::error::emulator equals the redistributable"; exit 1; fi
          echo "::notice::emulation package: GSE $GSE_TAG regular/x64 libsteam_api.so $(sha256sum "$emu" | cut -c1-16); redistributable $(sha256sum "$real" | cut -c1-16)"
          ldd "$STEAM_GATE" | grep libsteam_api
          if pgrep -fl "roves-cef-linux-gate"; then echo "::error::gate processes left by a previous step"; exit 1; fi
          log="$out/steam-emulation.log"
          set +e
          # The fixture closes itself (core/exit) about 1.5 s after its load; the 30 s
          # auto-close after the first game frame is only a backstop.
          (cd "$out" && HOME="$out/home" XDG_CONFIG_HOME="$out/xdg-config" ROVES_GATE_TIMEOUT_SECS=60 \
            ROVES_GATE_AUTO_CLOSE_MS=30000 timeout -k 10 150 xvfb-run -a -s "-screen 0 1280x800x24" \
            "$STEAM_GATE" > "$log" 2>&1)
          code=$?
          set -e
          grep '^gate:' "$log" || true
          failed=0
          # Closing by the game needs a first game frame (0 with software frames on lavapipe).
          test "$code" = 0 || { echo "::error::steam emulation run: exit $code (expected 0)"; failed=1; }
          origin="$(sed -n 's|^gate: mode=packaged-game dir=.* origin=||p' "$log" | head -1)"
          test -n "$origin" || { echo "::error::missing: packaged-game mode line with the loopback origin"; exit 1; }
          o="${origin//./\\.}"
          src="^gate: console level=[0-9]+ source=$o/main\\.js:[0-9]+ message=\""
          last=0
          for pattern in '^gate: steam initialized app_id=480$' "^gate: mode=packaged-game dir=.*/game origin=$o$" \
              '^gate: player profile=persistent cache=' '^gate: cef initialized sandbox=Sandboxed ozone=x11 cache=' \
              "^gate: load-end status=200 url=$o/ ok=true$" '^gate: startup screen released$' \
              '^gate: close requested by the game command=exit$' '^gate: browser closed elapsed_ms=' \
              '^gate: steam shutdown complete$' '^gate: cef shutdown complete$' '^gate: loopback stopped$' \
              "^gate: exit code=$code$"; do
            at="$(tail -n "+$((last + 1))" "$log" | grep -n -m1 -E -- "$pattern" | cut -d: -f1 || true)"
            if [ -z "$at" ]; then echo "::error::steam emulation run: missing or out of order: $pattern"; failed=1; else last=$((last + at)); fi
          done
          # Console lines travel on their own CEF IPC path: required, not ordered.
          for pattern in "${src}roves-host-api steam available=true app_id=480 unlock=true unlocked=true set=true stat=3 store=true\"$" \
              "${src}roves-host-api phase=1 write=true read=hello-roves\"$"; do
            grep -q -E -- "$pattern" "$log" || { echo "::error::steam emulation run: missing $pattern"; failed=1; }
          done
          for pattern in '^gate: FAIL' '^gate: steam unavailable' 'roves-host-api (error|marker missing|saves unavailable)' \
              'violates the following Content Security Policy' 'DevTools listening'; do
            if grep -q -E -- "$pattern" "$log"; then echo "::error::steam emulation run: unexpected $(grep -m1 -E -- "$pattern" "$log")"; failed=1; fi
          done
          sleep 2
          if pgrep -fl "roves-cef-linux-gate"; then echo "::error::steam emulation processes still running after exit"; failed=1; fi
          if [ "$failed" = 0 ]; then
            echo "::notice::Steam host API verified under EMULATION (GSE $GSE_TAG, App ID 480), not against the real Steam client"
          fi
          test "$failed" = 0
      - name: archive the gate directory
        if: always() && env.GATE_DIR != ''
        shell: bash
        # tar keeps the modes; extracting as a normal user drops the root owner and the setuid
        # bit of chrome-sandbox, which must be re-applied (README "Running elsewhere").
        run: tar -C "$GATE_DIR/.." -czf "$RUNNER_TEMP/roves-cef-linux-gate-x64.tar.gz" "$(basename "$GATE_DIR")"
      - name: archive the Steam package
        if: always() && env.STEAM_GATE_DIR != ''
        shell: bash
        run: tar -C "$STEAM_GATE_DIR/.." -czf "$RUNNER_TEMP/roves-cef-linux-gate-x64-steam.tar.gz" "$(basename "$STEAM_GATE_DIR")"
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-linux-gate-logs
          path: |
            ${{ runner.temp }}/gate-build.log
            ${{ runner.temp }}/gate-run-*.log
            ${{ runner.temp }}/gate-steam-build.log
            ${{ runner.temp }}/steam-emulation/steam-emulation.log
            ${{ runner.temp }}/player-run.log
            ${{ runner.temp }}/player-profile/*.log
            ${{ runner.temp }}/player-fixture/*.log
            ${{ runner.temp }}/player-fixture/sink-inputs.txt
            ${{ runner.temp }}/player-last-frame.bmp
            ${{ runner.temp }}/player-game-sha256.txt
            ${{ runner.temp }}/vnt-build-info.txt
            ${{ runner.temp }}/vnt-npm-ci.log
            ${{ runner.temp }}/vnt-build.log
          if-no-files-found: warn
      # Contains the packaged game when the packaging step ran (the gate then plays it;
      # without game/index.html it runs the fixture gate).
      - name: upload the gate directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-linux-gate-x64
          path: ${{ runner.temp }}/roves-cef-linux-gate-x64.tar.gz
          if-no-files-found: warn
      # The `steam` feature's package (libsteam_api.so next to the gate, same packaged game).
      - name: upload the Steam package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-linux-gate-x64-steam
          path: ${{ runner.temp }}/roves-cef-linux-gate-x64-steam.tar.gz
          if-no-files-found: warn
