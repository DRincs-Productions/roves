name: Validate Agent Skills

on:
  push:
    tags: ["**"]
  schedule:
    - cron: "0 0 */14 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills.sh installable skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Repository-side checks (the repository is a Rust project: no package.json, plain Python
      # from the runner): every skills/<folder>/SKILL.md has a name and a description, names are
      # unique, and skills/categories.json maps exactly those names to their folders.
      - name: Validate the skills folder
        shell: python3 {0}
        run: |
          import json, pathlib, re, sys
          root = pathlib.Path("skills")
          found = {}
          for skill in sorted(root.glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              head = re.match(r"^---\r?\n(.*?)\r?\n---\r?\n", text, re.S)
              if not head:
                  sys.exit(f"{skill}: no frontmatter")
              fields = dict(re.findall(r"^(name|description):\s*(.+)$", head.group(1), re.M))
              name = fields.get("name", "").strip().strip("'\"")
              if not name or not fields.get("description", "").strip():
                  sys.exit(f"{skill}: name and description are required")
              if name in found:
                  sys.exit(f"{skill}: duplicate name {name} (also {found[name]})")
              found[name] = skill.parent.name
          categories = json.loads((root / "categories.json").read_text(encoding="utf-8"))
          if categories != found:
              sys.exit(f"skills/categories.json {categories} does not match skills/ {found}")
          print("skills:", found)
      - name: Check skills.sh discovery
        run: npx --yes skills@latest add "$GITHUB_REPOSITORY@latest" --skill '*' --agent codex -g --list -y
      - name: Check global installation
        shell: bash
        run: |
          set -euo pipefail
          temp_home="$(mktemp -d)"
          trap 'rm -rf "$temp_home"' EXIT
          HOME="$temp_home" USERPROFILE="$temp_home" npx --yes skills@latest add "$GITHUB_REPOSITORY@latest" --skill '*' --agent codex -g --copy -y
          for skill_file in skills/*/SKILL.md; do
            skill="$(sed -n 's/^name: *//p' "$skill_file" | head -n 1 | tr -d '\"' | tr -d "'")"
            test -n "$skill"
            test -f "$temp_home/.agents/skills/$skill/SKILL.md"
          done
      - name: Check Claude Code global installation
        shell: bash
        run: |
          set -euo pipefail
          temp_home="$(mktemp -d)"
          trap 'rm -rf "$temp_home"' EXIT
          HOME="$temp_home" USERPROFILE="$temp_home" npx --yes skills@latest add "$GITHUB_REPOSITORY@latest" --skill '*' --agent claude-code -g --copy -y
          for skill_file in skills/*/SKILL.md; do
            skill="$(sed -n 's/^name: *//p' "$skill_file" | head -n 1 | tr -d '\"' | tr -d "'")"
            test -n "$skill"
            find "$temp_home" -type f -path "*/$skill/SKILL.md" -print -quit | grep -q .
          done
      - name: Check all agents project installation
        shell: bash
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          mkdir -p "$temp_root/home" "$temp_root/project"
          cd "$temp_root/project"
          HOME="$temp_root/home" USERPROFILE="$temp_root/home" npx --yes skills@latest add "$GITHUB_REPOSITORY@latest" --all -y --copy
          for skill_file in "$GITHUB_WORKSPACE"/skills/*/SKILL.md; do
            skill="$(sed -n 's/^name: *//p' "$skill_file" | head -n 1 | tr -d '\"' | tr -d "'")"
            test -n "$skill"
            test -f "$temp_root/project/.agents/skills/$skill/SKILL.md"
          done