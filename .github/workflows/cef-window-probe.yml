name: 'Test: CEF window probe (stage 1)'

# Developer experiment only (support/cef-window-probe/README.md): builds the isolated
# Windows CEF window probe with the pinned cef-rs/CEF release, opens the unmodified
# visual-novel-template production build from a loopback origin with a per-run profile,
# closes the window through the normal close path and checks the evidence log. It does not
# build the engine, change any pin, publish anything or gate a release. Runs only when the
# probe or this file changes, or on manual dispatch.

on:
  push:
    # Branches only: path filters are ignored on tag pushes, so a release tag would run it.
    branches: ['**']
    paths:
      - 'support/cef-window-probe/**'
      - '.github/workflows/cef-window-probe.yml'
  workflow_dispatch:
    inputs:
      template_ref:
        description: 'visual-novel-template commit or branch (empty: default branch)'
        required: false
        default: ''

concurrency:
  group: cef-window-probe-${{ github.ref }}
  # A cancelled run is not a verified one (AGENTS.md CI rules): queue instead of cancelling.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: set CEF build directories
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'cef-probe-target')" >> $env:GITHUB_ENV
          "CEF_PATH=$(Join-Path $env:RUNNER_TEMP 'cef')" >> $env:GITHUB_ENV
      - name: restore cargo and CEF cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}\cef
          key: cef-window-probe-${{ runner.os }}-rust-1.95.0-${{ hashFiles('support/cef-window-probe/Cargo.lock') }}
      # Same official layout as cef-rs' bundle-cef-app: CEF's bootstrap.exe renamed
      # roves_cef_probe.exe, roves_cef_probe.dll (our cdylib), manifest and CEF runtime.
      - name: build and bundle (release, sandbox)
        shell: bash
        working-directory: support/cef-window-probe
        run: |
          cargo run --locked --release --bin bundle -- "$RUNNER_TEMP/cef-bundle" --release \
            2>&1 | tee "$RUNNER_TEMP/cef-build.log"
          test -f "$RUNNER_TEMP/cef-bundle/roves_cef_probe.exe"
          test -f "$RUNNER_TEMP/cef-bundle/roves_cef_probe.dll"
          test -f "$RUNNER_TEMP/cef-bundle/libcef.dll"
      - name: save cargo and CEF cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ runner.temp }}\cef
          key: cef-window-probe-${{ runner.os }}-rust-1.95.0-${{ hashFiles('support/cef-window-probe/Cargo.lock') }}
      - name: checkout visual-novel-template
        uses: actions/checkout@v4
        with:
          repository: DRincs-Productions/visual-novel-template
          ref: ${{ inputs.template_ref }}
          path: visual-novel-template
      - name: build visual-novel-template
        working-directory: visual-novel-template
        shell: bash
        run: |
          echo "::notice::visual-novel-template $(git rev-parse HEAD)"
          npm install
          npm run build
      # Acceptance: window shown, main document 200 from the loopback origin, no child
      # launched with --no-sandbox, close via the window's own close path, message loop
      # exit, CEF shutdown, loopback stopped, exit code 0, profile persisted on disk and no
      # probe process left behind. The screenshot is taken while the game is on screen.
      - name: run the probe on the unmodified template
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cef-run'
          New-Item -ItemType Directory -Force $out | Out-Null
          $log = Join-Path $out 'roves-cef.log'
          $profileDir = Join-Path $out 'profile'
          $exe = Join-Path $env:RUNNER_TEMP 'cef-bundle\roves_cef_probe.exe'
          $game = (Resolve-Path 'visual-novel-template/dist').Path
          $arguments = @(
            "--roves-game-dir=$game", "--roves-profile-dir=$profileDir", "--roves-log=$log",
            '--roves-auto-close-ms=10000', "--log-file=$(Join-Path $out 'cef-debug.log')"
          )
          $proc = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          $null = $proc.Handle  # keep the handle so ExitCode is available after exit
          $deadline = (Get-Date).AddSeconds(120)
          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'auto-close scheduled' -Quiet)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $proc.HasExited) {
            Start-Sleep -Seconds 5
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $out 'window.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          }
          if (-not $proc.WaitForExit(90000)) {
            Get-Process roves_cef_probe -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Output '::error::the probe did not exit after the automatic close'
            exit 1
          }
          $code = $proc.ExitCode
          Get-Content $log
          $failed = $false
          if ($code -ne 0) { Write-Output "::error::probe exit code $code"; $failed = $true }
          foreach ($pattern in @(
              'sandbox-info present=true', 'loopback origin=http://127\.0\.0\.1:', 'window shown',
              'load-end main-frame status=200 url=http://127\.0\.0\.1:\d+/ ok=true',
              'child-launch type=renderer no-sandbox=false', 'auto-close window',
              'browser before-close', 'message-loop exited', 'cef shutdown complete',
              'loopback stopped', 'exit code=0')) {
            if (-not (Select-String -Path $log -Pattern $pattern -Quiet)) {
              Write-Output "::error::missing evidence: $pattern"; $failed = $true
            }
          }
          if (Select-String -Path $log -Pattern 'no-sandbox=true' -Quiet) {
            Write-Output '::error::a child process was launched with --no-sandbox'; $failed = $true
          }
          if (-not (Test-Path (Join-Path $profileDir 'Local State'))) {
            Write-Output '::error::the per-run profile was not persisted'; $failed = $true
          }
          Start-Sleep -Seconds 3
          if (Get-Process roves_cef_probe -ErrorAction SilentlyContinue) {
            Write-Output '::error::probe processes left running after exit'; $failed = $true
          }
          Select-String -Path $log -Pattern 'console level=[34]' | ForEach-Object { Write-Output "::notice::$($_.Line)" }
          if ($failed) { exit 1 }
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-window-probe-evidence
          path: |
            ${{ runner.temp }}/cef-run/roves-cef.log
            ${{ runner.temp }}/cef-run/cef-debug.log
            ${{ runner.temp }}/cef-run/window.png
            ${{ runner.temp }}/cef-build.log
          retention-days: 14
          if-no-files-found: warn
      - name: upload bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cef-window-probe-windows-x64
          path: ${{ runner.temp }}/cef-bundle
          retention-days: 7
          if-no-files-found: error
