name: Netrender window renderer (opt-in probe build)

# Isolated, informational check of the opt-in Netrender window renderer of the
# Blitz/V8 probe (support/blitz-v8-probe/netrender-window/Cargo.toml, feature
# `netrender`, src/netrender_window.rs). It builds only that separate manifest:
# the default probe graph, its renderer (still the fallback), the engine and
# every release are untouched and not gated by this workflow.
#
# Patched graph, reused from the shared-device proof (no fork, no tracking
# diff): wgpu 29.0.4 / wgpu-core 29.0.1 from crates.io plus
# support/netrender-shared-device-proof/upstream/wgpu-29-core-interop.patch
# (prepare-patched.sh), Netrender d2f13ca5 as published (negative) and with
# upstream/netrender-d2f13ca5-external-texture-order.patch (positive).
#
# windows-test: builds the opt-in executable and runs its headless unit tests
#   (Blitz scene translation, presentation bookkeeping). No window run: WARP,
#   the runner's only adapter, crashes inside Vello's compute frame
#   (support/netrender-shared-device-proof/README.md, "WARP").
# linux-lavapipe-window: first Linux build of the probe; runs the window
#   fixture (fixtures/netrender-window) under Xvfb on Mesa lavapipe, negative
#   and positive, gated by netrender-window/check_log.py.
'on':
  push:
    paths:
      - 'support/blitz-v8-probe/netrender-window/**'
      - 'support/blitz-v8-probe/src/netrender_window.rs'
      - 'support/blitz-v8-probe/fixtures/netrender-window/**'
      - 'support/netrender-shared-device-proof/src/lib.rs'
      - 'support/netrender-shared-device-proof/prepare-patched.sh'
      - 'support/netrender-shared-device-proof/upstream/**'
      - '.github/workflows/netrender-window.yml'
  workflow_dispatch:

concurrency:
  group: netrender-window-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANIFEST: support/blitz-v8-probe/netrender-window/Cargo.toml
  RUST_BACKTRACE: '1'

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Same neutral CARGO_HOME as blitz-probe.yml (deno_core reads extension
      # JS from the registry paths at run time).
      CARGO_HOME: C:/roves-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/../netrender-window-target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: support/blitz-v8-probe/js/package-lock.json
      - name: bundle the probe scenarios (include_str! inputs)
        working-directory: support/blitz-v8-probe/js
        run: npm ci && npm run build
      - name: restore Cargo and build cache
        uses: actions/cache@v4
        with:
          path: |
            C:/roves-cargo/registry/index
            C:/roves-cargo/registry/cache
            C:/roves-cargo/git/db
            ${{ github.workspace }}/../netrender-window-target
          key: netrender-window-windows-rust-1.95.0-${{ hashFiles('support/blitz-v8-probe/netrender-window/Cargo.lock', 'support/netrender-shared-device-proof/prepare-patched.sh', 'support/netrender-shared-device-proof/upstream/*.patch') }}
      - name: prepare the patched wgpu tree (proof's script)
        run: sh support/netrender-shared-device-proof/prepare-patched.sh
      - name: headless unit tests of the opt-in build
        run: |
          mkdir -p "$RUNNER_TEMP/netrender-window"
          bash support/netrender-shared-device-proof/ci/cargo-retry.sh "$RUNNER_TEMP/netrender-window/test.log" \
            test --locked --manifest-path "$MANIFEST" -- netrender_window:: presentation::
      - name: upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: netrender-window-windows-test
          path: ${{ runner.temp }}/netrender-window
          if-no-files-found: warn
          retention-days: 14

  linux-lavapipe-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_HOME: /home/runner/roves-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/../netrender-window-target
      DENO_WEBGPU_BACKEND: vulkan
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Lavapipe only, exactly as netrender-proof.yml (see its comments).
      - name: install lavapipe, Xvfb and the probe's Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools \
            xvfb libasound2-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 \
            libxcursor1 libxi6 libxrandr2 libwayland-dev pkg-config
          mapfile -t icds < <(dpkg-query -L mesa-vulkan-drivers | grep -E '/vulkan/icd\.d/lvp_icd(\.x86_64)?\.json$' || true)
          if [ "${#icds[@]}" -ne 1 ] || [ ! -f "${icds[0]}" ]; then
            echo "::error::expected exactly one lavapipe ICD manifest, found ${#icds[@]}: ${icds[*]:-none}"
            exit 1
          fi
          echo "VK_DRIVER_FILES=${icds[0]}" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=${icds[0]}" >> "$GITHUB_ENV"
          echo "::notice::mesa-vulkan-drivers $(dpkg-query -W -f='${Version}' mesa-vulkan-drivers), ICD ${icds[0]}"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: support/blitz-v8-probe/js/package-lock.json
      - name: bundle the probe scenarios (include_str! inputs)
        working-directory: support/blitz-v8-probe/js
        run: npm ci && npm run build
      - name: restore Cargo and build cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/roves-cargo/registry/index
            /home/runner/roves-cargo/registry/cache
            /home/runner/roves-cargo/git/db
            ${{ github.workspace }}/../netrender-window-target
          key: netrender-window-linux-rust-1.95.0-${{ hashFiles('support/blitz-v8-probe/netrender-window/Cargo.lock', 'support/netrender-shared-device-proof/prepare-patched.sh', 'support/netrender-shared-device-proof/upstream/*.patch') }}
      - name: prepare the patched wgpu tree (proof's script)
        id: patched
        run: |
          mkdir -p "$RUNNER_TEMP/netrender-window/logs"
          sh support/netrender-shared-device-proof/prepare-patched.sh
      - name: build (published Netrender d2f13ca5)
        run: |
          bash support/netrender-shared-device-proof/ci/cargo-retry.sh "$RUNNER_TEMP/netrender-window/logs/build-negative.log" \
            build --locked --manifest-path "$MANIFEST"
          mkdir -p "$RUNNER_TEMP/netrender-window/negative"
          cp "$CARGO_TARGET_DIR/debug/roves-blitz-v8-probe-netrender" "$RUNNER_TEMP/netrender-window/negative/"
      - name: negative window run (expected to fail exactly the three #after pixels)
        working-directory: support/blitz-v8-probe
        run: |
          log="$RUNNER_TEMP/netrender-window/logs/negative.log"
          set +e
          ROVES_PROBE_WINDOW_RENDERER=netrender ROVES_PROBE_NETRENDER_FIXTURE=1 timeout 900 \
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
            "$RUNNER_TEMP/netrender-window/negative/roves-blitz-v8-probe-netrender" \
            --game fixtures/netrender-window --window --window-frames 90 > "$log" 2>&1
          status=$?
          set -e
          echo "::group::negative (exit $status)"; cat "$log"; echo "::endgroup::"
          python3 -I netrender-window/check_log.py negative "$log" "$status"
      - name: Netrender d2f13ca5 with the proposed order fix
        id: order_fix
        if: ${{ !cancelled() && steps.patched.outcome == 'success' }}
        run: |
          rev=d2f13ca5ecd20df89d148a7cebef28c0962b90ca
          src="$RUNNER_TEMP/netrender"
          rm -rf "$src" && git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/merely-made/netrender "$rev"
          git -C "$src" checkout -q FETCH_HEAD
          [ "$(git -C "$src" rev-parse HEAD)" = "$rev" ] || { echo "::error::Netrender checkout is not $rev"; exit 1; }
          patch="$PWD/support/netrender-shared-device-proof/upstream/netrender-d2f13ca5-external-texture-order.patch"
          stat=$(git -C "$src" apply --numstat "$patch" | awk '{a+=$1; d+=$2} END {print "+" a "/-" d}')
          [ "$stat" = "+41/-5" ] || { echo "::error::order patch is $stat, expected +41/-5"; exit 1; }
          git -C "$src" apply "$patch"
      - name: build (Netrender with the order fix, local path override)
        id: build_positive
        if: ${{ !cancelled() && steps.order_fix.outcome == 'success' }}
        run: |
          lock=support/blitz-v8-probe/netrender-window/Cargo.lock
          cp "$lock" "$RUNNER_TEMP/Cargo.lock.orig"
          # Not --locked: the override rewrites the netrender entries of Cargo.lock.
          bash support/netrender-shared-device-proof/ci/cargo-retry.sh "$RUNNER_TEMP/netrender-window/logs/build-positive.log" \
            build --manifest-path "$MANIFEST" \
            --config "patch.\"https://github.com/merely-made/netrender\".netrender.path=\"$RUNNER_TEMP/netrender/netrender\""
          python3 -I support/netrender-shared-device-proof/ci/verify.py lock-diff "$RUNNER_TEMP/Cargo.lock.orig" "$lock"
          cp "$RUNNER_TEMP/Cargo.lock.orig" "$lock"
          git diff --exit-code -- "$lock"
          mkdir -p "$RUNNER_TEMP/netrender-window/positive"
          cp "$CARGO_TARGET_DIR/debug/roves-blitz-v8-probe-netrender" "$RUNNER_TEMP/netrender-window/positive/"
      - name: positive window run (expected 6/6 on Netrender, no fallback)
        if: ${{ !cancelled() && steps.build_positive.outcome == 'success' }}
        working-directory: support/blitz-v8-probe
        run: |
          log="$RUNNER_TEMP/netrender-window/logs/positive.log"
          set +e
          ROVES_PROBE_WINDOW_RENDERER=netrender ROVES_PROBE_NETRENDER_FIXTURE=1 timeout 900 \
            xvfb-run -a --server-args="-screen 0 1280x720x24" \
            "$RUNNER_TEMP/netrender-window/positive/roves-blitz-v8-probe-netrender" \
            --game fixtures/netrender-window --window --window-frames 90 > "$log" 2>&1
          status=$?
          set -e
          echo "::group::positive (exit $status)"; cat "$log"; echo "::endgroup::"
          python3 -I netrender-window/check_log.py positive "$log" "$status"
      - name: upload logs and executables
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: netrender-window-linux-lavapipe
          path: ${{ runner.temp }}/netrender-window
          if-no-files-found: warn
          retention-days: 14
