name: 'Build Android APK (debug, from source, with local patches)'

# Early Android smoke build: on every push to main, cross-compile the engine for Android and
# package it into a debug .apk, uploaded as a plain workflow artifact (not a GitHub Release —
# see test.yml/release.yml for those). This builds the plain engine shell via `./mach build
# --android` -- no --content-dir, so no bundled game content -- it's the same "engine shell
# only, no bundled content" scope release.yml's first desktop release started with. A game's
# own content goes through `mach bundle --android --content-dir <dist>` instead (see
# CUSTOMIZATIONS.md's "mach bundle --android" entry and post_build_commands.py's
# `_bundle_android`), not wired into this workflow. See CUSTOMIZATIONS.md for why nothing
# needed patching to get *this* far: upstream Servo already ships a complete Android port
# (JNI bridge in ports/servoshell/egl/android/, a real Gradle project under
# support/android/apk/, and full `--android` handling in
# python/servo/platform/build_target.py / build_commands.py / package_commands.py) that
# Roves' own desktop-focused customizations never touched or disabled. `./mach build
# --android` alone is enough: build_commands.py auto-dispatches into `mach package --android`
# (a Gradle assemble task) once the native libservoshell.so cross-compiles, since
# AndroidTarget.needs_packaging() is true.
#
# Same source-reconstruction pattern as test.yml: pristine upstream Servo source for the
# pinned tag, plus every patch under patches/servo-v<tag>/ applied on top — see that
# workflow's own top comment for why (this repo's own pristine content is mostly gitignored).
# Unlike test.yml this isn't scoped to `paths:` — every push to main gets a build, per how
# this workflow was requested.
#
# Debug build only: unsigned beyond the Android Gradle Plugin's own auto-generated debug
# key (servoapp/build.gradle.kts's `release` build type is the one that looks for a real
# signing key — `debug` needs none). Not a distributable release, just a per-commit
# build/smoke check — see release.yml if a signed, versioned Android release is ever needed.
#
# Android cross builds only run on Linux/macOs hosts (enforced by
# python/servo/platform/build_target.py's AndroidTarget) — ubuntu-latest here.
#
# Also publishes two assets to the rolling "test" GitHub Release (same one test.yml uses for
# desktop) that Roves Packmaster's own Android backend (roves-ui/src-tauri/src/android.rs)
# downloads: `roves_android_native_arm64.zip` (the raw compiled `libservoshell.so`, since
# Packmaster never compiles Rust itself) and `roves_android_project.zip` (a snapshot of
# `support/android/apk/`, so Packmaster doesn't need its own git-fetch logic for it). This is
# the only place either asset is published today — Android isn't part of a real, tagged
# release yet (see README.md's "Supported platforms" table), so there's nothing versioned to
# pin Packmaster's own download to.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  SERVO_TAG: '0.4.0'
  # support/android/apk/servoapp/build.gradle.kts's `android {}` block.
  ANDROID_COMPILE_SDK: '37'
  ANDROID_BUILD_TOOLS: '36.0.0'
  TEST_RELEASE_TAG: 'test'

jobs:
  # Mirrors test.yml's own job of the same name -- see that workflow's own comment. Both
  # workflows publish to the same rolling "test" release, so either one creates it first,
  # whichever runs first after the release doesn't exist yet (e.g. right after someone
  # deletes it to retry a failed run).
  ensure-test-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ensure release "test" exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TEST_RELEASE_TAG" 2>/dev/null || \
          gh release create "$TEST_RELEASE_TAG" \
            --title "Servo customization test build" \
            --notes "Rolling test build from source (Servo v${SERVO_TAG} + patches/). Overwritten on every push touching patches/ or android.yml. Not a real release — see release.yml for that." \
            --prerelease \
            2>/dev/null || \
          gh release view "$TEST_RELEASE_TAG" > /dev/null

  build-apk:
    needs: ensure-test-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup python (gives a consistent `python3` across runners, see ./mach)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: setup uv (needed by ./mach, see README.md)
        uses: astral-sh/setup-uv@v5

      - name: setup JDK (Gradle/AGP toolchain for support/android/apk)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # `android-actions/setup-android@v3` used to be here — dropped after a real, reproduced
      # failure (2026-09-01, this exact job): it just points at whatever cmdline-tools happens
      # to already be preinstalled on the `ubuntu-latest` image, and that bundled sdkmanager
      # crashed immediately (4s, before any network activity) once JAVA_HOME pointed at the
      # JDK 21 the step above installs — a known class of issue with older cmdline-tools
      # releases under newer JDKs. Installing a known-fresh cmdline-tools ourselves (same
      # build Roves Packmaster's own `android.rs` downloads, for the same reason: don't trust
      # whatever happens to be preinstalled) sidesteps it entirely and doesn't depend on a
      # third-party action's own choices at all.
      - name: install Android SDK cmdline-tools
        shell: bash
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          rm /tmp/cmdline-tools.zip
          # sdkmanager insists on sitting inside a version-named folder one level below
          # cmdline-tools/ (here, "latest") or it refuses to run at all -- the zip's own top
          # level folder is just "cmdline-tools", not "cmdline-tools/latest".
          mv /tmp/cmdline-tools-extract/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      # python/servo/platform/build_target.py's AndroidTarget.configure_build_environment
      # hard-requires NDK r28 specifically (it reads source.properties and rejects anything
      # else) — resolved dynamically here (rather than a hardcoded exact patch version like
      # `28.0.13004108`) so this doesn't silently go stale if Google ships a later r28.x and
      # retires the first one from the sdkmanager repo.
      #
      # --channel=3 (canary -- the widest channel, superset of stable/beta/dev): Android 17/
      # API 37 is still in preview ("Cinnamon Bun Preview" in Android Studio's own SDK Manager
      # UI as of this writing) even though servoapp/build.gradle.kts already targets
      # `compileSdk = 37`. Applies to every install in this step, since a superset channel is
      # always safe to request.
      #
      # The platform package itself also isn't installable as a plain `platforms;android-37`
      # -- confirmed against the real repository manifest (dl.google.com/android/repository/
      # repository2-3.xml) that, mid-preview, Google publishes it under decimal sub-versions
      # instead (`platforms;android-37.0`/`37.1`/`37.2` as of this writing, likely more later)
      # with no bare `-37` alias yet. Resolved dynamically here for the same reason as the NDK
      # version just below -- pick the newest non-prerelease (`-beta`/`-rc`) match instead of
      # hardcoding one exact sub-version that will itself be superseded.
      - name: install Android SDK components + NDK r28
        shell: bash
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 --licenses >/dev/null || true

          PLATFORM_PKG=$(sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 --list 2>/dev/null \
            | grep -oE "platforms;android-${ANDROID_COMPILE_SDK}(\.[0-9]+)?(-ext[0-9]+)?" \
            | grep -v -- '-beta\|-rc' | sort -V | tail -1)
          if [ -z "$PLATFORM_PKG" ]; then
            echo "::error::no platforms;android-${ANDROID_COMPILE_SDK}* package advertised by sdkmanager --list"
            exit 1
          fi
          echo "Installing $PLATFORM_PKG"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 "platform-tools" "$PLATFORM_PKG" "build-tools;${ANDROID_BUILD_TOOLS}"

          NDK_PKG=$(sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 --list 2>/dev/null | grep -oE 'ndk;28\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          if [ -z "$NDK_PKG" ]; then
            echo "::error::no NDK r28.x package advertised by sdkmanager --list -- Servo currently only supports NDK r28, see build_target.py"
            exit 1
          fi
          echo "Installing $NDK_PKG"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --channel=3 "$NDK_PKG"

          NDK_VERSION="${NDK_PKG#ndk;}"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # rustup ships preinstalled on the ubuntu-latest runner image. We don't install a
      # toolchain explicitly: rustup auto-detects and fetches whatever rust-toolchain.toml in
      # the downloaded Servo source pins, the first time cargo/mach runs inside that directory
      # (`mach build --android` also does its own `rustup target add
      # aarch64-linux-android` the same way, see command_base.py). This just forces the
      # toolchain fetch early, with its own clear log output.
      - name: prefetch pinned rust toolchain
        shell: bash
        run: |
          curl -fsSL -o /tmp/rust-toolchain.toml "https://raw.githubusercontent.com/servo/servo/v${SERVO_TAG}/rust-toolchain.toml"
          mkdir -p /tmp/toolchain-probe && cp /tmp/rust-toolchain.toml /tmp/toolchain-probe/
          cd /tmp/toolchain-probe && rustup show

      # Downloads the *full* pristine tag source (unlike a plain `git clone` of this repo,
      # which gitignores tests/wpt/ — see CUSTOMIZATIONS.md's "mach needs tests/wpt/tests/
      # tools/" note), so mach's own command loader finds everything it needs without a
      # separate sparse-checkout step (release.yml needs one; this reconstruction doesn't).
      - name: download + patch Servo source
        shell: bash
        run: |
          curl -fsSL -o servo-src.zip "https://github.com/servo/servo/archive/refs/tags/v${SERVO_TAG}.zip"
          python3 -c "import zipfile; zipfile.ZipFile('servo-src.zip').extractall('servo-src-tmp')"
          mv "servo-src-tmp/servo-${SERVO_TAG}" servo-src
          rm -rf servo-src-tmp servo-src.zip

          shopt -s nullglob
          patches=(patches/servo-v${SERVO_TAG}/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::No patches found in patches/servo-v${SERVO_TAG}/ — nothing to test."
            exit 1
          fi
          cd servo-src
          chmod +x mach
          for p in "${patches[@]}"; do
            echo "Applying $(basename "$p")..."
            patch -p1 < "../$p"
          done

          # Same reasoning as test.yml's own copy of these: new binary assets no text patch
          # can carry, but gui.rs's/build.rs's include_bytes!() need them to genuinely exist
          # on disk to compile at all.
          mkdir -p resources/fonts
          cp -r ../resources/fonts/. resources/fonts/
          cp ../resources/servo_64.png ../resources/servo_1024.png ../resources/servo.ico ../resources/servo.icns resources/

      # Same dpkg-lock race as test.yml's own copy of this step — confirmed to affect
      # `mach bootstrap`'s own internal apt-get calls too, not just ones we issue ourselves.
      - name: stop background apt processes and wait for the dpkg lock
        shell: bash
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo pkill -9 -f unattended-upgrade 2>/dev/null || true

          for i in $(seq 1 60); do
            if ! sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
              echo "dpkg/apt lock free after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::dpkg/apt lock still held after 60s -- proceeding anyway"

      # No --skip-platform: Linux's own bootstrap path installs GStreamer non-interactively
      # already (apt packages, covered by --yes) — see test.yml for why that only matters on
      # Windows. Moot for the Android build itself anyway: cross builds default to the
      # `dummy` media stack (see command_base.py's is_media_enabled), so `mach build
      # --android` below never touches GStreamer at all.
      - name: mach bootstrap (installs build dependencies)
        shell: bash
        working-directory: servo-src
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 15
        run: ./mach bootstrap --force --yes --skip-lints --skip-nextest

      # Debug profile (no --release): this is a per-commit smoke/artifact build, not a
      # distributable release — see release.yml if that's ever needed. This single command
      # both cross-compiles libservoshell.so for aarch64-linux-android (the default target,
      # see AndroidTarget.DEFAULT_TRIPLE) *and* packages it into a debug .apk via Gradle —
      # see build_commands.py's `needs_packaging()` dispatch into `mach package --android`.
      - name: mach build --android (also auto-packages the APK via Gradle)
        shell: bash
        working-directory: servo-src
        run: ./mach build --android

      - name: locate built APK
        id: apk
        shell: bash
        working-directory: servo-src
        run: |
          APK=$(find support/android/apk -iname '*.apk' -path '*Debug*' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no debug .apk found under support/android/apk/**/build/outputs/apk -- contents:"
            find support/android/apk -iname '*.apk'
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: roves_shell_android_debug
          path: servo-src/${{ steps.apk.outputs.path }}

      # Packmaster's own Android backend (roves-ui/src-tauri/src/android.rs) never compiles
      # Rust or runs `mach` itself -- it downloads this raw .so (built here, where the NDK/
      # Rust toolchain already exist) and drives Gradle/ndk-build locally to package it with a
      # game's own content. aarch64 (the default `mach build --android` target above) covers
      # virtually every real Android device; no other ABI is published yet.
      - name: package native library for Packmaster
        id: native
        shell: bash
        working-directory: servo-src
        run: |
          SO=$(find target/aarch64-linux-android -maxdepth 2 -name 'libservoshell.so' | head -1)
          if [ -z "$SO" ]; then
            echo "::error::no libservoshell.so found under target/aarch64-linux-android -- contents:"
            find target/aarch64-linux-android -maxdepth 3
            exit 1
          fi
          zip -j ../roves_android_native_arm64.zip "$SO"
          echo "path=roves_android_native_arm64.zip" >> "$GITHUB_OUTPUT"

      # The Gradle project itself (support/android/apk/) barely ever changes on its own --
      # published fresh every run anyway (not conditioned on patches/ changing, matching this
      # workflow's own on.push scope) so Packmaster always gets an exact match for whichever
      # patches/engine behavior it's also targeting via the native .so above.
      - name: package Android project for Packmaster
        id: project
        shell: bash
        working-directory: servo-src
        run: |
          zip -rq ../roves_android_project.zip support/android/apk
          echo "path=roves_android_project.zip" >> "$GITHUB_OUTPUT"

      # Retries: see test.yml's own identical step/comment -- every matrix job (there, 6; here
      # just this one, but android.yml's own build-apk job can still race a concurrent test.yml
      # run uploading to the same "test" release at the same time).
      - name: upload to "test" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for asset in roves_android_native_arm64.zip roves_android_project.zip; do
            for attempt in 1 2 3; do
              gh release upload "$TEST_RELEASE_TAG" "$asset" --clobber && break
              echo "upload attempt $attempt for $asset failed, retrying in $((attempt * 10))s..." >&2
              sleep $((attempt * 10))
              if [ "$attempt" = "3" ]; then
                echo "::error::failed to upload $asset after 3 attempts"
                exit 1
              fi
            done
          done
