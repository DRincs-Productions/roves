[package]
name = "roves-js"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "The `js` (mozjs) API surface Servo's script crates use, implemented on V8 through roves-v8. Swapping the workspace `js` dependency to this crate is the V8 cutover (see ../../docs/V8_MIGRATION.md)."

[lib]
name = "js"
path = "src/lib.rs"
# The bindgen types keep SpiderMonkey's C++ doc comments, whose code blocks are not Rust.
doctest = false

[dependencies]
roves-v8 = { path = "../roves-v8" }
# roves-js is the engine layer (as mozjs is for SpiderMonkey), so it uses V8 directly; no V8
# type may appear in the DOM or shell APIs built on top of it. The same crate deno_core links
# (deno_v8 0.5.0 -> v8 150.4.0): one V8 in the binary.
v8 = "=150.4.0"
# Owns each runtime's isolate, its single script context, the ES module graph and the
# module/async event loop (see `rust::Runtime` and `deno_impl`). Default features: the V8
# backend, `reactor-tokio` (required by its realm code) and the prebuilt archives' libc++.
# No Deno extension, op or namespace is exposed to scripts (see `deno_impl`).
deno_core = "=0.413.0"
# Already used by Deno; public source-map generation for inline HTML diagnostics.
sourcemap = "=9.3.2"
# The current-thread reactor deno_core's futures and blocking static module loads run on.
tokio = { version = "1", features = ["rt"] }
# Used by the conversions ported from mozjs.
encoding_rs = "0.8.35"
libc = "0.2.189"
log = "0.4.33"
num-traits = "0.2.19"
# Inline reserved slots of class objects (see `object::ClassBox`).
smallvec = "1.15"
# The identity table of object cells (see `cell::Interned`).
rustc-hash = "2.1"

# The mozjs features Servo's crates request; they have no meaning on V8.
[features]
crown = []
intl = []
jit = []
jitspew = []
libz-sys = []

# V8 without its JIT compilers (see ../../docs/V8_MIGRATION.md, "JIT-less"): servoshell
# builds it with `--features roves-js/jitless`.
jitless = ["roves-v8/jitless"]
