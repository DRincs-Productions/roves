[package]
name = "servo-allocator"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
path = "lib.rs"

[features]
allocation-tracking = ["backtrace", "dep:rustc-hash", "log"]
use-system-allocator = ["libc"]
# mimalloc global allocator (Roves): always on for Windows, opt-in elsewhere. Mutually exclusive
# with use-system-allocator.
use-mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
backtrace = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
libmimalloc-sys = { version = "0.1.49", optional = true, default-features = false, features = ["extended"] }
mimalloc = { version = "0.1.52", optional = true, default-features = false }

[target.'cfg(not(windows))'.dependencies]
libc = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true }
tikv-jemallocator = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }
# mimalloc is the Windows default; `use-system-allocator` opts back into the system heap.
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
mimalloc = { version = "0.1.52", default-features = false }
